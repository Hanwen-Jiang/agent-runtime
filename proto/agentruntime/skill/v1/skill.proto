syntax = "proto3";

package agentruntime.skill.v1;

import "agentruntime/common/v1/payload.proto";
import "agentruntime/registry/v1/registry.proto";

// SkillService 管理用户自己的 Skill（N-14，docs/plan/n14-skill-contract.md），与 Task API 同一个端口、同样经 Ingress 认证。
// 存在 Registry 里（种类 SKILL，用户层）。
//
// 用户由认证身份确定，请求里没有用户字段：只能发布、收回自己的 Skill，带 task.approve 的令牌也不能动别人的；
// 请求里的 tenant_id 只用来校验一致。租户层与平台层的 Skill 由运维经 Registry 的 Publish 发布（要发布令牌），这里只读。
// 看得到的范围：平台层、本租户的租户层、本人的用户层。别人的用户层与不存在的一样是 NotFound（code 为 skill_not_found）。
// 正文只进 Registry 与读它的 Task：响应之外的日志、trace、审计记录里没有正文；审计只记（租户，用户，name，版本，动作，时间）。
service SkillService {
  // 发布一个用户层的 Skill：没有同名的时是 user/v1，有时是下一个版本（当前版本变为 RETIRED），立即成为当前版本；
  // 已经固定了旧版本的 Task 照旧读旧版本。正文与当前版本相同（digest 相同）时不产生新版本，created 与 new_version 都是 false。
  // 平台层或本租户的租户层已有这个名字时 Conflict（code 为 name_taken）。每个用户最多 100 个没收回的 Skill，
  // 超出时 ResourceExhausted（code 为 skill_limit）。正文不合 /schemas/skill.schema.json、超过 256 KiB、文件路径重复
  // 时 InvalidArgument（code 为 invalid_document、skill_too_large、duplicate_path）；名字不合规时 invalid_name。
  rpc PutSkill(PutSkillRequest) returns (PutSkillResponse);
  // 列出调用者看得到的当前版本，不带正文，按名字排序：平台层、租户层、本人的用户层（本人的被遮住的也列出，shadowed 为 true）。
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse);
  // 取一个 Skill 的正文；version 为空时取看得到的当前版本。
  rpc GetSkill(GetSkillRequest) returns (GetSkillResponse);
  // 收回本人的一个用户层 Skill：当前版本变为 RETIRED，不再进目录、不再被新 Task 固定；已经固定了它的 Task 照旧读。
  // 之后再用这个名字 PutSkill 接着编号。幂等：没有当前版本时 retired 为 false。不是本人的用户层 Skill 时 NotFound。
  rpc RetireSkill(RetireSkillRequest) returns (RetireSkillResponse);
}

message PutSkillRequest {
  string tenant_id = 1;
  string name = 2;
  // 正文，按 /schemas/skill.schema.json。
  agentruntime.common.v1.JsonPayload document = 3;
}

message PutSkillResponse {
  agentruntime.registry.v1.Skill skill = 1;
  // true 表示这个名字第一次登记（user/v1）。
  bool created = 2;
  // true 表示产生了新版本；正文与当前版本相同时为 false。
  bool new_version = 3;
}

message ListSkillsRequest {
  string tenant_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListSkillsResponse {
  repeated agentruntime.registry.v1.Skill skills = 1;
  string next_page_token = 2;
}

message GetSkillRequest {
  string tenant_id = 1;
  string name = 2;
  // platform/vN、tenant/vN 或 user/vN；为空时取当前版本。
  string version = 3;
}

message GetSkillResponse {
  agentruntime.registry.v1.Skill skill = 1;
}

message RetireSkillRequest {
  string tenant_id = 1;
  string name = 2;
}

message RetireSkillResponse {
  bool retired = 1;
  // 被收回的版本（user/vN）；retired 为 false 时为空。
  string version = 2;
}
