syntax = "proto3";

package agentruntime.workspace.v1;

import "google/protobuf/timestamp.proto";

// WorkspaceService 是 Task API 之外管理工作区的一组接口（设计书改动稿 W2、新增 4.10.1；docs/plan/cloud-deploy.md D-06），
// 与 Task API 同一个端口、同样经 Ingress 认证。
//
// 工作区属于（租户，workspace_id），生命周期跨 Task；文件放在承载它的沙箱环境里，空闲时存档到 ObjectStore，用时恢复。
// 租户由认证身份确定，请求里的 tenant_id 只用来校验一致；别的租户的工作区一律 NotFound。
// 克隆与推送的凭据（GitCredential）由应用随请求传入，只在这一次调用里用：Runtime 不保存，不进日志、事件历史与错误信息。
// 路径（ListFiles、ReadFile、InitialFile）：相对工作区根、用 / 分隔；绝对路径、盘符、空段、. 与 ..、反斜杠、NUL 一律
// InvalidArgument；任何一级是 .git 也是 InvalidArgument（.git 只经 git 操作，不直接给应用读）。
service WorkspaceService {
  // 建一个工作区：给了 repo_url 时克隆它（可以带 ref，ref 可以是一个提交；可以带 files，克隆之后写入并另做一次提交）；
  // 给了 from_workspace_id 时复制同租户的另一个工作区；都没给时 git init，再写入 files 并做一次初始提交（没有 files 时不提交）。
  // from_workspace_id 与另两种来源不能同给。已有同名的工作区时 AlreadyExists。
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse);
  // 列出本租户的工作区（不含已删除的）。
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  // 工作区相对 base 的改动，内容与在承载它的沙箱里执行 git diff <base> 相同（base 为空时是相对 HEAD，含暂存与未暂存）。
  rpc GetDiff(GetDiffRequest) returns (GetDiffResponse);
  // 把工作区里的改动（含新文件）提交成一个 commit；没有改动时 committed 为 false。
  rpc CommitWorkspace(CommitWorkspaceRequest) returns (CommitWorkspaceResponse);
  // 推送到远端的分支：write_irreversible，这次调用本身是调用者的批准（gate 记录写进业务库）；分支要符合租户策略的
  // workspace.push_branches（默认 agent/*）。幂等键含提交的 sha；超时时先按远端分支的当前 sha 对账，不直接重推。
  rpc PushWorkspace(PushWorkspaceRequest) returns (PushWorkspaceResponse);
  // 立即存档（逐文件按 sha256 内容寻址的分块与清单，写进 ObjectStore）。
  rpc ArchiveWorkspace(ArchiveWorkspaceRequest) returns (ArchiveWorkspaceResponse);
  // 删除工作区与它的存档，销毁承载它的环境。
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse);
  // 列一个目录（不写 path 为工作区根）：按名字排序，最多 1000 项（truncated）；不列 .git；不跟随符号链接。目录不存在时 NotFound。
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  // 读一个文件：超过 512 KiB 时 too_large、不给内容；前 8 KiB 里有 NUL 时 binary、不给内容；其余按 UTF-8 给出 content
  // （不合法的字节换成 U+FFFD）。不存在或是目录时 NotFound。
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  // 最近的提交（从 HEAD 往回，新的在前）；给了 base 时只给 HEAD 有、base 没有的提交（git log base..HEAD）。
  // base 不存在时 NotFound；还没有提交时为空。
  rpc GetLog(GetLogRequest) returns (GetLogResponse);
  // 丢弃未提交的改动：回到 HEAD，删掉未跟踪的文件与目录（.gitignore 忽略的不删）。返回 HEAD。
  rpc DiscardChanges(DiscardChangesRequest) returns (DiscardChangesResponse);
  // 从远端取 branch 的最新提交，把工作区切到这个分支的这个提交上（PR 合并之后开始下一轮）。要求没有未提交的改动
  // （否则 AlreadyExists，code 为 workspace_dirty）；远端是建工作区时的 repo_url（从别的工作区复制的沿用那边的），
  // 没有远端时 InvalidArgument。凭据同 PushWorkspace，只用这一次。
  rpc SyncWorkspace(SyncWorkspaceRequest) returns (SyncWorkspaceResponse);
  // 删除一个环境配置（ENV-02，Q35）：立即把调用者用它建的工作区上的选用配置标记为已删除，之后这些工作区不再建新的沙箱
  // 环境（FailedPrecondition，environment_deleted）；已有的沙箱环境由现有的对账（sandbox reconcile）在闲着时异步销毁。
  // 不删工作区，环境表（EnvironmentService）仍是状态的权威。幂等：再删一次 workspaces 为 0。只认调用者自己选用的
  // （建工作区的用户），别人的不动。
  rpc DeleteEnvironmentConfig(DeleteEnvironmentConfigRequest) returns (DeleteEnvironmentConfigResponse);
  // 给已有的工作区设置（或清除：不给 environment）选用的环境配置（ENV-02）：应用建好会话的工作副本之后、第一个 Task 之前调用，
  // 与 CreateWorkspaceRequest.environment 的效果相同。只影响之后新准备的沙箱环境；已经准备好的环境不重跑 setup。
  // 调用者记为选用它的用户（网络密钥按他的名字读，删除环境配置只认他）。工作区不存在时 NotFound。
  rpc SetWorkspaceEnvironment(SetWorkspaceEnvironmentRequest) returns (SetWorkspaceEnvironmentResponse);
}

// GitCredential 是克隆或推送用的凭据（例如 HTTPS 的用户名与令牌），只用这一次。
message GitCredential {
  string username = 1;
  string password = 2;
}

enum WorkspaceState {
  WORKSPACE_STATE_UNSPECIFIED = 0;
  WORKSPACE_STATE_ACTIVE = 1;
  WORKSPACE_STATE_ARCHIVED = 2;
  WORKSPACE_STATE_DELETED = 3;
}

message Workspace {
  string workspace_id = 1;
  WorkspaceState state = 2;
  // 克隆的来源，不带凭据。
  string repo_url = 3;
  // 当前的 commit。
  string head = 4;
  // 最近一次存档。
  string snapshot_id = 5;
  int64 size_bytes = 6;
  int32 files = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // 当前的分支；分离头指针或还不知道时为空。
  string branch = 10;
  // 建工作区时选用的环境配置的 ID（应用的环境 ID）；没有选用时为空。配置的内容不回显（ENV-02）。
  string environment_id = 11;
}

// WorkspaceEnvironment 是应用保存的可复用环境配置（人工验收 Q16–37；docs/plan/env-02-implementation-2026-11-03.md）
// 在建工作区时的一份快照：环境与仓库无关，同一个环境可以用于多个工作区；之后编辑环境只影响新建的工作区。
// 里面只有普通值与密钥的名字，没有密钥的值；Runtime 按（租户，工作区）保存这份快照，SandboxBroker 建环境时读它。
// 环境的状态（setup 是否成功、是否就绪）只以 EnvironmentService 的环境表为准，不从日志推断。
message WorkspaceEnvironment {
  // 应用的环境 ID：字母、数字、_ 与 -，最多 128 个字符。删除环境（DeleteEnvironmentConfig）按它找。
  string environment_id = 1;
  // 安装脚本（Bash）：每个新的沙箱环境建好、工作区恢复之后，执行任何业务命令之前跑一次（工作区根为当前目录）；
  // 失败或超时则这个环境不启动（不执行任何业务命令，错误码 environment_setup_failed / environment_setup_timeout）。
  // 成功的结果按 sha256（脚本内容 + 基础镜像 digest）缓存，失败不缓存、下次重跑。最多 64 KiB。
  string setup_script = 2;
  // 启动命令（Bash）：setup 成功之后启动交互运行时（例如后台服务），不安装依赖；要在时限内返回，长期运行的进程放到后台。
  // 失败只记录、不阻止业务命令。最多 64 KiB。
  string start_command = 3;
  // 普通环境变量，.env 格式：一行一个 KEY=value，# 开头的行与空行忽略；值原样（不做引号与变量展开）。
  // 交给 setup、start 与每条命令，环境的使用者看得到：不要放机密（机密用 secret_headers 引用）。
  // 最多 64 个、合计 16 KiB；名字规则同 Sandbox 的 exec env，不能盖掉平台注入的变量（代理、包镜像等）。
  string env = 4;
  EnvironmentNetwork network = 5;
  // 网络密钥：出网网关只在向这些 HTTPS 主机（443）的请求上加请求头，值取自 SecretStore；模型与沙箱都拿不到值。
  repeated SecretHeader secret_headers = 6;
}

// NetworkMode 是环境的联网档位（Q29）。在 Task 的联网授权与租户策略之内再收窄，不能放宽它们。
enum NetworkMode {
  // 旧客户端：环境不另加限制（同 OPEN）。
  NETWORK_MODE_UNSPECIFIED = 0;
  // 完全开放：环境不另加限制，放行范围由 Task 的联网授权与租户策略决定。
  NETWORK_MODE_OPEN = 1;
  // 受限列表：只放行 hosts 里的主机（另要 Task 的授权覆盖它）。
  NETWORK_MODE_RESTRICTED = 2;
  // 禁止：业务出网一律拒绝（包镜像与 Workspace API 自己的 git 操作不受影响）。
  NETWORK_MODE_DENY = 3;
}

message EnvironmentNetwork {
  NetworkMode mode = 1;
  // RESTRICTED 时的主机名单，最多 50 个。
  repeated NetworkHost hosts = 2;
}

// NetworkHost 是一个域名（小写，不能是 IP 或内网名字）；子域名是否匹配显式配置（Q30）。
message NetworkHost {
  string host = 1;
  // true 时 a.host、b.a.host 也匹配；false 时只匹配 host 本身。
  bool include_subdomains = 2;
}

// SecretHeader：向 host 的 HTTPS 请求由出网网关加上一个请求头（Q28、Q31、Q32）。只在 443 端口、TLS 上生效；
// 不写进 URL 的查询参数；重定向到别的主机的请求不带（那是另一个请求，按那台主机自己的配置）。
message SecretHeader {
  string host = 1;
  bool include_subdomains = 2;
  // 本用户在 SecretStore 里的密钥名（不是值）：租户作用域的 user-secrets/<建工作区的用户>/<secret_name>。
  // 字母、数字、.、_ 与 -，最多 128 个字符。
  string secret_name = 3;
  // 请求头的名字；为空时是 Authorization，值为 "Bearer <密钥>"；别的名字（例如 x-api-key）值为密钥原文。
  string header = 4;
}

// InitialFile 是建空工作区时写入的一个文件（例如示例项目）。
message InitialFile {
  // 相对工作区根的路径，规则见 WorkspaceService 的说明。
  string path = 1;
  // 文件内容（UTF-8 文本）。全部 files 合计最多 1 MiB、200 个。
  string content = 2;
}

message CreateWorkspaceRequest {
  // 只用来与认证身份做一致性校验。
  string tenant_id = 1;
  // 格式同租户 ID。
  string workspace_id = 2;
  // 为空时建空的工作区（git init）。只接受 https 地址；主机要在租户策略的 sandbox.network.hosts 范围里。
  string repo_url = 3;
  // 分支、标签，或完整的提交（40 位或 64 位十六进制）；为空时用远端的默认分支。给提交时只取到这个提交为止的历史，
  // 不取远端的分支与标签（克隆下来看不到这个提交之后的提交），HEAD 分离在这个提交上（branch 为空）；远端没有这个提交时 NotFound。
  string ref = 4;
  GitCredential credential = 5;
  // 复制同租户的这个工作区：内容是它最近的状态（含 .git 与未提交的改动；存档模式下是它最近的快照，复制前先给它闲着的
  // 可写环境存一份），远端（repo_url）也沿用。不存在时 NotFound。与 repo_url、files 互斥。
  string from_workspace_id = 6;
  // 建空工作区时写入的文件，写完做一次初始提交（提交说明 Initial commit，作者见下）。与 repo_url 一起给时，克隆之后写入
  // （同名的文件覆盖）、另做一次提交（提交说明 Add workspace files），workspace.head 是这次提交。与 from_workspace_id 互斥。
  repeated InitialFile files = 7;
  // 初始提交（或克隆之后写入文件的那次提交）的作者；为空时用 Agent Runtime 的默认作者。
  string author_name = 8;
  string author_email = 9;
  // 选用的环境配置（ENV-02）：在这个工作区上建的每个沙箱环境都按它准备（setup、start、.env、联网、网络密钥）。
  // 为空时保持原行为。可以与任一来源同给（应用新建会话时复制基线工作区并选用环境）。
  WorkspaceEnvironment environment = 10;
}

message CreateWorkspaceResponse {
  Workspace workspace = 1;
}

message ListWorkspacesRequest {
  string tenant_id = 1;
}

message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
}

message GetDiffRequest {
  string tenant_id = 1;
  string workspace_id = 2;
  // commit、分支或标签；为空时相对 HEAD。
  string base = 3;
  // 检测改名（git diff --find-renames）：改名的文件在 diff 与 stats 里是一项，不是一删一加。
  bool find_renames = 4;
}

// DiffStat 是一个改动文件的行数（git diff --numstat）。
message DiffStat {
  // 改名时是新路径。
  string path = 1;
  int32 added = 2;
  int32 deleted = 3;
  // 二进制文件没有行数（added、deleted 为 0）。
  bool binary = 4;
}

message GetDiffResponse {
  // git diff 的输出（超过上限时截断）。
  string diff = 1;
  // 改动的文件（相对仓库根，含未跟踪的新文件）。
  repeated string files = 2;
  bool truncated = 3;
  string head = 4;
  // 每个改动文件的行数，与 files 同序。
  repeated DiffStat stats = 5;
  // 当前的分支；分离头指针时为空。
  string branch = 6;
}

message CommitWorkspaceRequest {
  string tenant_id = 1;
  string workspace_id = 2;
  string message = 3;
  string author_name = 4;
  string author_email = 5;
}

message CommitWorkspaceResponse {
  string sha = 1;
  // 没有改动时为 false，sha 是原来的 HEAD。
  bool committed = 2;
}

message PushWorkspaceRequest {
  string tenant_id = 1;
  string workspace_id = 2;
  // 远端的分支名，例如 agent/fix-ci。
  string branch = 3;
  GitCredential credential = 4;
}

message PushWorkspaceResponse {
  string sha = 1;
  string branch = 2;
  // true 表示这次没有真的推：远端分支已经是这个 sha（重复调用或超时后对账）。
  bool reconciled = 3;
}

message ArchiveWorkspaceRequest {
  string tenant_id = 1;
  string workspace_id = 2;
}

message ArchiveWorkspaceResponse {
  string snapshot_id = 1;
  int32 files = 2;
  int64 size_bytes = 3;
}

message DeleteWorkspaceRequest {
  string tenant_id = 1;
  string workspace_id = 2;
}

message DeleteWorkspaceResponse {}

enum FileType {
  FILE_TYPE_UNSPECIFIED = 0;
  FILE_TYPE_FILE = 1;
  FILE_TYPE_DIRECTORY = 2;
  FILE_TYPE_SYMLINK = 3;
}

// FileEntry 是目录里的一项。
message FileEntry {
  string name = 1;
  FileType type = 2;
  // 只有普通文件有。
  int64 size = 3;
}

message ListFilesRequest {
  string tenant_id = 1;
  string workspace_id = 2;
  // 目录；为空时是工作区根。
  string path = 3;
}

message ListFilesResponse {
  repeated FileEntry entries = 1;
  // 超过 1000 项时只给前 1000 项。
  bool truncated = 2;
}

message ReadFileRequest {
  string tenant_id = 1;
  string workspace_id = 2;
  string path = 3;
}

message ReadFileResponse {
  int64 size = 1;
  // 超过 512 KiB：不给内容。
  bool too_large = 2;
  // 二进制文件：不给内容。
  bool binary = 3;
  string content = 4;
}

message GetLogRequest {
  string tenant_id = 1;
  string workspace_id = 2;
  // 最多几个提交：0 时 30，最多 200。
  int32 limit = 3;
  // commit、分支（含 origin/<分支>）或标签；给了时只给 HEAD 有、它没有的提交。
  string base = 4;
}

// Commit 是一个提交。
message Commit {
  string sha = 1;
  string author_name = 2;
  string author_email = 3;
  google.protobuf.Timestamp authored_at = 4;
  // 提交说明的第一行。
  string subject = 5;
}

message GetLogResponse {
  repeated Commit commits = 1;
}

message DiscardChangesRequest {
  string tenant_id = 1;
  string workspace_id = 2;
}

message DiscardChangesResponse {
  string head = 1;
}

message SyncWorkspaceRequest {
  string tenant_id = 1;
  string workspace_id = 2;
  // 远端的分支名，例如 main。
  string branch = 3;
  GitCredential credential = 4;
}

message SyncWorkspaceResponse {
  // 切过去之后的 HEAD。
  string head = 1;
  string branch = 2;
}

message DeleteEnvironmentConfigRequest {
  string tenant_id = 1;
  string environment_id = 2;
}

message DeleteEnvironmentConfigResponse {
  // 这次新标记为已删除的工作区个数（已经标记过的不算）。
  int32 workspaces = 1;
}

message SetWorkspaceEnvironmentRequest {
  string tenant_id = 1;
  string workspace_id = 2;
  // 为空时清除选用的环境配置。
  WorkspaceEnvironment environment = 3;
}

message SetWorkspaceEnvironmentResponse {
  Workspace workspace = 1;
}
