syntax = "proto3";

package agentruntime.workspace.v1;

import "google/protobuf/timestamp.proto";

// UserSecretService 管理用户自己的网络密钥（SEC-API；ENV-02 的 SecretHeader 引用它们），与 Task API 同一个端口、
// 同样经 Ingress 认证。
//
// 密钥属于（租户，用户），存放在 SecretStore 租户作用域的 user-secrets/<用户>/<name>，出网网关按 SecretHeader.secret_name
// 现读（不缓存）。用户由认证身份确定，请求里没有用户字段：只能管自己的密钥，带 task.approve 的令牌也不能动别人的；
// 请求里的 tenant_id 只用来校验一致。
// 值只进不出：任何响应、错误信息、日志、trace、审计记录里都没有值（也没有值的片段或长度）；审计只记（租户，用户，name，
// 动作，时间）。
// name：字母、数字、.、_ 与 -，最多 128 个字符（同 SecretHeader.secret_name），区分大小写；不合规时 InvalidArgument。
service UserSecretService {
  // 写入一个密钥：没有同名的时新建，有时整个替换（之后的请求用新值；已经发出的请求不受影响）。
  // 每个用户最多 100 个，超出时 ResourceExhausted（code 为 user_secret_limit）。
  rpc PutUserSecret(PutUserSecretRequest) returns (PutUserSecretResponse);
  // 列出调用者自己的密钥：只有名字与时间，按 name 排序。
  rpc ListUserSecrets(ListUserSecretsRequest) returns (ListUserSecretsResponse);
  // 删除一个密钥，立即生效：之后出网网关读不到它，引用它的主机的请求被拒绝（不带头放行）。
  // 引用它的环境配置不变。幂等：不存在时 deleted 为 false。
  rpc DeleteUserSecret(DeleteUserSecretRequest) returns (DeleteUserSecretResponse);
}

// UserSecret 是一个密钥的元数据，不含值。
message UserSecret {
  string name = 1;
  google.protobuf.Timestamp created_at = 2;
  // 最近一次写入（替换）的时间。
  google.protobuf.Timestamp updated_at = 3;
}

message PutUserSecretRequest {
  string tenant_id = 1;
  string name = 2;
  // 密钥原文，按 UTF-8 计最多 8 KiB，不能为空；会被放进 HTTP 请求头，所以不能含控制字符（水平制表符除外），
  // 不合规时 InvalidArgument（错误信息只说哪条规则，不带值）。不做首尾空白的修剪。
  string value = 3;
}

message PutUserSecretResponse {
  UserSecret secret = 1;
  // true 表示新建，false 表示替换了已有的。
  bool created = 2;
}

message ListUserSecretsRequest {
  string tenant_id = 1;
}

message ListUserSecretsResponse {
  repeated UserSecret secrets = 1;
}

message DeleteUserSecretRequest {
  string tenant_id = 1;
  string name = 2;
}

message DeleteUserSecretResponse {
  bool deleted = 1;
}
