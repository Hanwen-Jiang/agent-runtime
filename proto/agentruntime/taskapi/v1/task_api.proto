syntax = "proto3";

package agentruntime.taskapi.v1;

import "agentruntime/common/v1/enums.proto";
import "agentruntime/common/v1/metering.proto";
import "agentruntime/common/v1/payload.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// TaskService 是 Runtime 对外唯一的一组 Task API（设计书 3.1.1）。Ingress 完成认证与租户识别后调用它。
//
// 租户由服务端根据认证身份确定。请求里的 tenant_id 可以留空，填了就必须与认证身份一致，否则返回 denied。
// 请求里不接受 TenantContext。
service TaskService {
  // 提交一条命令，立即返回 task_id 与 SSE 订阅地址（设计书 2.5）。
  // 同一 Session 内 client_request_id 相同的重复提交返回同一个 task_id。
  rpc SubmitTask(SubmitTaskRequest) returns (SubmitTaskResponse);
  // 取消 Task。排队中的直接移出队列；运行中的转为 Task 子工作流的 cancel。
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
  // 控制指令，例如人工回复，转为工作流信号。
  rpc SignalTask(SignalTaskRequest) returns (SignalTaskResponse);
  // 查询 Task 的状态与 Task State。
  rpc QueryTask(QueryTaskRequest) returns (QueryTaskResponse);
  // 列出 Task 交付的文件（N-18，docs/plan/n18-file-delivery-f3.md），只给元数据。
  // 内容从 download_path（GET，同一个 Task API 地址，带同样的认证）取：每次都重新核对租户、Task 与有效期。
  rpc ListTaskArtifacts(ListTaskArtifactsRequest) returns (ListTaskArtifactsResponse);
  // 一次取回一个 Session 里若干 Task 的事件（HIST-01，docs/plan/workspace-read-latency-and-disk-2026-11-03.md）：
  // 每个 Task 给一个游标 after_event_id，返回游标之后的事件（业务库里记下的，按 event_id 排序，与 SSE 的 data 相同），
  // 一页不够时 more 为真、拿 next_after_event_id 再取。客户端刷新时用它代替逐个 Task 重放 SSE；之后只对没结束的 Task 开 SSE 续传。
  // 逐字的增量（token_delta、thinking_delta）不在其中。别的租户、别的 Session 的 Task 当作不存在。
  rpc ListSessionEvents(ListSessionEventsRequest) returns (ListSessionEventsResponse);
}

message SubmitTaskRequest {
  // 只用来与认证身份做一致性校验。
  string tenant_id = 1;
  string workspace_id = 2;
  // 为空时新建 Session。
  string session_id = 3;
  // 客户端生成的提交 ID，用于去重。
  string client_request_id = 4;
  // 用户命令原文。
  string message = 5;
  // 附带的结构化输入。
  google.protobuf.Struct inputs = 6;
  // 用户附带的文件，obj:// 引用。
  repeated string attachments = 7;
  agentruntime.common.v1.SessionAccess session_access = 8;
  agentruntime.common.v1.Priority priority = 9;
  // 这个 Task 的 effect 上限，只能比租户策略的上限低或相等；高于时返回 denied（不悄悄截断）。
  // 不填时用租户策略的上限。应用按用户选的沙箱等级填它（docs/plan/cloud-deploy.md D-08）。
  agentruntime.common.v1.Effect effect_ceiling = 10;
  // 这个 Task 要联网（设计书改动稿 W8；docs/plan/cloud-deploy.md D-16）。沙箱默认断网；按租户策略的 sandbox.network 核对，
  // 不允许联网、主机不在范围里、时长超过上限、只读的 Task（effect 上限是 read）一律 denied 并说明原因，不悄悄截断。
  NetworkRequest network_request = 11;
}

// NetworkRequest 是提交时声明的联网申请。批准：租户策略的 approver 是 submitter（默认）时，提交本身就是提交者的批准；
// 是 admin 时只接受带审批权限（task.approve）的身份提交，否则 denied（改为运行中由 agent 经 request_network 申请、管理员批）。
// 批准的申请成为这个 Task 的联网授权（gate 记录，附录 D.4），从提交时起算；Task 结束、到期或被撤销即收回。
message NetworkRequest {
  // 目标主机，可以用 *. 开头表示子域名；不能是 IP 地址，不带端口与路径。
  repeated string hosts = 1;
  // 端口；不填为 80 与 443。
  repeated int32 ports = 2;
  // 授权多久（分钟）：15、30 或 60，不超过租户策略的 max_grant_minutes。
  int32 minutes = 3;
  // 为什么要联网，记进授权与审计。
  string reason = 4;
}

message SubmitTaskResponse {
  string task_id = 1;
  string session_id = 2;
  // SSE 订阅地址。
  string events_url = 3;
  // true 表示命中了已有的提交，返回的是原来的 task_id。
  bool deduplicated = 4;
}

message CancelTaskRequest {
  string tenant_id = 1;
  string task_id = 2;
  string reason = 3;
}

message CancelTaskResponse {
  agentruntime.common.v1.TaskStatus status = 1;
}

message SignalTaskRequest {
  string tenant_id = 1;
  string task_id = 2;
  oneof signal {
    HumanReply human_reply = 3;
    SubmitGuidance submit_guidance = 4;
    EditGuidance edit_guidance = 5;
    RetractGuidance retract_guidance = 6;
    EditQueuedMessage edit_queued_message = 7;
  }
}

message SignalTaskResponse {}

// SubmitGuidance 给运行中的 Task 加一条纠偏，不开新 Task（设计书 3.2.2、附录 C.2）。
// 结果由事件 guidance_updated 告诉客户端（信号没有返回值）。
message SubmitGuidance {
  // 客户端生成，同一个 Task 里唯一；重发同一个 id 不算新的一条。撤回与修改靠它。
  string guidance_id = 1;
  string text = 2;
  agentruntime.common.v1.GuidanceMode mode = 3;
}

// EditGuidance 修改一条还没生效的纠偏；已经生效的被拒绝（guidance_updated 的 state 为 rejected）。
message EditGuidance {
  string guidance_id = 1;
  string text = 2;
}

// RetractGuidance 撤回一条还没生效的纠偏；已经生效的被拒绝。立刻打断发出去就生效了，不能撤回。
message RetractGuidance {
  string guidance_id = 1;
}

// EditQueuedMessage 修改还在排队的 Task 的消息，在队列里原位替换。已经开始的被拒绝（事件 task_message_edited）。
message EditQueuedMessage {
  string message = 1;
}

// HumanReply 是人对 human 节点或 Reviewer 升级问题的回复（设计书 4.11）。
// 回复限定为问题给出的选项；Reviewer 升级时选项为 continue_as_is、replan_with_guidance、stop_and_wrap_up。
message HumanReply {
  string question_id = 1;
  string option = 2;
  // 选 replan_with_guidance 时的指导意见。
  string guidance = 3;
}

message QueryTaskRequest {
  string tenant_id = 1;
  string task_id = 2;
}

message QueryTaskResponse {
  string task_id = 1;
  string session_id = 2;
  agentruntime.common.v1.TaskStatus status = 3;
  // 当前 Round 序号，从 1 开始；排队中为 0。
  int32 round_seq = 4;
  // Task State，schema 为 /schemas/task_state.schema.json。排队中为空。
  agentruntime.common.v1.JsonPayload task_state = 5;
  // 已推送的最后一个事件，客户端可据此续传。
  int64 last_event_id = 6;
  agentruntime.common.v1.Usage usage = 7;
}

message ListTaskArtifactsRequest {
  // 只用来与认证身份做一致性校验。
  string tenant_id = 1;
  string task_id = 2;
}

// TaskArtifact 是 Task 交付的一个文件的元数据。不含文件内容与对象存储的地址。
message TaskArtifact {
  // art_<ULID>。
  string artifact_id = 1;
  // 显示名。
  string name = 2;
  // 工作区里的相对路径（规范化后的 POSIX 路径）。
  string path = 3;
  string media_type = 4;
  int64 size_bytes = 5;
  // 内容的 sha256（十六进制），用于完整性校验，不是授权凭证。
  string sha256 = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp expires_at = 8;
  // 未知的取值按不可下载处理。
  TaskArtifactState state = 9;
  // 下载地址的路径：/v1/tasks/{task_id}/artifacts/{artifact_id}，相对 Task API 的地址。
  string download_path = 10;
}

enum TaskArtifactState {
  TASK_ARTIFACT_STATE_UNSPECIFIED = 0;
  TASK_ARTIFACT_STATE_READY = 1;
  TASK_ARTIFACT_STATE_EXPIRED = 2;
}

message ListTaskArtifactsResponse {
  // 按创建时间排序。
  repeated TaskArtifact artifacts = 1;
}

message ListSessionEventsRequest {
  // 只用来与认证身份做一致性校验。
  string tenant_id = 1;
  string session_id = 2;
  // 要取的 Task 与各自的游标；最多 50 个 Task，同一个 Task 只能出现一次。
  repeated TaskEventCursor cursors = 3;
  // 每个 Task 最多返回多少个事件；0 时为 200，最多 1000。
  int32 page_size = 4;
}

// TaskEventCursor 是一个 Task 的续读位置：只要 event_id 大于 after_event_id 的事件；0 表示从头。
message TaskEventCursor {
  string task_id = 1;
  int64 after_event_id = 2;
}

message ListSessionEventsResponse {
  // 与请求里的 cursors 一一对应、顺序相同；不存在的 Task 给 found 为假、没有事件。
  repeated TaskEvents tasks = 1;
}

// TaskEvents 是一个 Task 在游标之后的事件。
message TaskEvents {
  string task_id = 1;
  bool found = 2;
  repeated TaskEvent events = 3;
  // 下次续读的游标：最后一个返回的 event_id；没有新事件时等于请求里的 after_event_id。
  int64 next_after_event_id = 4;
  // 这一页之后还有记下的事件。
  bool more = 5;
  // 业务库里没有这个 Task 的完整记录（迁移之前开始的 Task）：客户端退回快照或 SSE。
  bool events_unavailable = 6;
  // Task 已经结束（task_finished 已在业务库里）。
  bool finished = 7;
}

// TaskEvent 是 SSE 推送的事件信封（设计书 4.14）。
// event_id 在同一个 Task 的事件流内单调递增，客户端断线后凭 Last-Event-ID 续传。
message TaskEvent {
  int64 event_id = 1;
  string task_id = 2;
  string session_id = 3;
  TaskEventType type = 4;
  google.protobuf.Timestamp emitted_at = 5;
  agentruntime.common.v1.JsonPayload payload = 6;
}

enum TaskEventType {
  TASK_EVENT_TYPE_UNSPECIFIED = 0;
  TASK_EVENT_TYPE_TASK_ACCEPTED = 1;
  TASK_EVENT_TYPE_ROUND_STARTED = 2;
  TASK_EVENT_TYPE_STAGE_STARTED = 3;
  TASK_EVENT_TYPE_NODE_STARTED = 4;
  TASK_EVENT_TYPE_NODE_FINISHED = 5;
  // 思考过程。
  TASK_EVENT_TYPE_THINKING_DELTA = 6;
  // 工具状态。
  TASK_EVENT_TYPE_TOOL_STATUS = 7;
  // deliver 节点的 token 增量。
  TASK_EVENT_TYPE_TOKEN_DELTA = 8;
  // 等待人工回复。
  TASK_EVENT_TYPE_HUMAN_INPUT_REQUIRED = 9;
  TASK_EVENT_TYPE_VERDICT = 10;
  // Task 结束：done、abort、取消或失败，见 payload。
  TASK_EVENT_TYPE_TASK_FINISHED = 11;
  TASK_EVENT_TYPE_HEARTBEAT = 12;
  // 规划、评审或 tool_loop 一步的模型调用在重试（第 2 次及以后的尝试），见 payload。
  TASK_EVENT_TYPE_DECISION_RETRY = 13;
  // 一条纠偏的状态变了：待生效、已生效、已撤回、被拒绝。不带纠偏的文字。
  TASK_EVENT_TYPE_GUIDANCE_UPDATED = 14;
  // 排队中的 Task 的消息改了，或者改晚了。不带消息的文字。由 Session 工作流推送。
  TASK_EVENT_TYPE_TASK_MESSAGE_EDITED = 15;
  // 一次模型调用的上下文里各类内容占多少。只有数字与类别名。
  TASK_EVENT_TYPE_CONTEXT_USAGE = 16;
  // Task Plan 的步骤变了：带完整的步骤快照（N-04），客户端按它重建计划区。fast 不推。
  TASK_EVENT_TYPE_PLAN_UPDATED = 17;
}
