<svg xmlns="http://www.w3.org/2000/svg" width="760" height="266" viewBox="0 0 760 266" role="img" aria-label="Task Loop：每个 Round 由 Planner 规划一个 Stage，Stage Runner 执行，Reviewer 给出 Verdict" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif">
<style>.bg{fill:#ffffff;stroke:#d0d7de}
.t{fill:#1f2328}.m{fill:#59636e}
.ln{stroke:#59636e;stroke-width:1.4;fill:none}.da{stroke-dasharray:5 4}.ah{fill:#59636e}
.go{fill:#ddf4ff;stroke:#218bff}.py{fill:#dafbe1;stroke:#2da44e}.rs{fill:#fff1e5;stroke:#e16f24}
.ext{fill:#f6f8fa;stroke:#afb8c1}.store{fill:#fbefff;stroke:#a475f9}.chip{fill:#f6f8fa;stroke:#d0d7de}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117;stroke:#30363d}
.t{fill:#e6edf3}.m{fill:#b1bac4}
.ln{stroke:#9198a1}.ah{fill:#9198a1}
.go{fill:#0c2d6b;stroke:#388bfd}.py{fill:#0f3d1e;stroke:#2ea043}.rs{fill:#4a2409;stroke:#db6d28}
.ext{fill:#161b22;stroke:#3d444d}.store{fill:#2e1461;stroke:#8957e5}.chip{fill:#161b22;stroke:#30363d}
}</style>
<defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="a0" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="ah"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="265" rx="10" class="bg"/>
<rect x="18" y="76" width="104" height="82" rx="8" class="ext" stroke-width="1.2"/>
<text x="70.0" y="113.0" class="t" font-size="13" text-anchor="middle" font-weight="600">Task</text>
<text x="70.0" y="130.0" class="m" font-size="11.5" text-anchor="middle">用户的一条命令</text>
<rect x="152" y="76" width="170" height="82" rx="8" class="py" stroke-width="1.2"/>
<text x="237.0" y="97.5" class="t" font-size="13" text-anchor="middle" font-weight="600">Planner</text>
<text x="237.0" y="113.5" class="m" font-size="11.5" text-anchor="middle">Round 的开头</text>
<text x="237.0" y="129.5" class="m" font-size="11.5" text-anchor="middle">载入状态 · Triage</text>
<text x="237.0" y="145.5" class="m" font-size="11.5" text-anchor="middle">规划一个 Stage</text>
<rect x="352" y="76" width="190" height="82" rx="8" class="py" stroke-width="1.2"/>
<text x="447.0" y="97.5" class="t" font-size="13" text-anchor="middle" font-weight="600">Stage Runner</text>
<text x="447.0" y="113.5" class="m" font-size="11.5" text-anchor="middle">按 DAG 执行 Node</text>
<text x="447.0" y="129.5" class="m" font-size="11.5" text-anchor="middle">模型 · 工具 · 沙箱 · 人</text>
<text x="447.0" y="145.5" class="m" font-size="11.5" text-anchor="middle">前后各跑一遍 Hook</text>
<rect x="572" y="76" width="170" height="82" rx="8" class="py" stroke-width="1.2"/>
<text x="657.0" y="97.5" class="t" font-size="13" text-anchor="middle" font-weight="600">Reviewer</text>
<text x="657.0" y="113.5" class="m" font-size="11.5" text-anchor="middle">Round 的结尾</text>
<text x="657.0" y="129.5" class="m" font-size="11.5" text-anchor="middle">汇总 · 更新 Task State</text>
<text x="657.0" y="145.5" class="m" font-size="11.5" text-anchor="middle">给出 Verdict</text>
<path d="M122,117.0 L152,117.0" class="ln" marker-end="url(#a1)"/>
<path d="M322,117.0 L352,117.0" class="ln" marker-end="url(#a1)"/>
<path d="M542,117.0 L572,117.0" class="ln" marker-end="url(#a1)"/>
<path d="M657,76 L657,44 L237,44 L237,76" class="ln" marker-end="url(#a1)"/>
<text x="447" y="35" class="m" font-size="11.5" text-anchor="middle">continue 或 replan：进入下一个 Round</text>
<rect x="152" y="196" width="390" height="52" rx="8" class="store" stroke-width="1.2"/>
<text x="347.0" y="218.0" class="t" font-size="13" text-anchor="middle" font-weight="600">外部状态</text>
<text x="347.0" y="235.0" class="m" font-size="11.5" text-anchor="middle">Task State · Session 状态 · Memory · Recipe · 检查点</text>
<path d="M237,158 L237,196" class="ln" marker-end="url(#a1)"/>
<text x="244" y="178" class="m" font-size="11.5" text-anchor="start">读</text>
<path d="M600,158 L600,222 L542,222" class="ln" marker-end="url(#a1)"/>
<text x="593" y="214" class="m" font-size="11.5" text-anchor="end">写回</text>
<rect x="622" y="196" width="120" height="52" rx="8" class="ext" stroke-width="1.2"/>
<text x="682.0" y="218.0" class="t" font-size="13" text-anchor="middle" font-weight="600">收尾</text>
<text x="682.0" y="235.0" class="m" font-size="11.5" text-anchor="middle">交付 · 写回经验</text>
<path d="M690,158 L690,196" class="ln" marker-end="url(#a1)"/>
<text x="697" y="178" class="m" font-size="11.5" text-anchor="start">done</text>
<text x="585" y="178" class="m" font-size="11.5" text-anchor="end">repair · rollback · reroute · escalate 按规则处理</text>
</svg>
