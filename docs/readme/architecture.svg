<svg xmlns="http://www.w3.org/2000/svg" width="760" height="616" viewBox="0 0 760 616" role="img" aria-label="Agent Runtime 的组成：应用经 Task Service 下任务，Worker 跑 Task Loop，并调用 Model Gateway、Memory Service 与 Sandbox Service" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif">
<style>.bg{fill:#ffffff;stroke:#d0d7de}
