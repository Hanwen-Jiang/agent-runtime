<svg xmlns="http://www.w3.org/2000/svg" width="760" height="432" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" viewBox='0 0 760 432' role='img' aria-label='RelationalStore：业务库与 Temporal 状态库分实例，租户隔离靠分区加行级安全' font-size='13' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id='if-pg-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill="#a9a59b"/></marker></defs><rect x="0" y="0" width="760" height="432" fill="#ffffff"/><text x='24' y='30' font-size='15' font-weight='600' fill="#1f1e1c">RelationalStore：业务库与 Temporal 状态库分实例，租户隔离靠分区加行级安全</text><g><rect x='24' y='56' width='176' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='112' y='80' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Task Service</text><text x='112' y='95.5' font-size='11' text-anchor='middle' fill="#5f5c56">Session 与 Task 元数据</text></g><g><rect x='24' y='124' width='176' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='112' y='148' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Registry</text><text x='112' y='163.5' font-size='11' text-anchor='middle' fill="#5f5c56">各类配置的版本</text></g><g><rect x='24' y='192' width='176' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='112' y='216' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Memory Service</text><text x='112' y='231.5' font-size='11' text-anchor='middle' fill="#5f5c56">条目元数据、谱系、审计</text></g><g><rect x='232' y='88' width='216' height='104' rx='8' fill="#2f6fd6" fill-opacity='0.12' stroke="#2f6fd6" stroke-width='2'/><text x='340' y='112' font-weight='600' text-anchor='middle' fill="#1f1e1c">RelationalStore</text><text x='340' y='127.5' font-size='11' text-anchor='middle' fill="#5f5c56">事务读写</text><text x='340' y='143.5' font-size='11' text-anchor='middle' fill="#5f5c56">按租户分区的表</text><text x='340' y='159.5' font-size='11' text-anchor='middle' fill="#5f5c56">行级安全（RLS）</text><text x='340' y='175.5' font-size='11' text-anchor='middle' fill="#5f5c56">开发实现：SQLite</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M200 84L216 84L216 220L200 220'/><path d='M200 152L216 152'/><path d='M216 140L232 140' marker-end='url(#if-pg-arrow)'/></g><g><rect x='480' y='48' width='256' height='244' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='496' y='72' font-weight='600' fill="#1f1e1c">Postgres（高可用）</text><text x='496' y='90' font-size='11' fill="#5f5c56">Kubernetes · Operator 部署</text></g><g><rect x='496' y='104' width='224' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='608' y='128' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">业务实例</text><text x='608' y='143.5' font-size='11' text-anchor='middle' fill="#5f5c56">JSONB + GIN 索引存动态元数据</text><text x='608' y='159.5' font-size='11' text-anchor='middle' fill="#5f5c56">按租户分区，必要时分库</text></g><g><rect x='496' y='192' width='224' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='608' y='216' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Temporal 状态库</text><text x='608' y='231.5' font-size='11' text-anchor='middle' fill="#5f5c56">另一实例，至少分盘</text><text x='608' y='247.5' font-size='11' text-anchor='middle' fill="#5f5c56">Temporal 直接使用，不经此接口</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M448 140L496 140' marker-end='url(#if-pg-arrow)'/></g><g><rect x='24' y='324' width='712' height='88' rx='8' fill="#f2f0ea" stroke='none'/><text x='40' y='346' font-size='12.5' font-weight='600' fill="#1f1e1c">特点</text><text x='40' y='366' font-size='11.5' fill="#5f5c56">原生行级安全作为多租户的第二道隔离；租户条件由服务端注入</text><text x='40' y='384' font-size='11.5' fill="#5f5c56">工作流的高频写入带来 VACUUM 压力，所以 Temporal 状态库与业务库分实例</text><text x='40' y='402' font-size='11.5' fill="#5f5c56">Temporal、Langfuse 等组件都支持 Postgres，全栈统一运维</text></g></svg>
