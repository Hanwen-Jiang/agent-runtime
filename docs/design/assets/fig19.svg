<svg xmlns="http://www.w3.org/2000/svg" width="760" height="654" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" viewBox='0 0 760 654' role='img' aria-label='Learning Pipeline：从生产 trace 归因与评测，只有过门槛的产出才发布' font-size='13' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id='lp-mod-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill="#a9a59b"/></marker></defs><rect x="0" y="0" width="760" height="654" fill="#ffffff"/><text x='24' y='30' font-size='15' font-weight='600' fill="#1f1e1c">Learning Pipeline：从生产 trace 归因与评测，只有过门槛的产出才发布</text><g><rect x='24' y='48' width='420' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='234' y='72' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">收集</text><text x='234' y='87.5' font-size='11' text-anchor='middle' fill="#5f5c56">trace 经 EventStream 到达，span 按 GenAI 语义约定命名</text></g><g><rect x='24' y='124' width='420' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='234' y='148' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">归因</text><text x='234' y='163.5' font-size='11' text-anchor='middle' fill="#5f5c56">规格问题 · 协作失配 · 验证缺失（MAST 三类）</text></g><g><rect x='24' y='200' width='420' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='234' y='224' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">评测集</text><text x='234' y='239.5' font-size='11' text-anchor='middle' fill="#5f5c56">从生产 trace 按任务族抽样，标注成功、失败与成本</text></g><g><rect x='24' y='276' width='420' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='234' y='300' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">候选</text><text x='234' y='315.5' font-size='11' text-anchor='middle' fill="#5f5c56">新模型或价格、Node Template、Recipe、Reasoning Template、路由</text></g><g><rect x='24' y='352' width='420' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='234' y='376' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">影子评测</text><text x='234' y='391.5' font-size='11' text-anchor='middle' fill="#5f5c56">在影子流量上运行，与现行版本对比</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M234 104L234 124' marker-end='url(#lp-mod-arrow)'/><path d='M234 180L234 200' marker-end='url(#lp-mod-arrow)'/><path d='M234 256L234 276' marker-end='url(#lp-mod-arrow)'/><path d='M234 332L234 352' marker-end='url(#lp-mod-arrow)'/></g><g><polygon points='124,464 234,434 344,464 234,494' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='234' y='459.8' font-size='11.5' text-anchor='middle' fill="#1f1e1c">成功率不降、</text><text x='234' y='475.8' font-size='11.5' text-anchor='middle' fill="#1f1e1c">每次成功成本不升？</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M234 408L234 434' marker-end='url(#lp-mod-arrow)'/></g><g><rect x='124' y='524' width='220' height='56' rx='8' fill="#2f6fd6" fill-opacity='0.12' stroke="#2f6fd6" stroke-width='2'/><text x='234' y='548' font-weight='600' text-anchor='middle' fill="#1f1e1c">经 Registry 发布</text><text x='234' y='563.5' font-size='11' text-anchor='middle' fill="#5f5c56">不直接改运行中的配置</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M234 494L234 524' marker-end='url(#lp-mod-arrow)'/></g><text x='242' y='512' font-size='11' fill="#5f5c56">是</text><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M344 464L436 464L436 304L444 304' stroke-dasharray='4 3' marker-end='url(#lp-mod-arrow)'/></g><text x='364' y='456' font-size='11' fill="#5f5c56">否：不发布</text><text x='24' y='610' font-size='11.5' fill="#5f5c56">归因结果反哺路由规则、Model Profile 阈值、Node Template 与错误类经验。</text><text x='24' y='628' font-size='11.5' fill="#5f5c56">后台任务单独记预算。</text><g><rect x='476' y='48' width='260' height='260' rx='12' fill='none' stroke="#a9a59b" stroke-width='1.5'/><text x='492' y='72' font-weight='600' fill="#1f1e1c">trace 的层级</text></g><text x='492' y='100' font-size='11' font-weight='600' fill="#1f1e1c">Task</text><text x='720' y='100' font-size='11' text-anchor='end' fill="#5f5c56">invoke_workflow</text><text x='492' y='126' font-size='11' font-weight='600' fill="#1f1e1c">Round</text><text x='720' y='126' font-size='11' text-anchor='end' fill="#5f5c56">runtime.round</text><text x='492' y='152' font-size='11' font-weight='600' fill="#1f1e1c">Planner、Reviewer</text><text x='720' y='152' font-size='11' text-anchor='end' fill="#5f5c56">模型调用 span</text><text x='492' y='178' font-size='11' font-weight='600' fill="#1f1e1c">model 节点</text><text x='720' y='178' font-size='11' text-anchor='end' fill="#5f5c56">模型调用 span</text><text x='492' y='204' font-size='11' font-weight='600' fill="#1f1e1c">program 节点</text><text x='720' y='204' font-size='11' text-anchor='end' fill="#5f5c56">execute_tool</text><text x='492' y='230' font-size='11' font-weight='600' fill="#1f1e1c">sub_agent</text><text x='720' y='230' font-size='11' text-anchor='end' fill="#5f5c56">invoke_agent</text><text x='492' y='268' font-size='11' fill="#5f5c56">都带 tenant_id、task_id、WorkflowID、</text><text x='492' y='284' font-size='11' fill="#5f5c56">RunID 等属性</text></svg>
