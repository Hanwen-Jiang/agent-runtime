<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="752" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" viewBox='0 0 760 752' role='img' aria-label='Stage Runner：依赖满足即并发执行，Hook 包住每个 Node，Goal Node 在运行时展开' font-size='13' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id='stage-mod-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill="#a9a59b"/></marker></defs><rect x="0" y="0" width="760" height="752" fill="#ffffff"/><text x='24' y='30' font-size='15' font-weight='600' fill="#1f1e1c">Stage Runner：依赖满足即并发执行，Hook 包住每个 Node，Goal Node 在运行时展开</text><g><rect x='230' y='48' width='300' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='380' y='72' font-weight='600' text-anchor='middle' fill="#1f1e1c">Stage 定义</text><text x='380' y='87.5' font-size='11' text-anchor='middle' fill="#5f5c56">来自 Planner</text></g><g><rect x='230' y='128' width='300' height='32' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='380' y='147.8' font-size='11.5' text-anchor='middle' fill="#5f5c56">before_stage Hook：预算检查</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M380 104L380 128' marker-end='url(#stage-mod-arrow)'/></g><g><rect x='24' y='196' width='712' height='316' rx='12' fill="#2f6fd6" fill-opacity='0.05' stroke="#2f6fd6" stroke-width='1.5'/><text x='40' y='220' font-weight='600' fill="#1f1e1c">调度循环</text><text x='720' y='220' font-size='11' text-anchor='end' fill="#5f5c56">pending → ready → running → succeeded / failed / skipped / cancelled</text><text x='40' y='240' font-size='11.5' fill="#5f5c56">依赖满足的 Node 进入 ready；无依赖的 Node 并发启动；扇出数有上限</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M380 160L380 196' marker-end='url(#stage-mod-arrow)'/></g><g><rect x='40' y='256' width='680' height='32' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='380' y='275.8' font-size='11.5' text-anchor='middle' fill="#5f5c56">before_node Hook：权限、预算、脱敏；write_irreversible 前自动插入人工审批</text></g><g><rect x='40' y='316' width='200' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='140' y='340' font-weight='600' text-anchor='middle' fill="#1f1e1c">Atomic Node</text><text x='140' y='355.5' font-size='11' text-anchor='middle' fill="#5f5c56">交给 Node Executor</text><text x='140' y='371.5' font-size='11' text-anchor='middle' fill="#5f5c56">见 3.2.4</text></g><g><rect x='256' y='316' width='232' height='104' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='272' y='340' font-weight='600' fill="#1f1e1c">Goal Node 展开</text><text x='272' y='355.5' font-size='11' fill="#5f5c56">template：预定义子图</text><text x='272' y='371.5' font-size='11' fill="#5f5c56">tool_loop：思考 → 调工具 → 观察</text><text x='272' y='387.5' font-size='11' fill="#5f5c56">sub_agent：独立上下文，只读</text><text x='272' y='403.5' font-size='11' fill="#5f5c56">sub_task：嵌套 Task Loop，深度 ≤ 2</text></g><g><rect x='504' y='316' width='216' height='88' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='520' y='340' font-weight='600' fill="#1f1e1c">quality 包装（可选）</text><text x='520' y='355.5' font-size='11' fill="#5f5c56">revise：生成 → judge → 带反馈退回</text><text x='520' y='371.5' font-size='11' fill="#5f5c56">ensemble：生成 × N → 投票或择优</text><text x='520' y='387.5' font-size='11' fill="#5f5c56">search：扩展 k 个 → 打分 → 剪枝</text></g><g><rect x='40' y='464' width='680' height='32' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='380' y='483.8' font-size='11.5' text-anchor='middle' fill="#5f5c56">after_node Hook：schema 校验、安全过滤、审计</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M140 288L140 316' marker-end='url(#stage-mod-arrow)'/><path d='M372 288L372 316' marker-end='url(#stage-mod-arrow)'/><path d='M140 388L140 464' marker-end='url(#stage-mod-arrow)'/><path d='M372 420L372 464' marker-end='url(#stage-mod-arrow)'/><path d='M612 288L612 316' stroke-dasharray='4 3' marker-end='url(#stage-mod-arrow)'/><path d='M612 404L612 464' stroke-dasharray='4 3' marker-end='url(#stage-mod-arrow)'/><path d='M40 480L32 480L32 272L40 272' marker-end='url(#stage-mod-arrow)'/></g><g><rect x='230' y='540' width='300' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='380' y='564' font-weight='600' text-anchor='middle' fill="#1f1e1c">汇集</text><text x='380' y='579.5' font-size='11' text-anchor='middle' fill="#5f5c56">按 Node id 排序合并；下游默认只拿 result</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M380 512L380 540' marker-end='url(#stage-mod-arrow)'/></g><g><rect x='230' y='620' width='300' height='32' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='380' y='639.8' font-size='11.5' text-anchor='middle' fill="#5f5c56">after_stage Hook：schema 校验、检查点</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M380 596L380 620' marker-end='url(#stage-mod-arrow)'/></g><g><rect x='230' y='676' width='300' height='56' rx='8' fill="#2f6fd6" fill-opacity='0.12' stroke="#2f6fd6" stroke-width='2'/><text x='380' y='700' font-weight='600' text-anchor='middle' fill="#1f1e1c">Stage 结果 → Reviewer</text><text x='380' y='715.5' font-size='11' text-anchor='middle' fill="#5f5c56">各 Node 的 result 与 trace</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M380 652L380 676' marker-end='url(#stage-mod-arrow)'/></g><text x='548' y='560' font-size='11.5' fill="#5f5c56">规则：同一份共享产物</text><text x='548' y='578' font-size='11.5' fill="#5f5c56">同一时刻只允许一个写者；</text><text x='548' y='596' font-size='11.5' fill="#5f5c56">sub_agent 默认只读。</text></svg>
