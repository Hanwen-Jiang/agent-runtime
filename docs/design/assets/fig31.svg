<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" viewBox='0 0 760 440' role='img' aria-label='SecretStore：平台静态密钥由云 KMS 注入，租户凭据由 Vault 或 OpenBao 短期签发' font-size='12.5' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id='if-secret-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill="#a9a59b"/></marker></defs><rect x="0" y="0" width="760" height="440" fill="#ffffff"/><text x='24' y='30' font-size='15' font-weight='600' fill="#1f1e1c">SecretStore：平台静态密钥由云 KMS 注入，租户凭据由 Vault 或 OpenBao 短期签发</text><g><rect x='24' y='56' width='176' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='112' y='80' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">所有服务 Pod</text><text x='112' y='95.5' text-anchor='middle' font-size='11' fill="#5f5c56">数据库密码、存储加密密钥</text></g><g><rect x='24' y='122' width='176' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='112' y='146' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">Model Gateway</text><text x='112' y='161.5' text-anchor='middle' font-size='11' fill="#5f5c56">平台主模型 Key；租户 BYOK</text></g><g><rect x='24' y='188' width='176' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='112' y='212' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">program 节点</text><text x='112' y='227.5' text-anchor='middle' font-size='11' fill="#5f5c56">租户第三方工具凭据</text></g><g><rect x='24' y='254' width='176' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='112' y='278' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">Sandbox</text><text x='112' y='293.5' text-anchor='middle' font-size='11' fill="#5f5c56">沙箱临时凭据</text></g><g><rect x='232' y='120' width='216' height='104' rx='8' fill="#2f6fd6" fill-opacity='0.12' stroke="#2f6fd6" stroke-width='1.5'/><text x='340' y='144' text-anchor='middle' font-size='13' font-weight='600' fill="#1f1e1c">SecretStore</text><text x='340' y='159.5' text-anchor='middle' font-size='11' fill="#5f5c56">读取基础设施密钥</text><text x='340' y='175.5' text-anchor='middle' font-size='11' fill="#5f5c56">按租户签发短期动态凭据</text><text x='340' y='191.5' text-anchor='middle' font-size='11' fill="#5f5c56">吊销</text><text x='340' y='207.5' text-anchor='middle' font-size='11' fill="#5f5c56">节点代码拿不到长期密钥</text></g><g><rect x='480' y='48' width='256' height='260' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='496' y='72' font-size='13' font-weight='600' fill="#1f1e1c">分层治理</text><text x='496' y='90' font-size='11' fill="#5f5c56">按密钥类型分两层</text></g><g><rect x='496' y='104' width='224' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='608' y='128' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">基础设施密钥（静态）</text><text x='608' y='143.5' text-anchor='middle' font-size='11' fill="#5f5c56">云 KMS 保存</text><text x='608' y='159.5' text-anchor='middle' font-size='11' fill="#5f5c56">ESO 注入 Kubernetes Secret</text></g><g><rect x='496' y='204' width='224' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='608' y='228' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">租户凭据（动态、短期）</text><text x='608' y='243.5' text-anchor='middle' font-size='11' fill="#5f5c56">Vault 或 OpenBao（二选一）</text><text x='608' y='259.5' text-anchor='middle' font-size='11' fill="#5f5c56">按租户签发，可吊销</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M200 84H216'/><path d='M200 150H216'/><path d='M200 216H216'/><path d='M200 282H216'/><path d='M216 84V282'/><path d='M232 172H216' marker-end='url(#if-secret-arrow)'/><path d='M464 172H448' marker-end='url(#if-secret-arrow)'/><path d='M464 140V240'/><path d='M496 140H464'/><path d='M496 240H464'/></g><g><rect x='24' y='332' width='712' height='88' rx='8' fill="#f2f0ea" stroke='none'/><text x='40' y='354' font-size='12.5' font-weight='600' fill="#1f1e1c">特点</text><text x='40' y='374' font-size='11.5' fill="#5f5c56">云 KMS 零运维，适合平台自身的静态密钥；按条目或按次计费，不适合大量高频的租户凭据</text><text x='40' y='392' font-size='11.5' fill="#5f5c56">Vault 与 OpenBao 擅长大量动态、短期、按租户的凭据，二者 API 基本兼容</text><text x='40' y='410' font-size='11.5' fill="#5f5c56">Vault 自 2023 年起改为 BSL 许可，OpenBao 是它的 MPL 2.0 开源分支，按合规要求选择</text></g></svg>
