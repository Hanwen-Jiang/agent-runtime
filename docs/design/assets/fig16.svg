<svg xmlns="http://www.w3.org/2000/svg" width="760" height="442" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" viewBox='0 0 760 442' role='img' aria-label='Memory Service：在线检索与离线提炼分开部署，数据落在 Postgres 与 Qdrant' font-size='13' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id='mem-unit-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill="#a9a59b"/></marker></defs><rect x="0" y="0" width="760" height="442" fill="#ffffff"/><text x='24' y='30' font-size='15' font-weight='600' fill="#1f1e1c">Memory Service：在线检索与离线提炼分开部署，数据落在 Postgres 与 Qdrant</text><g><rect x='24' y='48' width='226.7' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='137.3' y='72' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">Planner</text><text x='137.3' y='87.5' font-size='11' text-anchor='middle' fill="#5f5c56">规划时检索经验与 Recipe</text></g><g><rect x='266.7' y='48' width='226.7' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='380' y='72' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">Node Executor</text><text x='380' y='87.5' font-size='11' text-anchor='middle' fill="#5f5c56">Node 开始时、出错时检索</text></g><g><rect x='509.3' y='48' width='226.7' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='622.6' y='72' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">Reviewer</text><text x='622.6' y='87.5' font-size='11' text-anchor='middle' fill="#5f5c56">提交经验候选与反馈</text></g><g><rect x='24' y='152' width='712' height='116' rx='12' fill="#2f6fd6" fill-opacity='0.05' stroke="#2f6fd6" stroke-width='1.5'/><text x='720' y='176' font-weight='600' text-anchor='end' fill="#1f1e1c">Memory Service（Python）</text></g><g><rect x='40' y='192' width='328' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='204' y='216' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">检索服务</text><text x='204' y='231.5' font-size='11' text-anchor='middle' fill="#5f5c56">Deployment · 多副本 · gRPC</text><text x='204' y='247.5' font-size='11' text-anchor='middle' fill="#5f5c56">检索流水线；接收写入请求并投递提炼任务</text></g><g><rect x='392' y='192' width='328' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='556' y='216' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">提炼 Worker</text><text x='556' y='231.5' font-size='11' text-anchor='middle' fill="#5f5c56">消费 Temporal 的 offline 队列 · KEDA 扩缩</text><text x='556' y='247.5' font-size='11' text-anchor='middle' fill="#5f5c56">写入流水线：提炼、合并、过滤、晋升</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M368 228L392 228' marker-end='url(#mem-unit-arrow)'/></g><text x='380' y='220' font-size='11' text-anchor='middle' fill="#5f5c56">投递</text><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M137.3 104L137.3 128'/><path d='M380 104L380 128'/><path d='M622.6 104L622.6 128'/><path d='M137.3 128L622.6 128'/><path d='M204 128L204 192' marker-end='url(#mem-unit-arrow)'/></g><text x='212' y='146' font-size='11' fill="#5f5c56">gRPC</text><g><rect x='24' y='316' width='169' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='108.5' y='340' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">VectorStore · Qdrant</text><text x='108.5' y='355.5' font-size='11' text-anchor='middle' fill="#5f5c56">稠密 + 稀疏向量</text><text x='108.5' y='371.5' font-size='11' text-anchor='middle' fill="#5f5c56">按租户字段分区</text></g><g><rect x='205' y='316' width='169' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='289.5' y='340' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">RelationalStore · Postgres</text><text x='289.5' y='355.5'