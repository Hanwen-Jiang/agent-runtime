<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" viewBox='0 0 760 480' role='img' aria-label='ModelProvider：各家模型 API 只在 Model Gateway 内适配，核心看到统一语义' font-size='13' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id='if-model-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill="#a9a59b"/></marker></defs><rect x="0" y="0" width="760" height="480" fill="#ffffff"/><text x='24' y='30' font-size='15' font-weight='600' fill="#1f1e1c">ModelProvider：各家模型 API 只在 Model Gateway 内适配，核心看到统一语义</text><g><rect x='24' y='64' width='160' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='104' y='88' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Worker</text><text x='104' y='103.5' font-size='11' text-anchor='middle' fill="#5f5c56">生成、打分、分类</text></g><g><rect x='24' y='132' width='160' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='104' y='156' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Memory Service</text><text x='104' y='171.5' font-size='11' text-anchor='middle' fill="#5f5c56">嵌入、重排</text></g><g><rect x='24' y='200' width='160' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='104' y='224' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Learning Pipeline</text><text x='104' y='239.5' font-size='11' text-anchor='middle' fill="#5f5c56">评测调用</text></g><g><rect x='216' y='48' width='296' height='248' rx='12' fill="#2f6fd6" fill-opacity='0.05' stroke="#2f6fd6" stroke-width='1.5'/><text x='232' y='72' font-weight='600' fill="#1f1e1c">Model Gateway（Go）· 经 gRPC 调用</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M184 92L200 92L200 228L184 228'/><path d='M184 160L200 160'/><path d='M200 156L216 156' marker-end='url(#if-model-arrow)'/></g><g><rect x='232' y='88' width='264' height='72' rx='8' fill="#2f6fd6" fill-opacity='0.12' stroke="#2f6fd6" stroke-width='2'/><text x='364' y='112' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">ModelProvider 接口</text><text x='364' y='127.5' font-size='11' text-anchor='middle' fill="#5f5c56">生成（含流式与结构化输出）、打分、嵌入</text><text x='364' y='143.5' font-size='11' text-anchor='middle' fill="#5f5c56">回传计量</text></g><g><rect x='232' y='176' width='264' height='32' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='364' y='195.8' font-size='11.5' text-anchor='middle' fill="#5f5c56">适配层 · 供应商 1</text></g><g><rect x='232' y='216' width='264' height='32' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='364' y='235.8' font-size='11.5' text-anchor='middle' fill="#5f5c56">适配层 · 供应商 2</text></g><g><rect x='232' y='256' width='264' height='32' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='364' y='275.8' font-size='11.5' text-anchor='middle' fill="#5f5c56">适配层 · 供应商 N</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M496 192L560 192' marker-end='url(#if-model-arrow)'/><path d='M496 232L560 232' marker-end='url(#if-model-arrow)'/><path d='M496 272L560 272' marker-end='url(#if-model-arrow)'/></g><g><rect x='560' y='176' width='176' height='32' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='648' y='195.8' font-size='11.5' text-anchor='middle' fill="#5f5c56">供应商 1 API</text></g><g><rect x='560' y='216' width='176' height='32' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='648' y='235.8' font-size='11.5' text-anchor='middle' fill="#5f5c56">供应商 2 API</text></g><g><rect x='560' y='256' width='176' height='32' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='648' y='275.8' font-size='11.5' text-anchor='middle' fill="#5f5c56">供应商 N API</text></g><text x='560' y='166' font-size='11.5' font-weight='600' fill="#5f5c56">各家模型 API（集群外）</text><g><rect x='232' y='316' width='264' height='32' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='364' y='335.7' font-size='11' text-anchor='middle' fill="#5f5c56">可选：OpenAI 兼容的 HTTP + JSON 端点</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M364 296L364 316' stroke-dasharray='4 3' marker-end='url(#if-model-arrow)'/></g><g><rect x='24' y='372' width='712' height='88' rx='8' fill="#f2f0ea" stroke='none'/><text x='40' y='394' font-size='12.5' font-weight='600' fill="#1f1e1c">特点</text><text x='40' y='414' font-size='11.5' fill="#5f5c56">每家供应商一个薄适配层，直接用官方 SDK 或 HTTP API；只做协议转换，不放业务逻辑</text><text x='40' y='432' font-size='11.5' fill="#5f5c56">对上统一结构化输出、流式与错误语义；接入新供应商只需加一个适配层</text><text x='40' y='450' font-size='11.5' fill="#5f5c56">路由、限流、计费完全自控；开源 LLM 代理接入快，但路由与计费策略受其模型限制</text></g></svg>
