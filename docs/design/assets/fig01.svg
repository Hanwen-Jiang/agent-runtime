<svg xmlns="http://www.w3.org/2000/svg" width="760" height="552" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" viewBox='0 0 760 552' role='img' aria-label='Agent Runtime 由五个部署单元组成，外层资源只经 Provider 接口接入' font-size='13' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id='ar-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill="#a9a59b"/></marker></defs><rect x="0" y="0" width="760" height="552" fill="#ffffff"/><text x='24' y='30' font-size='15' font-weight='600' fill="#1f1e1c">Agent Runtime（暂名）：五个部署单元，外层资源只经 Provider 接口接入</text><g><rect x='24' y='46' width='712' height='32' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='380' y='67' text-anchor='middle' font-size='12' fill="#5f5c56">Ingress（只定义接口）：认证 · 租户识别 · 限流 · SSE 推流 · HTTP POST 控制指令</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M380 78V100' marker-end='url(#ar-arrow)'/><path d='M160 212V232' marker-start='url(#ar-arrow)' marker-end='url(#ar-arrow)'/><path d='M210 308V328' marker-end='url(#ar-arrow)'/><path d='M558 308V328' marker-end='url(#ar-arrow)'/><path d='M640 232V212' marker-end='url(#ar-arrow)'/><path d='M380 404V424' marker-end='url(#ar-arrow)'/></g><g><rect x='24' y='100' width='712' height='304' rx='12' fill='none' stroke="#a9a59b" stroke-width='1.5'/><text x='40' y='122' font-weight='600' fill="#1f1e1c">Agent Runtime（暂名）</text></g><g><rect x='40' y='136' width='340' height='76' rx='8' fill="#2f6fd6" fill-opacity='0.12' stroke="#2f6fd6" stroke-width='1.5'/><text x='210' y='158' text-anchor='middle' font-size='12.5' font-weight='600' fill="#1f1e1c">Control Plane（Go）</text><text x='210' y='178' text-anchor='middle' font-size='11' fill="#1f1e1c">Task Service：Task API · 工作流 · 准入与配额</text><text x='210' y='196' text-anchor='middle' font-size='11' fill="#1f1e1c">