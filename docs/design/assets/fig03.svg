<svg xmlns="http://www.w3.org/2000/svg" width="760" height="572" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" viewBox='0 0 760 572' role='img' aria-label='Control Plane：受理 Task 并转成 Temporal 工作流，托管带版本的配置' font-size='13' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id='cp-unit-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill="#a9a59b"/></marker></defs><rect x="0" y="0" width="760" height="572" fill="#ffffff"/><text x='24' y='30' font-size='15' font-weight='600' fill="#1f1e1c">Control Plane：受理 Task 并转成 Temporal 工作流，托管带版本的配置</text><g><rect x='24' y='48' width='536' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='292' y='72' font-weight='600' text-anchor='middle' fill="#1f1e1c">Ingress（只定义接口）</text><text x='292' y='88' font-size='11.5' text-anchor='middle' fill="#5f5c56">认证 · 租户识别 · 限流；HTTP POST 提交与控制指令，SSE 推流</text></g><g><rect x='24' y='140' width='536' height='196' rx='12' fill="#2f6fd6" fill-opacity='0.05' stroke="#2f6fd6" stroke-width='1.5'/><text x='40' y='164' font-weight='600' fill="#1f1e1c">Control Plane（Go）</text><text x='544' y='164' font-size='11.5' text-anchor='end' fill="#5f5c56">Kubernetes Deployment · 多副本 · 无状态</text></g><g><rect x='40' y='180' width='252' height='104' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='56' y='204' font-weight='600' fill="#1f1e1c">Task Service</text><text x='56' y='220' font-size='11.5' fill="#5f5c56">Task API：提交、取消、回复、查询</text><text x='56' y='236' font-size='11.5' fill="#5f5c56">准入：配额、权限、优先级排队</text><text x='56' y='252' font-size='11.5' fill="#5f5c56">投递：找到或创建 Session 工作流</text><text x='56' y='268' font-size='11.5' fill="#5f5c56">Go 工作流 Worker：session 队列</text></g><g><rect x='308' y='180' width='236' height='104' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='324' y='204' font-weight='600' fill="#1f1e1c">Registry</text><text x='324' y='220' font-size='11.5' fill="#5f5c56">模板、Recipe、Model Profile</text><text x='324' y='236' font-size='11.5' fill="#5f5c56">Reasoning Template、租户策略</text><text x='324' y='252' font-size='11.5' fill="#5f5c56">发布：影子 → 达标 → 默认</text><text x='324' y='268' font-size='11.5' fill="#5f5c56">固定：版本写入工作流输入</text></g><g><rect x='592' y='140' width='144' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='664' y='164' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">Worker</text><text x='664' y='179.5' font-size='11' text-anchor='middle' fill="#5f5c56">Planner 查询配置</text></g><g><rect x='592' y='210' width='144' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='664' y='234' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">Model Gateway</text><text x='664' y='249.5' font-size='11' text-anchor='middle' fill="#5f5c56">读 Model Profile</text></g><g><rect x='592' y='280' width='144' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='664' y='304' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">Learning Pipeline</text><text x='664' y='319.5' font-size='11' text-anchor='middle' fill="#5f5c56">发布新版本</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M592 168L576 168L576 308L592 308'/><path d='M592 238L576 238'/><path d='M576 238L544 238' marker-end='url(#cp-unit-arrow)'/><path d='M230 104L230 180' marker-end='url(#cp-unit-arrow)' marker-start='url(#cp-unit-arrow)'/></g><text x='238' y='126' font-size='11' fill="#5f5c56">Task API；返回 task_id 与 SSE 地址</text><g><rect x='24' y='376' width='146' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='97' y='400' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">Cache · Valkey</text><text x='97' y='416' font-size='11.5' text-anchor='middle' fill="#5f5c56">准入的配额计数</text></g><g><rect x='186' y='376' width='206' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='289' y='400' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">DurableEngine · Temporal</text><text x='289' y='416' font-size='11.5' text-anchor='middle' fill="#5f5c56">Session 工作流（Go）</text><text x='289' y='432' font-size='11.5' text-anchor='middle' fill="#5f5c56">Task 子工作流 → task 队列</text></g><g><rect x='408' y='376' width='328' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='572' y='400' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">RelationalStore · 业务 Postgres</text><text x='572' y='416' font-size='11.5' text-anchor='middle' fill="#5f5c56">Session 与 Task 元数据（Task Service）</text><text x='572' y='432' font-size='11.5' text-anchor='middle' fill="#5f5c56">Registry 的各个版本（Registry）</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M97 284L97 376' marker-end='url(#cp-unit-arrow)'/><path d='M240 284L240 376' marker-end='url(#cp-unit-arrow)' marker-start='url(#cp-unit-arrow)'/><path d='M280 284L280 356L440 356L440 376' marker-end='url(#cp-unit-arrow)'/><path d='M500 284L500 376' marker-end='url(#cp-unit-arrow)'/></g><g><rect x='186' y='496' width='206' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='289' y='520' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">Worker（Python）</text><text x='289' y='536' font-size='11.5' text-anchor='middle' fill="#5f5c56">执行 Task 子工作流，见 3.2</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M289 464L289 496' marker-end='url(#cp-unit-arrow)'/></g><text x='297' y='484' font-size='11' fill="#5f5c56">task 队列</text><text x='408' y='508' font-size='11.5' fill="#5f5c56">另：各单元都经 OpenTelemetry 打点；</text><text x='408' y='526' font-size='11.5' fill="#5f5c56">数据库凭据由 External Secrets Operator</text><text x='408' y='544' font-size='11.5' fill="#5f5c56">从云 KMS 注入。</text></svg>
