<svg xmlns="http://www.w3.org/2000/svg" width="760" height="424" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" viewBox='0 0 760 424' role='img' aria-label='Cache：Valkey 只放可丢失或可重建的数据，承担限流、推流与锁' font-size='13' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id='if-valkey-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill="#a9a59b"/></marker></defs><rect x="0" y="0" width="760" height="424" fill="#ffffff"/><text x='24' y='30' font-size='15' font-weight='600' fill="#1f1e1c">Cache：Valkey 只放可丢失或可重建的数据，承担限流、推流与锁</text><g><rect x='24' y='48' width='176' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='112' y='72' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Task Service</text><text x='112' y='87.5' font-size='11' text-anchor='middle' fill="#5f5c56">准入的配额计数</text></g><g><rect x='24' y='114' width='176' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='112' y='138' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Model Gateway</text><text x='112' y='153.5' font-size='11' text-anchor='middle' fill="#5f5c56">租户与供应商双重限流</text></g><g><rect x='24' y='180' width='176' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='112' y='204' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Worker · deliver 节点</text><text x='112' y='219.5' font-size='11' text-anchor='middle' fill="#5f5c56">把 token 发布到 Task 频道</text></g><g><rect x='24' y='246' width='176' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='112' y='270' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Policy Engine</text><text x='112' y='285.5' font-size='11' text-anchor='middle' fill="#5f5c56">单一写者锁</text></g><g><rect x='232' y='104' width='196' height='104' rx='8' fill="#2f6fd6" fill-opacity='0.12' stroke="#2f6fd6" stroke-width='2'/><text x='330' y='128' font-weight='600' text-anchor='middle' fill="#1f1e1c">Cache</text><text x='330' y='143.5' font-size='11' text-anchor='middle' fill="#5f5c56">计数与限流</text><text x='330' y='159.5' font-size='11' text-anchor='middle' fill="#5f5c56">发布订阅</text><text x='330' y='175.5' font-size='11' text-anchor='middle' fill="#5f5c56">带过期的键值</text><text x='330' y='191.5' font-size='11' text-anchor='middle' fill="#5f5c56">分布式锁</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M200 76L216 76L216 274L200 274'/><path d='M200 142L216 142'/><path d='M200 208L216 208'/><path d='M216 156L232 156' marker-end='url(#if-valkey-arrow)'/></g><g><rect x='460' y='104' width='120' height='88' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='520' y='128' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">Valkey</text><text x='520' y='143.5' font-size='11' text-anchor='middle' fill="#5f5c56">Helm</text><text x='520' y='159.5' font-size='11' text-anchor='middle' fill="#5f5c56">StatefulSet</text><text x='520' y='175.5' font-size='11' text-anchor='middle' fill="#5f5c56">BSD 许可</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M428 156L460 156' marker-end='url(#if-valkey-arrow)'/></g><g><rect x='612' y='64' width='124' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='674' y='88' font-size='11.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">Ingress 节点 A</text><text x='674' y='103.5' font-size='11' text-anchor='middle' fill="#5f5c56">订阅频道</text></g><g><rect x='612' y='136' width='124' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='674' y='160' font-size='11.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">Ingress 节点 B</text><text x='674' y='175.5' font-size='11' text-anchor='middle' fill="#5f5c56">订阅频道</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M580 148L596 148L596 92L612 92' marker-end='url(#if-valkey-arrow)'/><path d='M596 148L596 164L612 164' marker-end='url(#if-valkey-arrow)'/></g><g><rect x='612' y='220' width='124' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='674' y='244' font-size='11.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">客户端</text><text x='674' y='259.5' font-size='11' text-anchor='middle' fill="#5f5c56">SSE 连接</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M674 192L674 220' marker-end='url(#if-valkey-arrow)'/></g><text x='460' y='252' font-size='11' fill="#5f5c56">推流：任一节点都能</text><text x='460' y='268' font-size='11' fill="#5f5c56">转发任一 Task 的事件</text><g><rect x='24' y='316' width='712' height='88' rx='8' fill="#f2f0ea" stroke='none'/><text x='40' y='338' font-size='12.5' font-weight='600' fill="#1f1e1c">特点</text><text x='40' y='358' font-size='11.5' fill="#5f5c56">与 Redis 协议兼容，客户端直接复用；Linux 基金会托管，BSD 许可</text><text x='40' y='376' font-size='11.5' fill="#5f5c56">推流数据在 Cache 中设保留时间，断线后凭 Last-Event-ID 补发</text><text x='40' y='394' font-size='11.5' fill="#5f5c56">Hash、Sorted Set、Lua 脚本可直接实现滑动窗口限流；不能丢的状态放在 DurableEngine 或 RelationalStore</text></g></svg>
