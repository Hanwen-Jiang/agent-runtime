<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="666" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" viewBox='0 0 760 666' role='img' aria-label='Policy Engine：Hook 挂在 Task 生命周期的固定位置，只返回四种结果之一' font-size='13' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id='policy-mod-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill="#a9a59b"/></marker></defs><rect x="0" y="0" width="760" height="666" fill="#ffffff"/><text x='24' y='30' font-size='15' font-weight='600' fill="#1f1e1c">Policy Engine：Hook 挂在 Task 生命周期的固定位置，只返回四种结果之一</text><g><rect x='24' y='48' width='368' height='492' rx='12' fill='none' stroke="#a9a59b" stroke-width='1.5'/><text x='40' y='72' font-weight='600' fill="#1f1e1c">Task 生命周期上的挂载点</text></g><g><rect x='40' y='88' width='336' height='52' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='56' y='112' font-size='12' font-weight='600' fill="#1f1e1c">on_task_received</text><text x='56' y='127.5' font-size='11' fill="#5f5c56">Task 进入分诊前：敏感内容过滤、补充上下文</text></g><g><rect x='40' y='152' width='336' height='52' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='56' y='176' font-size='12' font-weight='600' fill="#1f1e1c">on_task_start</text><text x='56' y='191.5' font-size='11' fill="#5f5c56">Planner 载入状态时：注入项目规则与偏好</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M64 140L64 152' marker-end='url(#policy-mod-arrow)'/></g><g><rect x='40' y='216' width='336' height='52' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='56' y='240' font-size='12' font-weight='600' fill="#1f1e1c">before_stage / after_stage</text><text x='56' y='255.5' font-size='11' fill="#5f5c56">每个 Stage 前后：预算检查；检查点</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M64 204L64 216' marker-end='url(#policy-mod-arrow)'/></g><g><rect x='40' y='280' width='336' height='52' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='56' y='304' font-size='12' font-weight='600' fill="#1f1e1c">before_node / after_node</text><text x='56' y='319.5' font-size='11' fill="#5f5c56">每个 Node 前后：权限、审批、脱敏；校验、审计</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M64 268L64 280' marker-end='url(#policy-mod-arrow)'/></g><g><rect x='40' y='344' width='336' height='52' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='56' y='368' font-size='12' font-weight='600' fill="#1f1e1c">before_compact</text><text x='56' y='383.5' font-size='11' fill="#5f5c56">压缩前：把精确状态写进 Task State</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M64 332L64 344' marker-end='url(#policy-mod-arrow)'/></g><g><rect x='40' y='408' width='336' height='52' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='56' y='432' font-size='12' font-weight='600' fill="#1f1e1c">before_finish</text><text x='56' y='447.5' font-size='11' fill="#5f5c56">done 前：对照验收条件复核，不满足就驳回</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M64 396L64 408' marker-end='url(#policy-mod-arrow)'/></g><g><rect x='40' y='472' width='336' height='52' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='56' y='496' font-size='12' font-weight='600' fill="#1f1e1c">on_task_end</text><text x='56' y='511.5' font-size='11' fill="#5f5c56">Task 结束：写回经验、清理资源</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M64 460L64 472' marker-end='url(#policy-mod-arrow)'/></g><g><rect x='432' y='48' width='304' height='228' rx='12' fill='none' stroke="#a9a59b" stroke-width='1.5'/><text x='448' y='72' font-weight='600' fill="#1f1e1c">Hook 的来源</text></g><g><rect x='448' y='88' width='272' height='36' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='584' y='110' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Recipe 声明</text></g><g><rect x='448' y='132' width='272' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='584' y='156' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">租户策略</text><text x='584' y='171.5' font-size='11' text-anchor='middle' fill="#5f5c56">数据驻留、模型白名单、敏感字段脱敏</text></g><g><rect x='448' y='196' width='272' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='584' y='220' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">按 effect 自动插入</text><text x='584' y='235.5' font-size='11' text-anchor='middle' fill="#5f5c56">write_irreversible 前插入人工审批</text></g><g><rect x='432' y='316' width='304' height='72' rx='8' fill="#2f6fd6" fill-opacity='0.12' stroke="#2f6fd6" stroke-width='2'/><text x='584' y='340' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">Hook 执行</text><text x='584' y='355.5' font-size='11' text-anchor='middle' fill="#5f5c56">必须便宜且确定，不做复杂推理</text><text x='584' y='371.5' font-size='11' text-anchor='middle' fill="#5f5c56">Planner 不手写 Hook</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M584 276L584 316' marker-end='url(#policy-mod-arrow)'/><path d='M392 352L432 352' marker-end='url(#policy-mod-arrow)'/><path d='M584 388L584 420' marker-end='url(#policy-mod-arrow)'/></g><g><rect x='432' y='420' width='304' height='40' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='584' y='443.8' font-size='11.5' text-anchor='middle' fill="#5f5c56">allow：放行</text></g><g><rect x='432' y='468' width='304' height='40' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='584' y='491.8' font-size='11.5' text-anchor='middle' fill="#5f5c56">deny：Node 记为 denied，交给 Reviewer</text></g><g><rect x='432' y='516' width='304' height='40' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='584' y='539.8' font-size='11.5' text-anchor='middle' fill="#5f5c56">modify：改写输入或输出，例如脱敏</text></g><g><rect x='432' y='564' width='304' height='40' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='584' y='587.8' font-size='11.5' text-anchor='middle' fill="#5f5c56">inject：向上下文追加，例如项目规则</text></g><text x='432' y='624' font-size='11' fill="#5f5c56">会驳回或触发重试的 Hook 都有次数上限，例如</text><text x='432' y='640' font-size='11' fill="#5f5c56">before_finish 驳回完成。deny 不自动重试。</text></svg>
