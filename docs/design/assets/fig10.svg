<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="604" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" viewBox='0 0 760 604' role='img' aria-label='Node Executor：effect 决定能否缓存与重试，executor 决定走哪条执行路径' font-size='13' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id='exec-mod-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill="#a9a59b"/></marker></defs><rect x="0" y="0" width="760" height="604" fill="#ffffff"/><text x='24' y='30' font-size='15' font-weight='600' fill="#1f1e1c">Node Executor：effect 决定能否缓存与重试，executor 决定走哪条执行路径</text><g><rect x='24' y='48' width='300' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='174' y='72' font-weight='600' text-anchor='middle' fill="#1f1e1c">Node 定义 + 上游 result</text><text x='174' y='87.5' font-size='11' text-anchor='middle' fill="#5f5c56">inputs 只能引用上游 result、Task State 或常量</text></g><g><rect x='24' y='136' width='300' height='160' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='40' y='160' font-size='12.5' font-weight='600' fill="#1f1e1c">按 effect 定规则</text><text x='40' y='184' font-size='11' fill="#5f5c56">none、read：可缓存（read 设 TTL），可重试</text><text x='40' y='208' font-size='11' fill="#5f5c56">write_reversible：不缓存，仅幂等时重试</text><text x='40' y='224' font-size='11' fill="#5f5c56">必须带幂等键，记录回滚方式</text><text x='40' y='248' font-size='11' fill="#5f5c56">write_irreversible：不缓存，不自动重试</text><text x='40' y='264' font-size='11' fill="#5f5c56">必须带幂等键，前置人工审批</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M174 104L174 136' marker-end='url(#exec-mod-arrow)'/></g><g><polygon points='89,344 174,318 259,344 174,370' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='174' y='347.8' font-size='11.5' text-anchor='middle' fill="#1f1e1c">缓存命中？</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M174 296L174 318' marker-end='url(#exec-mod-arrow)'/></g><g><rect x='24' y='400' width='120' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='84' y='424' font-weight='600' text-anchor='middle' fill="#1f1e1c">直接返回</text><text x='84' y='439.5' font-size='11' text-anchor='middle' fill="#5f5c56">缓存的结果</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M89 344L84 344L84 400' marker-end='url(#exec-mod-arrow)'/></g><text x='66' y='336' font-size='11' text-anchor='middle' fill="#5f5c56">是</text><g><rect x='360' y='48' width='376' height='316' rx='12' fill='none' stroke="#a9a59b" stroke-width='1.5'/><text x='376' y='72' font-weight='600' fill="#1f1e1c">按 executor 执行</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M259 344L344 344L344 120L376 120' marker-end='url(#exec-mod-arrow)'/></g><text x='268' y='336' font-size='11' fill="#5f5c56">否</text><g><rect x='376' y='88' width='344' height='88' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='392' y='112' font-weight='600' fill="#1f1e1c">model</text><text x='392' y='127.5' font-size='11' fill="#5f5c56">generate：Context Builder 组装上下文，结构化输出</text><text x='392' y='143.5' font-size='11' fill="#5f5c56">score、embed、classify：批量调用</text><text x='392' y='159.5' font-size='11' fill="#5f5c56">都经 Model Gateway</text></g><g><rect x='376' y='192' width='344' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='392' y='216' font-weight='600' fill="#1f1e1c">program</text><text x='392' y='231.5' font-size='11' fill="#5f5c56">本地代码：Sandbox，限 CPU、内存与网络</text><text x='392' y='247.5' font-size='11' fill="#5f5c56">外部调用：ToolDriver，按租户收窄权限</text></g><g><rect x='376' y='280' width='344' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='392' y='304' font-weight='600' fill="#1f1e1c">human</text><text x='392' y='319.5' font-size='11' fill="#5f5c56">经 HumanChannel 发问；回复以信号送回</text></g><g><rect x='360' y='388' width='376' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='548' y='412' font-weight='600' text-anchor='middle' fill="#1f1e1c">校验输出</text><text x='548' y='427.5' font-size='11' text-anchor='middle' fill="#5f5c56">按 output_schema 校验；大结果写入 ObjectStore，只回摘要与路径</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M548 364L548 388' marker-end='url(#exec-mod-arrow)'/></g><g><rect x='360' y='468' width='376' height='72' rx='8' fill="#2f6fd6" fill-opacity='0.12' stroke="#2f6fd6" stroke-width='2'/><text x='548' y='492' font-weight='600' text-anchor='middle' fill="#1f1e1c">Node Output</text><text x='548' y='507.5' font-size='11' text-anchor='middle' fill="#5f5c56">result → 下游 · rationale → 只写 trace</text><text x='548' y='523.5' font-size='11' text-anchor='middle' fill="#5f5c56">meta：tier、tokens、成本、延迟</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M548 444L548 468' marker-end='url(#exec-mod-arrow)'/></g><g><rect x='24' y='480' width='296' height='104' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='40' y='504' font-weight='600' fill="#1f1e1c">失败分类</text><text x='40' y='519.5' font-size='11' fill="#5f5c56">transient：按 retry 重试，先满足 effect 规则</text><text x='40' y='535.5' font-size='11' fill="#5f5c56">invalid_output：model 节点带错误重问 1 次</text><text x='40' y='551.5' font-size='11' fill="#5f5c56">denied：不重试，交给 Reviewer</text><text x='40' y='567.5' font-size='11' fill="#5f5c56">upstream_failed：标记 skipped</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M360 416L332 416L332 532L320 532' stroke-dasharray='4 3' marker-end='url(#exec-mod-arrow)'/></g><text x='346' y='410' font-size='11' text-anchor='middle' fill="#5f5c56">失败</text></svg>
