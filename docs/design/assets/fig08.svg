<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="642" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" viewBox='0 0 760 642' role='img' aria-label='Planner：先分诊，再按 Triage 级别决定规划深度，每轮只规划到下一个检查点' font-size='13' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id='planner-mod-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill="#a9a59b"/></marker></defs><rect x="0" y="0" width="760" height="642" fill="#ffffff"/><text x='24' y='30' font-size='15' font-weight='600' fill="#1f1e1c">Planner：先分诊，再按 Triage 级别决定规划深度，每轮只规划到下一个检查点</text><g><rect x='24' y='48' width='712' height='36' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='380' y='70' font-size='12' text-anchor='middle' fill="#5f5c56">输入：用户消息 · Task State · Session 上下文</text></g><g><rect x='230' y='112' width='300' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='380' y='136' font-weight='600' text-anchor='middle' fill="#1f1e1c">分诊：这条消息属于哪一类？</text><text x='380' y='151.5' font-size='11' text-anchor='middle' fill="#5f5c56">续改当前产出 · 加约束 · 新 Task · 关于系统的问题</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M380 84L380 112' marker-end='url(#planner-mod-arrow)'/></g><g><rect x='24' y='300' width='166' height='88' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='107' y='324' font-weight='600' text-anchor='middle' fill="#1f1e1c">fast</text><text x='107' y='339.5' font-size='11' text-anchor='middle' fill="#5f5c56">规则或分类器判定</text><text x='107' y='355.5' font-size='11' text-anchor='middle' fill="#5f5c56">单次调用，沿用 Task State</text><text x='107' y='371.5' font-size='11' text-anchor='middle' fill="#5f5c56">额外成本几乎为零</text></g><g><rect x='206' y='300' width='166' height='88' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='289' y='324' font-weight='600' text-anchor='middle' fill="#1f1e1c">light</text><text x='289' y='339.5' font-size='11' text-anchor='middle' fill="#5f5c56">命中 Recipe 缓存</text><text x='289' y='355.5' font-size='11' text-anchor='middle' fill="#5f5c56">差量检查后直接执行</text><text x='289' y='371.5' font-size='11' text-anchor='middle' fill="#5f5c56">一次小模型调用或纯规则</text></g><g><rect x='388' y='300' width='166' height='88' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='471' y='324' font-weight='600' text-anchor='middle' fill="#1f1e1c">full</text><text x='471' y='339.5' font-size='11' text-anchor='middle' fill="#5f5c56">检索经验与 Recipe</text><text x='471' y='355.5' font-size='11' text-anchor='middle' fill="#5f5c56">定 Stage 形状、Tier、预算</text><text x='471' y='371.5' font-size='11' text-anchor='middle' fill="#5f5c56">一到两次强模型调用</text></g><g><rect x='570' y='300' width='166' height='88' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='653' y='324' font-weight='600' text-anchor='middle' fill="#1f1e1c">replan</text><text x='653' y='339.5' font-size='11' text-anchor='middle' fill="#5f5c56">只重做剩余部分</text><text x='653' y='355.5' font-size='11' text-anchor='middle' fill="#5f5c56">保留已验证的 Node</text><text x='653' y='371.5' font-size='11' text-anchor='middle' fill="#5f5c56">成本同 full，范围更小</text></g><g><polygon points='290,236 380,210 470,236 380,262' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='380' y='239.8' font-size='11.5' text-anchor='middle' fill="#1f1e1c">差量检查：有变化？</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M230 140L107 140L107 300' marker-end='url(#planner-mod-arrow)'/></g><text x='115' y='164' font-size='11' fill="#5f5c56">续改当前产出</text><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M530 140L653 140L653 300' marker-end='url(#planner-mod-arrow)'/></g><text x='645' y='188' font-size='11' text-anchor='end' fill="#5f5c56">加约束</text><text x='645' y='204' font-size='11' text-anchor='end' fill="#5f5c56">Reviewer 判 replan</text><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M380 168L380 210' marker-end='url(#planner-mod-arrow)'/></g><text x='388' y='186' font-size='11' fill="#5f5c56">新 Task</text><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M290 236L289 236L289 300' marker-end='url(#planner-mod-arrow)'/><path d='M470 236L511 236L511 300' marker-end='url(#planner-mod-arrow)'/></g><text x='289.5' y='228' font-size='11' text-anchor='middle' fill="#5f5c56">否</text><text x='490.5' y='228' font-size='11' text-anchor='middle' fill="#5f5c56">是</text><g><rect x='210' y='404' width='526' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='473' y='428' font-weight='600' text-anchor='middle' fill="#1f1e1c">规划 Stage</text><text x='473' y='443.5' font-size='11' text-anchor='middle' fill="#5f5c56">只规划到下一个信息检查点</text><text x='473' y='459.5' font-size='11' text-anchor='middle' fill="#5f5c56">Atomic Node 从 Node Catalog 实例化，其余写成 Goal Node</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M289 388L289 404' marker-end='url(#planner-mod-arrow)'/><path d='M471 388L471 404' marker-end='url(#planner-mod-arrow)'/><path d='M653 388L653 404' marker-end='url(#planner-mod-arrow)'/></g><g><rect x='24' y='404' width='166' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='107' y='428' font-weight='600' text-anchor='middle' fill="#1f1e1c">单个 model 节点</text><text x='107' y='443.5' font-size='11' text-anchor='middle' fill="#5f5c56">直接执行</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M107 388L107 404' marker-end='url(#planner-mod-arrow)'/></g><g><rect x='210' y='508' width='526' height='56' rx='8' fill="#2f6fd6" fill-opacity='0.12' stroke="#2f6fd6" stroke-width='2'/><text x='473' y='532' font-weight='600' text-anchor='middle' fill="#1f1e1c">Stage 定义 → Stage Runner</text><text x='473' y='547.5' font-size='11' text-anchor='middle' fill="#5f5c56">首轮另输出 Task Plan，写入上下文的 brief 区</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M473 476L473 508' marker-end='url(#planner-mod-arrow)'/></g><text x='24' y='596' font-size='11.5' fill="#5f5c56">规则：风险等级上升（只读 → 可回滚写 → 不可逆）一律走 full；差量检查任一项为“是”也升级到 full。</text><text x='24' y='616' font-size='11.5' fill="#5f5c56">数据来源：Registry（Recipe、Node Catalog、Tier）· Memory Service（经验）· Model Gateway（规划模型）。</text></svg>
