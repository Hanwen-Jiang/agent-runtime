<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" viewBox='0 0 760 440' role='img' aria-label='Sandbox：program 节点的代码在隔离环境中执行，本期只定义接口' font-size='12.5' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id='if-sandbox-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill="#a9a59b"/></marker></defs><rect x="0" y="0" width="760" height="440" fill="#ffffff"/><text x='24' y='30' font-size='15' font-weight='600' fill="#1f1e1c">Sandbox：program 节点的代码在隔离环境中执行，本期只定义接口</text><g><rect x='24' y='64' width='176' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='112' y='88' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">Node Executor</text><text x='112' y='103.5' text-anchor='middle' font-size='11' fill="#5f5c56">program 节点的本地代码</text></g><g><rect x='24' y='130' width='176' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='112' y='154' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">ToolDriver</text><text x='112' y='169.5' text-anchor='middle' font-size='11' fill="#5f5c56">代码沙箱工具直接实现契约</text></g><g><rect x='24' y='196' width='176' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='112' y='220' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">Worker · program 池</text><text x='112' y='235.5' text-anchor='middle' font-size='11' fill="#5f5c56">受 Sandbox 容量约束</text></g><g><rect x='232' y='96' width='216' height='104' rx='8' fill="#2f6fd6" fill-opacity='0.12' stroke="#2f6fd6" stroke-width='1.5'/><text x='340' y='120' text-anchor='middle' font-size='13' font-weight='600' fill="#1f1e1c">Sandbox</text><text x='340' y='135.5' text-anchor='middle' font-size='11' fill="#5f5c56">创建环境：资源上限、网络策略</text><text x='340' y='151.5' text-anchor='middle' font-size='11' fill="#5f5c56">执行代码</text><text x='340' y='167.5' text-anchor='middle' font-size='11' fill="#5f5c56">读写文件</text><text x='340' y='183.5' text-anchor='middle' font-size='11' fill="#5f5c56">销毁</text></g><g><rect x='480' y='48' width='256' height='260' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='496' y='72' font-size='13' font-weight='600' fill="#1f1e1c">候选后端（本期不定）</text><text x='496' y='90' font-size='11' fill="#5f5c56">开发用本地子进程，仅限开发环境</text></g><g><rect x='496' y='104' width='224' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='608' y='128' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">WASM</text><text x='608' y='143.5' text-anchor='middle' font-size='11' fill="#5f5c56">启动快，隔离强；语言与系统调用受限</text></g><g><rect x='496' y='170' width='224' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='608' y='194' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">容器 + gVisor</text><text x='608' y='209.5' text-anchor='middle' font-size='11' fill="#5f5c56">兼容性好；隔离弱于虚拟机</text></g><g><rect x='496' y='236' width='224' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='608' y='260' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">microVM（如 Firecracker）</text><text x='608' y='275.5' text-anchor='middle' font-size='11' fill="#5f5c56">隔离最强；启动较慢，运维较重</text></g><g><rect x='232' y='244' width='104' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='284' y='268' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">SecretStore</text><text x='284' y='283.5' text-anchor='middle' font-size='11' fill="#5f5c56">沙箱临时凭据</text></g><g><rect x='344' y='244' width='104' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='396' y='268' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">ObjectStore</text><text x='396' y='283.5' text-anchor='middle' font-size='11' fill="#5f5c56">大结果写入</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M200 92H216'/><path d='M200 158H216'/><path d='M200 224H216'/><path d='M216 92V224'/><path d='M216 148H232' marker-end='url(#if-sandbox-arrow)'/><path d='M448 148H464'/><path d='M464 132V264'/><path d='M464 132H496' marker-end='url(#if-sandbox-arrow)'/><path d='M464 198H496' marker-end='url(#if-sandbox-arrow)'/><path d='M464 264H496' marker-end='url(#if-sandbox-arrow)'/><path d='M284 244V200' marker-end='url(#if-sandbox-arrow)'/><path d='M396 200V244' marker-end='url(#if-sandbox-arrow)'/></g><g><rect x='24' y='332' width='712' height='88' rx='8' fill="#f2f0ea" stroke='none'/><text x='40' y='354' font-size='12.5' font-weight='600' fill="#1f1e1c">特点</text><text x='40' y='374' font-size='11.5' fill="#5f5c56">本期只定义接口，核心代码只依赖 Sandbox 接口；生产后端在三个候选方向中再定</text><text x='40' y='392' font-size='11.5' fill="#5f5c56">本地代码在 Sandbox 中执行，限制 CPU、内存与网络；外部调用按租户收窄权限</text><text x='40' y='410' font-size='11.5' fill="#5f5c56">WASM 适合短小的计算与转换，容器 + gVisor 适合普通脚本与测试，microVM 适合不可信的用户代码</text></g></svg>
