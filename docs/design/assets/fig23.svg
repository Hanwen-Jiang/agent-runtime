<svg xmlns="http://www.w3.org/2000/svg" width="760" height="468" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" viewBox='0 0 760 468' role='img' aria-label='VectorStore：Qdrant 一次请求完成稠密 + 稀疏检索，过滤在检索中进行' font-size='13' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id='if-qdrant-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill="#a9a59b"/></marker></defs><rect x="0" y="0" width="760" height="468" fill="#ffffff"/><text x='24' y='30' font-size='15' font-weight='600' fill="#1f1e1c">VectorStore：Qdrant 一次请求完成稠密 + 稀疏检索，过滤在检索中进行</text><g><rect x='24' y='72' width='176' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='112' y='96' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">检索服务</text><text x='112' y='111.5' font-size='11' text-anchor='middle' fill="#5f5c56">混合查询 + 过滤</text></g><g><rect x='24' y='140' width='176' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='112' y='164' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">提炼 Worker</text><text x='112' y='179.5' font-size='11' text-anchor='middle' fill="#5f5c56">写入、删除、双写迁移</text></g><text x='24' y='60' font-size='12' font-weight='600' fill="#5f5c56">Memory Service</text><g><rect x='232' y='64' width='216' height='104' rx='8' fill="#2f6fd6" fill-opacity='0.12' stroke="#2f6fd6" stroke-width='2'/><text x='340' y='88' font-weight='600' text-anchor='middle' fill="#1f1e1c">VectorStore</text><text x='340' y='103.5' font-size='11' text-anchor='middle' fill="#5f5c56">按租户写入与删除</text><text x='340' y='119.5' font-size='11' text-anchor='middle' fill="#5f5c56">稠密 + 稀疏混合查询，RRF 融合</text><text x='340' y='135.5' font-size='11' text-anchor='middle' fill="#5f5c56">按字段过滤</text><text x='340' y='151.5' font-size='11' text-anchor='middle' fill="#5f5c56">按 embedding_version 双写迁移</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M200 100L216 100L216 168L200 168'/><path d='M216 116L232 116' marker-end='url(#if-qdrant-arrow)'/></g><g><rect x='480' y='48' width='256' height='288' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='496' y='72' font-weight='600' fill="#1f1e1c">Qdrant 集群</text><text x='496' y='90' font-size='11' fill="#5f5c56">Kubernetes · Helm · StatefulSet · 分片与副本</text></g><g><rect x='496' y='104' width='224' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='608' y='128' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">共享集合</text><text x='608' y='143.5' font-size='11' text-anchor='middle' fill="#5f5c56">按租户字段分区，查询必带租户过滤</text></g><g><rect x='496' y='170' width='224' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='608' y='194' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">独立集合或集群</text><text x='608' y='209.5' font-size='11' text-anchor='middle' fill="#5f5c56">大租户或高合规租户，独立密钥</text></g><g><rect x='496' y='236' width='224' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='608' y='260' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Platform 集合</text><text x='608' y='275.5' font-size='11' text-anchor='middle' fill="#5f5c56">只读，存平台级经验</text></g><text x='496' y='312' font-size='11' fill="#5f5c56">每个点同时存稠密向量与稀疏向量</text><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M448 132L496 132' marker-end='url(#if-qdrant-arrow)'/></g><g><rect x='24' y='360' width='712' height='88' rx='8' fill="#f2f0ea" stroke='none'/><text x='40' y='382' font-size='12.5' font-weight='600' fill="#1f1e1c">特点</text><text x='40' y='402' font-size='11.5' fill="#5f5c56">关键词检索用稀疏向量（BM25 或 SPLADE 类），不必维护两套检索系统，也没有双写不一致</text><text x='40' y='420' font-size='11.5' fill="#5f5c56">向量超过 5,000 万条开启量化与分片；超过 1.5 亿条评估 Milvus；长文档全文检索再引入 OpenSearch</text><text x='40' y='438' font-size='11.5' fill="#5f5c56">嵌入向量与原文同等敏感：按租户密钥加密，不跨租户共享索引</text></g></svg>
