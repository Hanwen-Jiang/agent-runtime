<svg xmlns="http://www.w3.org/2000/svg" width="760" height="586" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" viewBox='0 0 760 586' role='img' aria-label='DurableEngine：Temporal 集群保存执行状态，各 Worker 池长轮询各自的任务队列' font-size='13' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id='if-temporal-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill="#a9a59b"/></marker></defs><rect x="0" y="0" width="760" height="586" fill="#ffffff"/><text x='24' y='30' font-size='15' font-weight='600' fill="#1f1e1c">DurableEngine：Temporal 集群保存执行状态，各 Worker 池长轮询各自的任务队列</text><g><rect x='24' y='64' width='160' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='104' y='88' font-weight='600' text-anchor='middle' fill="#1f1e1c">Task Service</text><text x='104' y='103.5' font-size='11' text-anchor='middle' fill="#5f5c56">启动、信号、取消、查询</text><text x='104' y='119.5' font-size='11' text-anchor='middle' fill="#5f5c56">Go SDK 客户端</text></g><g><rect x='24' y='200' width='160' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='104' y='224' font-weight='600' text-anchor='middle' fill="#1f1e1c">KEDA</text><text x='104' y='239.5' font-size='11' text-anchor='middle' fill="#5f5c56">读取各队列积压</text><text x='104' y='255.5' font-size='11' text-anchor='middle' fill="#5f5c56">调整各池副本数</text></g><g><rect x='216' y='48' width='296' height='300' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='232' y='72' font-weight='600' fill="#1f1e1c">Temporal 集群（自建，Helm）</text></g><g><rect x='232' y='88' width='264' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='364' y='112' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Frontend</text><text x='364' y='127.5' font-size='11' text-anchor='middle' fill="#5f5c56">所有客户端与 Worker 的 gRPC 入口</text></g><g><rect x='232' y='160' width='264' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='364' y='184' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Matching</text><text x='364' y='199.5' font-size='11' text-anchor='middle' fill="#5f5c56">任务队列：session · task · decision</text><text x='364' y='215.5' font-size='11' text-anchor='middle' fill="#5f5c56">model · program · offline</text></g><g><rect x='232' y='248' width='264' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='364' y='272' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">History</text><text x='364' y='287.5' font-size='11' text-anchor='middle' fill="#5f5c56">事件历史与定时器</text><text x='364' y='303.5' font-size='11' text-anchor='middle' fill="#5f5c56">numHistoryShards 一次设为 2,048 或 4,096</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M364 144L364 160' marker-end='url(#if-temporal-arrow)'/><path d='M364 232L364 248' marker-end='url(#if-temporal-arrow)'/></g><g><rect x='216' y='380' width='296' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='364' y='404' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Temporal 状态库</text><text x='364' y='419.5' font-size='11' text-anchor='middle' fill="#5f5c56">Postgres 16 及以上 · 独立实例 · Advanced Visibility</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M364 320L364 380' marker-end='url(#if-temporal-arrow)'/><path d='M184 116L232 116' marker-end='url(#if-temporal-arrow)'/><path d='M184 236L216 236' stroke-dasharray='4 3' marker-end='url(#if-temporal-arrow)'/></g><text x='190' y='228' font-size='11' fill="#5f5c56">查积压</text><g><rect x='552' y='48' width='184' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='644' y='72' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Control Plane</text><text x='644' y='87.5' font-size='11' text-anchor='middle' fill="#5f5c56">Go Worker · session 队列</text></g><g><rect x='552' y='114' width='184' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='644' y='138' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Worker · task 池</text><text x='644' y='153.5' font-size='11' text-anchor='middle' fill="#5f5c56">Task 工作流</text></g><g><rect x='552' y='180' width='184' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='644' y='204' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Worker · decision 池</text><text x='644' y='219.5' font-size='11' text-anchor='middle' fill="#5f5c56">Planner、Reviewer</text></g><g><rect x='552' y='246' width='184' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='644' y='270' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">model、program 池</text><text x='644' y='285.5' font-size='11' text-anchor='middle' fill="#5f5c56">Node activity</text></g><g><rect x='552' y='312' width='184' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='644' y='336' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Memory、Learning</text><text x='644' y='351.5' font-size='11' text-anchor='middle' fill="#5f5c56">offline 队列</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M552 76L532 76L532 340L552 340'/><path d='M552 142L532 142'/><path d='M552 208L532 208'/><path d='M552 274L532 274'/><path d='M532 116L496 116' marker-end='url(#if-temporal-arrow)'/></g><text x='552' y='390' font-size='11' fill="#5f5c56">各池经 Frontend 长轮询拉取</text><text x='552' y='406' font-size='11' fill="#5f5c56">自己的队列，结果写回历史</text><g><rect x='24' y='460' width='712' height='106' rx='8' fill="#f2f0ea" stroke='none'/><text x='40' y='482' font-size='12.5' font-weight='600' fill="#1f1e1c">特点</text><text x='40' y='502' font-size='11.5' fill="#5f5c56">重放恢复：编排代码确定性，模型调用与副作用作为 activity 记入事件历史</text><text x='40' y='520' font-size='11.5' fill="#5f5c56">单个工作流历史 10,240 事件或 10 MB 告警，51,200 或 50 MB 为硬上限，Session 定期 Continue-As-New</text><text x='40' y='538' font-size='11.5' fill="#5f5c56">单个载荷默认上限 2 MB：超过 64 KB 的载荷由 PayloadCodec 加密卸载到 S3（Claim-Check）</text><text x='40' y='556' font-size='11.5' fill="#5f5c56">状态吞吐超过约 3,000 Actions/s 时，存储换成 Cassandra + OpenSearch</text></g></svg>
