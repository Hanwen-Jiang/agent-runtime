<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" viewBox='0 0 760 520' role='img' aria-label='Telemetry：一份 OpenTelemetry 打点，Collector 分三路送出' font-size='12.5' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id='if-otel-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill="#a9a59b"/></marker></defs><rect x="0" y="0" width="760" height="520" fill="#ffffff"/><text x='24' y='30' font-size='15' font-weight='600' fill="#1f1e1c">Telemetry：一份 OpenTelemetry 打点，Collector 分三路送出</text><g><rect x='24' y='56' width='184' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='116' y='80' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">Control Plane</text><text x='116' y='95.5' text-anchor='middle' font-size='11' fill="#5f5c56">基础设施 span</text></g><g><rect x='24' y='122' width='184' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='116' y='146' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">Worker</text><text x='116' y='161.5' text-anchor='middle' font-size='11' fill="#5f5c56">基础设施 + Agent 语义 span</text></g><g><rect x='24' y='188' width='184' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='116' y='212' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">Model Gateway</text><text x='116' y='227.5' text-anchor='middle' font-size='11' fill="#5f5c56">基础设施 + 模型语义 span</text></g><g><rect x='24' y='254' width='184' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='116' y='278' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">Memory · Learning</text><text x='116' y='293.5' text-anchor='middle' font-size='11' fill="#5f5c56">基础设施 span</text></g><g><rect x='232' y='120' width='216' height='104' rx='8' fill="#2f6fd6" fill-opacity='0.12' stroke="#2f6fd6" stroke-width='1.5'/><text x='340' y='144' text-anchor='middle' font-size='13' font-weight='600' fill="#1f1e1c">Telemetry</text><text x='340' y='159.5' text-anchor='middle' font-size='11' fill="#5f5c56">OpenTelemetry 统一打点</text><text x='340' y='175.5' text-anchor='middle' font-size='11' fill="#5f5c56">span、指标与日志</text><text x='340' y='191.5' text-anchor='middle' font-size='11' fill="#5f5c56">注入 WorkflowID、RunID</text><text x='340' y='207.5' text-anchor='middle' font-size='11' fill="#5f5c56">经 OTLP 发往 Collector</text></g><g><rect x='480' y='48' width='256' height='260' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='496' y='72' font-size='13' font-weight='600' fill="#1f1e1c">OpenTelemetry Collector</text><text x='496' y='90' font-size='11' fill="#5f5c56">一份打点，三路导出</text></g><g><rect x='496' y='104' width='224' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='608' y='128' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">Grafana Tempo</text><text x='608' y='143.5' text-anchor='middle' font-size='11' fill="#5f5c56">基础设施 span：服务调用链与耗时</text></g><g><rect x='496' y='170' width='224' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='608' y='194' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">Langfuse（自建）</text><text x='608' y='209.5' text-anchor='middle' font-size='11' fill="#5f5c56">语义 span，经 otlphttp 导出</text></g><g><rect x='496' y='236' width='224' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='608' y='260' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">EventStream · Redpanda</text><text x='608' y='275.5' text-anchor='middle' font-size='11' fill="#5f5c56">Kafka 协议，供离线管道消费</text></g><g><rect x='496' y='332' width='224' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='608' y='356' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">Learning Pipeline</text><text x='608' y='371.5' text-anchor='middle' font-size='11' fill="#5f5c56">归因、评测、Recipe 统计</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M208 84H216'/><path d='M208 150H216'/><path d='M208 216H216'/><path d='M208 282H216'/><path d='M216 84V282'/><path d='M216 172H232' marker-end='url(#if-otel-arrow)'/><path d='M448 172H464'/><path d='M464 132V264'/><path d='M464 132H496' marker-end='url(#if-otel-arrow)'/><path d='M464 198H496' marker-end='url(#if-otel-arrow)'/><path d='M464 264H496' marker-end='url(#if-otel-arrow)'/><path d='M608 292V332' marker-end='url(#if-otel-arrow)'/></g><text x='616' y='324' font-size='11.5' fill="#5f5c56">消费</text><g><rect x='24' y='412' width='712' height='88' rx='8' fill="#f2f0ea" stroke='none'/><text x='40' y='434' font-size='12.5' font-weight='600' fill="#1f1e1c">特点</text><text x='40' y='454' font-size='11.5' fill="#5f5c56">一份打点、两个后端：Tempo 看服务调用链与耗时，Langfuse 看模型调用、多步嵌套、token 成本与评测</text><text x='40' y='472' font-size='11.5' fill="#5f5c56">Langfuse 目前只支持 OTLP over HTTP，不支持 gRPC，所以 Collector 用 otlphttp 导出</text><text x='40' y='490' font-size='11.5' fill="#5f5c56">GenAI 语义约定仍处于 Development 阶段，span 属性要随版本调整</text></g></svg>
