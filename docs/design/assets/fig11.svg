<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="764" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" viewBox='0 0 760 764' role='img' aria-label='Reviewer：只看结果与验收条件，按问题所在的层级选 Verdict' font-size='13' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id='review-mod-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill="#a9a59b"/></marker></defs><rect x="0" y="0" width="760" height="764" fill="#ffffff"/><text x='24' y='30' font-size='15' font-weight='600' fill="#1f1e1c">Reviewer：只看结果与验收条件，按问题所在的层级选 Verdict</text><g><rect x='24' y='48' width='440' height='36' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='244' y='70' font-size='12' text-anchor='middle' fill="#5f5c56">输入：Stage 结果 · Task State · 验收条件</text></g><g><rect x='24' y='108' width='440' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='244' y='132' font-weight='600' text-anchor='middle' fill="#1f1e1c">汇总</text><text x='244' y='147.5' font-size='11' text-anchor='middle' fill="#5f5c56">写入 Task State：已验证的事实、待查的假设、产物、Stage 记录</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M244 84L244 108' marker-end='url(#review-mod-arrow)'/><path d='M244 164L244 188' marker-end='url(#review-mod-arrow)'/></g><g><rect x='24' y='188' width='440' height='196' rx='12' fill='none' stroke="#a9a59b" stroke-width='1.5'/><text x='40' y='212' font-weight='600' fill="#1f1e1c">诊断</text></g><g><rect x='40' y='224' width='200' height='88' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='140' y='248' font-weight='600' text-anchor='middle' fill="#1f1e1c">硬信号（代码计算）</text><text x='140' y='263.5' font-size='11' text-anchor='middle' fill="#5f5c56">重复 · 停滞 · 预算燃烧</text><text x='140' y='279.5' font-size='11' text-anchor='middle' fill="#5f5c56">计划漂移 · 上下文健康</text><text x='140' y='295.5' font-size='11' text-anchor='middle' fill="#5f5c56">并行异常 · 样本分歧</text></g><g><rect x='248' y='224' width='200' height='88' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='348' y='248' font-weight='600' text-anchor='middle' fill="#1f1e1c">Progress Check</text><text x='348' y='263.5' font-size='11' text-anchor='middle' fill="#5f5c56">已满足验收条件？有实质进展？</text><text x='348' y='279.5' font-size='11' text-anchor='middle' fill="#5f5c56">在绕圈？假设还成立？</text><text x='348' y='295.5' font-size='11' text-anchor='middle' fill="#5f5c56">下一步做什么、由谁做？</text></g><text x='40' y='324' font-size='11' fill="#5f5c56">Progress Check 交给独立上下文或另一家模型；</text><text x='40' y='342' font-size='11' fill="#5f5c56">是否完成看产出物本身，不看对话记录。</text><text x='40' y='368' font-size='11.5' font-weight='600' fill="#5f5c56">据此判断问题出在哪一层 ↓</text><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M244 384L244 408' marker-end='url(#review-mod-arrow)'/></g><g><rect x='24' y='408' width='440' height='144' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='40' y='436' font-size='12' font-weight='600' fill="#1f1e1c">执行失败</text><text x='448' y='436' font-size='12' text-anchor='end' fill="#1f1e1c">→ repair</text><text x='40' y='468' font-size='12' font-weight='600' fill="#1f1e1c">计划错误</text><text x='448' y='468' font-size='12' text-anchor='end' fill="#1f1e1c">→ replan</text><line x1='36' y1='448' x2='452' y2='448' stroke="#e4e1d9" stroke-width='1'/><text x='40' y='500' font-size='12' font-weight='600' fill="#1f1e1c">形状不对</text><text x='448' y='500' font-size='12' text-anchor='end' fill="#1f1e1c">→ replan 换形状 · reroute</text><line x1='36' y1='480' x2='452' y2='480' stroke="#e4e1d9" stroke-width='1'/><text x='40' y='532' font-size='12' font-weight='600' fill="#1f1e1c">目标误解</text><text x='448' y='532' font-size='12' text-anchor='end' fill="#1f1e1c">→ escalate</text><line x1='36' y1='512' x2='452' y2='512' stroke="#e4e1d9" stroke-width='1'/></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M244 552L244 576' marker-end='url(#review-mod-arrow)'/></g><g><rect x='24' y='576' width='440' height='72' rx='8' fill="#2f6fd6" fill-opacity='0.12' stroke="#2f6fd6" stroke-width='2'/><text x='244' y='600' font-weight='600' text-anchor='middle' fill="#1f1e1c">Verdict（八选一）</text><text x='244' y='615.5' font-size='11' text-anchor='middle' fill="#5f5c56">done · continue · repair · replan · rollback · reroute · escalate · abort</text><text x='244' y='631.5' font-size='11' text-anchor='middle' fill="#5f5c56">done 前先过 before_finish Hook，对照验收条件复核</text></g><g><rect x='24' y='672' width='440' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='244' y='696' font-weight='600' text-anchor='middle' fill="#1f1e1c">收尾（done 或 abort）</text><text x='244' y='711.5' font-size='11' text-anchor='middle' fill="#5f5c56">校验交付 · 归档 Task State · 更新 Session 状态</text><text x='244' y='727.5' font-size='11' text-anchor='middle' fill="#5f5c56">经验候选 → Memory Service；Recipe 统计与 trace → Learning Pipeline（异步）</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M244 648L244 672' marker-end='url(#review-mod-arrow)'/></g><g><rect x='496' y='48' width='240' height='504' rx='8' fill="#f2f0ea" stroke='none'/><text x='512' y='72' font-weight='600' fill="#1f1e1c">升级顺序：从小到大</text><text x='512' y='90' font-size='11' fill="#5f5c56">每一级都有次数上限</text></g><g><rect x='512' y='104' width='208' height='48' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='616' y='128' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">repair</text><text x='616' y='143.5' font-size='11' text-anchor='middle' fill="#5f5c56">带错误重试，2 到 3 次</text></g><g><rect x='512' y='160' width='208' height='48' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='616' y='184' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">repair</text><text x='616' y='199.5' font-size='11' text-anchor='middle' fill="#5f5c56">换工具、换路径、拆小 Node</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M616 152L616 160' marker-end='url(#review-mod-arrow)'/></g><g><rect x='512' y='216' width='208' height='48' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='616' y='240' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">replan</text><text x='616' y='255.5' font-size='11' text-anchor='middle' fill="#5f5c56">保留已验证 Node，重做剩余</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M616 208L616 216' marker-end='url(#review-mod-arrow)'/></g><g><rect x='512' y='272' width='208' height='48' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='616' y='296' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">replan · reroute</text><text x='616' y='311.5' font-size='11' text-anchor='middle' fill="#5f5c56">换 Stage 形状或换 Recipe</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M616 264L616 272' marker-end='url(#review-mod-arrow)'/></g><g><rect x='512' y='328' width='208' height='48' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='616' y='352' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">rollback</text><text x='616' y='367.5' font-size='11' text-anchor='middle' fill="#5f5c56">退回最近的检查点</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M616 320L616 328' marker-end='url(#review-mod-arrow)'/></g><g><rect x='512' y='384' width='208' height='48' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='616' y='408' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">escalate</text><text x='616' y='423.5' font-size='11' text-anchor='middle' fill="#5f5c56">换更强 Tier，或问人</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M616 376L616 384' marker-end='url(#review-mod-arrow)'/></g><g><rect x='512' y='440' width='208' height='48' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='616' y='464' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">abort</text><text x='616' y='479.5' font-size='11' text-anchor='middle' fill="#5f5c56">交付部分结果并说明原因</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M616 432L616 440' marker-end='url(#review-mod-arrow)'/></g><text x='512' y='502' font-size='11' fill="#5f5c56">同一 Node 失败 2 次换方法，</text><text x='512' y='518' font-size='11' fill="#5f5c56">3 次 replan；预算用掉 80% 而</text><text x='512' y='534' font-size='11' fill="#5f5c56">完成不到 50%，缩小范围或问人。</text></svg>
