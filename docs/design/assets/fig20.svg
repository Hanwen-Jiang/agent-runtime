<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" viewBox='0 0 760 760' role='img' aria-label='部署拓扑：全部组件运行在一个 Kubernetes 集群内，集群外只有云服务与第三方 API' font-size='13' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id='topo-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill="#a9a59b"/></marker></defs><rect x="0" y="0" width="760" height="760" fill="#ffffff"/><text x='24' y='30' font-size='15' font-weight='600' fill="#1f1e1c">部署拓扑：全部组件运行在一个 Kubernetes 集群内，集群外只有云服务与第三方 API</text><g><rect x='24' y='48' width='536' height='658' rx='12' fill='none' stroke="#a9a59b" stroke-width='1.5'/></g><g><rect x='40' y='84' width='504' height='72' rx='8' fill="#f2f0ea" stroke='none'/><text x='52' y='104' font-size='12' font-weight='600' fill="#5f5c56">入口</text></g><g><rect x='52' y='112' width='480' height='32' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='292' y='131.8' font-size='11.5' text-anchor='middle' fill="#5f5c56">Ingress 网关：只定义接口，候选为 Envoy 系、Kong 或云厂商网关</text></g><g><rect x='40' y='168' width='504' height='166' rx='8' fill="#f2f0ea" stroke='none'/><text x='52' y='188' font-size='12' font-weight='600' fill="#5f5c56">无状态服务</text><text x='532' y='188' font-size='11' text-anchor='end' fill="#5f5c56">Deployment · 多副本</text></g><g><rect x='52' y='196' width='153.3' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='128.7' y='220' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Control Plane</text><text x='128.7' y='235.5' font-size='11' text-anchor='middle' fill="#5f5c56">Go · 入口与 Registry</text></g><g><rect x='215.3' y='196' width='153.3' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='292' y='220' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Worker × 4 池</text><text x='292' y='235.5' font-size='11' text-anchor='middle' fill="#5f5c56">Python · KEDA 扩缩</text></g><g><rect x='378.7' y='196' width='153.3' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='455.4' y='220' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Model Gateway</text><text x='455.4' y='235.5' font-size='11' text-anchor='middle' fill="#5f5c56">Go · 模型调用出口</text></g><g><rect x='52' y='262' width='153.3' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='128.7' y='286' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Memory Service</text><text x='128.7' y='301.5' font-size='11' text-anchor='middle' fill="#5f5c56">Python · 检索与提炼</text></g><g><rect x='215.3' y='262' width='153.3' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='292' y='286' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Learning Pipeline</text><text x='292' y='301.5' font-size='11' text-anchor='middle' fill="#5f5c56">Python · 后台任务</text></g><g><rect x='378.7' y='262' width='153.3' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='455.4' y='286' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">KEDA</text><text x='455.4' y='301.5' font-size='11' text-anchor='middle' fill="#5f5c56">按队列积压与消费延迟扩缩</text></g><g><rect x='40' y='346' width='504' height='166' rx='8' fill="#f2f0ea" stroke='none'/><text x='52' y='366' font-size='12' font-weight='600' fill="#5f5c56">执行引擎与数据</text><text x='532' y='366' font-size='11' text-anchor='end' fill="#5f5c56">StatefulSet · Helm 或 Operator</text></g><g><rect x='52' y='374' width='153.3' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='128.7' y='398' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Temporal 服务</text><text x='128.7' y='413.5' font-size='11' text-anchor='middle' fill="#5f5c56">Frontend、History 等</text></g><g><rect x='215.3' y='374' width='153.3' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='292' y='398' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Temporal 状态库</text><text x='292' y='413.5' font-size='11' text-anchor='middle' fill="#5f5c56">Postgres 独立实例</text></g><g><rect x='378.7' y='374' width='153.3' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='455.4' y='398' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">业务 Postgres</text><text x='455.4' y='413.5' font-size='11' text-anchor='middle' fill="#5f5c56">高可用，Operator 部署</text></g><g><rect x='52' y='440' width='153.3' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='128.7' y='464' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Qdrant</text><text x='128.7' y='479.5' font-size='11' text-anchor='middle' fill="#5f5c56">分片与副本</text></g><g><rect x='215.3' y='440' width='153.3' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='292' y='464' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Valkey</text><text x='292' y='479.5' font-size='11' text-anchor='middle' fill="#5f5c56">限流、推流、锁</text></g><g><rect x='378.7' y='440' width='153.3' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='455.4' y='464' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Redpanda</text><text x='455.4' y='479.5' font-size='11' text-anchor='middle' fill="#5f5c56">trace 与离线管道</text></g><g><rect x='40' y='524' width='504' height='166' rx='8' fill="#f2f0ea" stroke='none'/><text x='52' y='544' font-size='12' font-weight='600' fill="#5f5c56">可观测、安全与接入</text><text x='532' y='544' font-size='11' text-anchor='end' fill="#5f5c56">Helm</text></g><g><rect x='52' y='552' width='153.3' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='128.7' y='576' font-size='1