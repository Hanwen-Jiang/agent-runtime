' y='431.5' font-size='11' text-anchor='middle' fill="#5f5c56">由 MCP Gateway 接入</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M560 420L592 420' stroke-dasharray='4 3'/></g><g><rect x='592' y='464' width='144' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='664' y='488' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">IM、邮件、工单</text><text x='664' y='503.5' font-size='11' text-anchor='middle' fill="#5f5c56">HumanChannel 的渠道</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M560 492L592 492' stroke-dasharray='4 3'/></g><text x='24' y='734' font-size='11.5' fill="#5f5c56">调用关系见 2.1 与第 3 章各单元图；各组件的接入方式见本章各节。</text></svg>
