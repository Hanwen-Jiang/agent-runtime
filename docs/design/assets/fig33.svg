<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="454" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" viewBox='0 0 760 454' role='img' aria-label='Ingress：控制指令走 HTTP POST，进度经 SSE 推回，断线凭 Last-Event-ID 续传' font-size='12.5' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id='if-ingress-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill="#a9a59b"/></marker></defs><rect x="0" y="0" width="760" height="454" fill="#ffffff"/><text x='24' y='30' font-size='15' font-weight='600' fill="#1f1e1c">Ingress：控制指令走 HTTP POST，进度经 SSE 推回，断线凭 Last-Event-ID 续传</text><g><rect x='24' y='88' width='176' height='104' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='112' y='112' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">客户端</text><text x='112' y='127.5' text-anchor='middle' font-size='11' fill="#5f5c56">产品界面与上层应用</text><text x='112' y='143.5' text-anchor='middle' font-size='11' fill="#5f5c56">HTTP POST 提交与控制</text><text x='112' y='159.5' text-anchor='middle' font-size='11' fill="#5f5c56">SSE 接收进度与结果</text><text x='112' y='175.5' text-anchor='middle' font-size='11' fill="#5f5c56">断线凭 Last-Event-ID 续传</text></g><g><rect x='232' y='88' width='216' height='104' rx='8' fill="#2f6fd6" fill-opacity='0.12' stroke="#2f6fd6" stroke-width='1.5'/><text x='340' y='112' text-anchor='middle' font-size='13' font-weight='600' fill="#1f1e1c">Ingress</text><text x='340' y='127.5' text-anchor='middle' font-size='11' fill="#5f5c56">认证、租户识别、限流</text><text x='340' y='143.5' text-anchor='middle' font-size='11' fill="#5f5c56">HTTP POST：提交、停止、审批</text><text x='340' y='159.5' text-anchor='middle' font-size='11' fill="#5f5c56">SSE：思考、工具状态、token</text><text x='340' y='175.5' text-anchor='middle' font-size='11' fill="#5f5c56">WebSocket 只用于实时语音</text></g><g><rect x='480' y='48' width='256' height='120' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='496' y='72' font-size='13' font-weight='600' fill="#1f1e1c">网关（只定义接口）</text><text x='496' y='90' font-size='11' fill="#5f5c56">无状态，可水平扩展</text></g><g><rect x='496' y='104' width='224' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='608' y='128' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">候选产品</text><text x='608' y='143.5' text-anchor='middle' font-size='11' fill="#5f5c56">Envoy 系网关、Kong、云厂商网关</text></g><g><rect x='496' y='196' width='224' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='608' y='220' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">Task Service</text><text x='608' y='235.5' text-anchor='middle' font-size='11' fill="#5f5c56">POST 转为准入、cancel 或信号</text></g><g><rect x='496' y='262' width='224' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='608' y='286' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">Cache · Valkey</text><text x='608' y='301.5' text-anchor='middle' font-size='11' fill="#5f5c56">deliver 节点推入 token；断线补发</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M200 140H232' marker-start='url(#if-ingress-arrow)' marker-end='url(#if-ingress-arrow)'/><path d='M448 140H464'/><path d='M464 140V132H496' marker-end='url(#if-ingress-arrow)'/><path d='M420 192V224H496' marker-end='url(#if-ingress-arrow)'/><path d='M496 290H360V192' marker-end='url(#if-ingress-arrow)'/></g><text x='428' y='216' font-size='11.5' fill="#5f5c56">提交与控制</text><text x='368' y='308' font-size='11.5' fill="#5f5c56">订阅推流</text><g><rect x='24' y='346' width='712' height='88' rx='8' fill="#f2f0ea" stroke='none'/><text x='40' y='368' font-size='12.5' font-weight='600' fill="#1f1e1c">特点</text><text x='40' y='388' font-size='11.5' fill="#5f5c56">SSE 基于普通 HTTP，容易穿过企业代理与网关；网关无状态，可水平扩展</text><text x='40' y='406' font-size='11.5' fill="#5f5c56">事件带递增 ID，断线后凭 Last-Event-ID 续传；推流数据在 Cache 中设保留时间</text><text x='40' y='424' font-size='11.5' fill="#5f5c56">SSE 是单向的，控制指令另走 HTTP POST；只有实时双向语音这类场景才单独开 WebSocket 端点</text></g></svg>
