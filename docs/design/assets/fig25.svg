<svg xmlns="http://www.w3.org/2000/svg" width="760" height="466" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" viewBox='0 0 760 466' role='img' aria-label='EventStream：Redpanda 把 trace 与离线管道的写入和消费解耦' font-size='13' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id='if-rp-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill="#a9a59b"/></marker></defs><rect x="0" y="0" width="760" height="466" fill="#ffffff"/><text x='24' y='30' font-size='15' font-weight='600' fill="#1f1e1c">EventStream：Redpanda 把 trace 与离线管道的写入和消费解耦</text><g><rect x='24' y='88' width='168' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='108' y='112' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">OTel Collector</text><text x='108' y='127.5' font-size='11' text-anchor='middle' fill="#5f5c56">Kafka 协议导出</text><text x='108' y='143.5' font-size='11' text-anchor='middle' fill="#5f5c56">trace 事件</text></g><g><rect x='224' y='72' width='200' height='88' rx='8' fill="#2f6fd6" fill-opacity='0.12' stroke="#2f6fd6" stroke-width='2'/><text x='324' y='96' font-weight='600' text-anchor='middle' fill="#1f1e1c">EventStream</text><text x='324' y='111.5' font-size='11' text-anchor='middle' fill="#5f5c56">按主题追加</text><text x='324' y='127.5' font-size='11' text-anchor='middle' fill="#5f5c56">按消费组读取与回放</text><text x='324' y='143.5' font-size='11' text-anchor='middle' fill="#5f5c56">按保留期清理</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M192 124L224 124' marker-end='url(#if-rp-arrow)'/></g><g><rect x='456' y='48' width='280' height='160' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='472' y='72' font-weight='600' fill="#1f1e1c">Redpanda 集群</text><text x='472' y='90' font-size='11' fill="#5f5c56">Kubernetes · Helm 或 Operator · StatefulSet</text></g><g><rect x='472' y='104' width='248' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='596' y='128' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">trace 主题</text><text x='596' y='143.5' font-size='11' text-anchor='middle' fill="#5f5c56">按分区并行；按保留期清理</text></g><text x='472' y='182' font-size='11' fill="#5f5c56">C++ 单二进制，没有 JVM 与 ZooKeeper</text><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M424 132L472 132' marker-end='url(#if-rp-arrow)'/></g><g><rect x='456' y='240' width='168' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='540' y='264' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Learning Pipeline</text><text x='540' y='279.5' font-size='11' text-anchor='middle' fill="#5f5c56">消费组读取 trace</text></g><g><rect x='640' y='240' width='96' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='688' y='264' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">KEDA</text><text x='688' y='279.5' font-size='11' text-anchor='middle' fill="#5f5c56">按消费延迟</text><text x='688' y='295.5' font-size='11' text-anchor='middle' fill="#5f5c56">扩缩</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M540 208L540 240' marker-end='url(#if-rp-arrow)'/><path d='M688 240L688 208' stroke-dasharray='4 3' marker-end='url(#if-rp-arrow)'/></g><g><rect x='24' y='340' width='712' height='106' rx='8' fill="#f2f0ea" stroke='none'/><text x='40' y='362' font-size='12.5' font-weight='600' fill="#1f1e1c">特点</text><text x='40' y='382' font-size='11.5' fill="#5f5c56">与 Kafka 协议兼容，Kafka 生态工具可直接使用；必要时换成 Kafka 不改代码</text><text x='40' y='400' font-size='11.5' fill="#5f5c56">社区版为 BSL 许可：不能作为商业流服务对外提供，内部使用不受影响</text><text x='40' y='418' font-size='11.5' fill="#5f5c56">分层存储（落 S3）、RBAC、审计日志、OIDC 认证属于企业版功能，需要许可证</text><text x='40' y='436' font-size='11.5' fill="#5f5c56">只需要轻量队列时，NATS JetStream 是更简单的备选</text></g></svg>
