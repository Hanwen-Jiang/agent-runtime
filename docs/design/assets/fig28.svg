<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" viewBox='0 0 760 460' role='img' aria-label='ToolDriver：内核只认已登记的强类型契约，外部 MCP 工具经边缘网关包装后接入' font-size='12.5' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id='if-tool-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill="#a9a59b"/></marker></defs><rect x="0" y="0" width="760" height="460" fill="#ffffff"/><text x='24' y='30' font-size='15' font-weight='600' fill="#1f1e1c">ToolDriver：内核只认已登记的强类型契约，外部 MCP 工具经边缘网关包装后接入</text><g><rect x='24' y='56' width='176' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='112' y='80' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">Node Executor</text><text x='112' y='95.5' text-anchor='middle' font-size='11' fill="#5f5c56">program 节点的外部调用</text></g><g><rect x='24' y='122' width='176' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='112' y='146' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">tool_loop</text><text x='112' y='161.5' text-anchor='middle' font-size='11' fill="#5f5c56">思考 → 调工具 → 观察</text></g><g><rect x='24' y='188' width='176' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='112' y='212' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">Policy Engine</text><text x='112' y='227.5' text-anchor='middle' font-size='11' fill="#5f5c56">调用前后执行 Hook</text></g><g><rect x='232' y='88' width='216' height='104' rx='8' fill="#2f6fd6" fill-opacity='0.12' stroke="#2f6fd6" stroke-width='1.5'/><text x='340' y='112' text-anchor='middle' font-size='13' font-weight='600' fill="#1f1e1c">ToolDriver</text><text x='340' y='127.5' text-anchor='middle' font-size='11' fill="#5f5c56">工具登记与调用</text><text x='340' y='143.5' text-anchor='middle' font-size='11' fill="#5f5c56">登记：名称、版本、JSON Schema</text><text x='340' y='159.5' text-anchor='middle' font-size='11' fill="#5f5c56">effect、权限、超时、幂等要求</text><text x='340' y='175.5' text-anchor='middle' font-size='11' fill="#5f5c56">未登记的工具不能调用</text></g><g><rect x='480' y='48' width='256' height='200' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='496' y='72' font-size='13' font-weight='600' fill="#1f1e1c">内核契约 + 边缘网关</text><text x='496' y='90' font-size='11' fill="#5f5c56">契约在 Worker 内执行，网关部署在边缘</text></g><g><rect x='496' y='104' width='224' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='608' y='128' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">平台内工具</text><text x='608' y='143.5' text-anchor='middle' font-size='11' fill="#5f5c56">代码沙箱、记忆检索、内部业务 API</text></g><g><rect x='496' y='170' width='224' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='608' y='194' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">MCP Gateway</text><text x='608' y='209.5' text-anchor='middle' font-size='11' fill="#5f5c56">扫描登记 MCP Server，包装成契约</text></g><g><rect x='496' y='280' width='224' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='608' y='304' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">外部 MCP Server × n</text><text x='608' y='319.5' text-anchor='middle' font-size='11' fill="#5f5c56">有状态会话由网关集中管理</text></g><g><rect x='232' y='236' width='104' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='284' y='260' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">SecretStore</text><text x='284' y='275.5' text-anchor='middle' font-size='11' fill="#5f5c56">租户工具凭据</text></g><g><rect x='344' y='236' width='104' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='396' y='260' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">ObjectStore</text><text x='396' y='275.5' text-anchor='middle' font-size='11' fill="#5f5c56">大结果落盘</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M200 84H216'/><path d='M200 150H216'/><path d='M200 216H216'/><path d='M216 84V216'/><path d='M216 140H232' marker-end='url(#if-tool-arrow)'/><path d='M448 140H464'/><path d='M464 132V198'/><path d='M464 132H496' marker-end='url(#if-tool-arrow)'/><path d='M464 198H496' marker-end='url(#if-tool-arrow)'/><path d='M608 226V280' marker-end='url(#if-tool-arrow)'/><path d='M284 236V192' marker-end='url(#if-tool-arrow)'/><path d='M396 192V236' marker-end='url(#if-tool-arrow)'/></g><text x='616' y='266' font-size='11.5' fill="#5f5c56">MCP 协议</text><g><rect x='24' y='352' width='712' height='88' rx='8' fill="#f2f0ea" stroke='none'/><text x='40' y='374' font-size='12.5' font-weight='600' fill="#1f1e1c">特点</text><text x='40' y='394' font-size='11.5' fill="#5f5c56">内核只认自定义的强类型契约，不受外部协议演进影响；effect、权限、幂等字段可以强制要求</text><text x='40' y='412' font-size='11.5' fill="#5f5c56">MCP 工具缺少 effect 等元数据，登记时人工补齐；有状态会话由网关集中管理，不进入内核</text><text x='40' y='430' font-size='11.5' fill="#5f5c56">平台内高频工具直接实现契约；外部调用使用 SecretStore 签发的短期凭据，大结果写入 ObjectStore</text></g></svg>
