<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="448" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" viewBox='0 0 760 448' role='img' aria-label='HumanChannel：问题发到人工渠道，回复以信号送回挂起的 Task 工作流' font-size='12.5' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id='if-human-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill="#a9a59b"/></marker></defs><rect x="0" y="0" width="760" height="448" fill="#ffffff"/><text x='24' y='30' font-size='15' font-weight='600' fill="#1f1e1c">HumanChannel：问题发到人工渠道，回复以信号送回挂起的 Task 工作流</text><g><rect x='24' y='64' width='176' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='112' y='88' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">human 节点 · gate</text><text x='112' y='103.5' text-anchor='middle' font-size='11' fill="#5f5c56">不可逆写操作前自动插入</text></g><g><rect x='24' y='130' width='176' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='112' y='154' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">Planner</text><text x='112' y='169.5' text-anchor='middle' font-size='11' fill="#5f5c56">full 规划时先向用户澄清</text></g><g><rect x='24' y='196' width='176' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='112' y='220' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">Reviewer</text><text x='112' y='235.5' text-anchor='middle' font-size='11' fill="#5f5c56">escalate 时问人</text></g><g><rect x='232' y='96' width='216' height='104' rx='8' fill="#2f6fd6" fill-opacity='0.12' stroke="#2f6fd6" stroke-width='1.5'/><text x='340' y='120' text-anchor='middle' font-size='13' font-weight='600' fill="#1f1e1c">HumanChannel</text><text x='340' y='135.5' text-anchor='middle' font-size='11' fill="#5f5c56">发出：问题与预设选项</text><text x='340' y='151.5' text-anchor='middle' font-size='11' fill="#5f5c56">截止时间、状态摘要</text><text x='340' y='167.5' text-anchor='middle' font-size='11' fill="#5f5c56">回复以信号送回工作流</text><text x='340' y='183.5' text-anchor='middle' font-size='11' fill="#5f5c56">开发实现：命令行</text></g><g><rect x='480' y='48' width='256' height='260' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='496' y='72' font-size='13' font-weight='600' fill="#1f1e1c">候选渠道（只定义接口）</text><text x='496' y='90' font-size='11' fill="#5f5c56">回复限定为预设选项</text></g><g><rect x='496' y='104' width='224' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='608' y='128' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">IM</text><text x='608' y='143.5' text-anchor='middle' font-size='11' fill="#5f5c56">Slack、飞书、企业微信；按钮式选项</text></g><g><rect x='496' y='170' width='224' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='608' y='194' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">邮件</text><text x='608' y='209.5' text-anchor='middle' font-size='11' fill="#5f5c56">普及、易留痕；回复解析不可靠</text></g><g><rect x='496' y='236' width='224' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='608' y='260' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">工单系统</text><text x='608' y='275.5' text-anchor='middle' font-size='11' fill="#5f5c56">有流转与审计；适合低频高风险审批</text></g><g><rect x='232' y='244' width='216' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='340' y='268' text-anchor='middle' font-size='12' font-weight='600' fill="#1f1e1c">DurableEngine · Temporal</text><text x='340' y='283.5' text-anchor='middle' font-size='11' fill="#5f5c56">工作流挂起，不占用 Worker</text><text x='340' y='299.5' text-anchor='middle' font-size='11' fill="#5f5c56">持久化定时器处理超时</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M200 92H216'/><path d='M200 158H216'/><path d='M200 224H216'/><path d='M216 92V224'/><path d='M216 148H232' marker-end='url(#if-human-arrow)'/><path d='M448 148H464' marker-start='url(#if-human-arrow)'/><path d='M464 132V264'/><path d='M464 132H496' marker-end='url(#if-human-arrow)'/><path d='M464 198H496' marker-end='url(#if-human-arrow)'/><path d='M464 264H496' marker-end='url(#if-human-arrow)'/><path d='M340 200V244' marker-end='url(#if-human-arrow)'/></g><text x='348' y='230' font-size='11.5' fill="#5f5c56">信号</text><g><rect x='24' y='340' width='712' height='88' rx='8' fill="#f2f0ea" stroke='none'/><text x='40' y='362' font-size='12.5' font-weight='600' fill="#1f1e1c">特点</text><text x='40' y='382' font-size='11.5' fill="#5f5c56">回复限定为预设选项，超时按模板默认处理：拒绝、升级，或带默认值继续</text><text x='40' y='400' font-size='11.5' fill="#5f5c56">Reviewer 升级问人时，回复只有三种：原样继续、带指导重规划、停止并用现有结果收尾</text><text x='40' y='418' font-size='11.5' fill="#5f5c56">等待人工期间工作流挂起，不占用 Worker；控制指令也可经 Ingress 的 HTTP POST 送达</text></g></svg>
