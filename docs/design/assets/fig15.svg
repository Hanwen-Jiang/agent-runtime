<svg xmlns="http://www.w3.org/2000/svg" width="760" height="676" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" viewBox='0 0 760 676' role='img' aria-label='Model Gateway：先过租户约束，再按每次成功的期望成本选档，失败时同档切换' font-size='13' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id='mg-mod-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill="#a9a59b"/></marker></defs><rect x="0" y="0" width="760" height="676" fill="#ffffff"/><text x='24' y='30' font-size='15' font-weight='600' fill="#1f1e1c">Model Gateway：先过租户约束，再按每次成功的期望成本选档，失败时同档切换</text><g><rect x='24' y='48' width='420' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='234' y='72' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">调用请求</text><text x='234' y='87.5' font-size='11' text-anchor='middle' fill="#5f5c56">Node 的 role、任务族、约束、期望的 Tier</text></g><g><rect x='24' y='124' width='420' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='234' y='148' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">过滤</text><text x='234' y='163.5' font-size='11' text-anchor='middle' fill="#5f5c56">剔除不满足租户策略的 Tier：模型白名单、</text><text x='234' y='179.5' font-size='11' text-anchor='middle' fill="#5f5c56">数据驻留、预算上限、BYOK、SLA 档位</text></g><g><rect x='24' y='216' width='420' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='234' y='240' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">选档</text><text x='234' y='255.5' font-size='11' text-anchor='middle' fill="#5f5c56">在剩余 Tier 中选每次成功的期望成本最低的</text><text x='234' y='271.5' font-size='11' text-anchor='middle' fill="#5f5c56">≈（单次尝试成本 + 单次验证成本）÷ 成功率</text></g><g><rect x='24' y='308' width='420' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='234' y='332' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">供应商池</text><text x='234' y='347.5' font-size='11' text-anchor='middle' fill="#5f5c56">每家供应商维护并发池与限流</text><text x='234' y='363.5' font-size='11' text-anchor='middle' fill="#5f5c56">按租户与供应商双重限流</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M234 104L234 124' marker-end='url(#mg-mod-arrow)'/><path d='M234 196L234 216' marker-end='url(#mg-mod-arrow)'/><path d='M234 288L234 308' marker-end='url(#mg-mod-arrow)'/></g><g><polygon points='159,436 234,410 309,436 234,462' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='234' y='439.8' font-size='11.5' text-anchor='middle' fill="#1f1e1c">调用成功？</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M234 380L234 410' marker-end='url(#mg-mod-arrow)'/></g><g><rect x='24' y='488' width='196' height='88' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='122' y='512' font-weight='600' text-anchor='middle' fill="#1f1e1c">失败处理</text><text x='122' y='527.5' font-size='11' text-anchor='middle' fill="#5f5c56">带抖动重试</text><text x='122' y='543.5' font-size='11' text-anchor='middle' fill="#5f5c56">超过上限：切换同档其他供应商</text><text x='122' y='559.5' font-size='11' text-anchor='middle' fill="#5f5c56">仍失败：交给 Reviewer</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M159 436L122 436L122 488' marker-end='url(#mg-mod-arrow)'/></g><text x='150' y='428' font-size='11' text-anchor='end' fill="#5f5c56">否</text><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M24 532L12 532L12 344L24 344' stroke-dasharray='4 3' marker-end='url(#mg-mod-arrow)'/></g><g><rect x='248' y='488' width='196' height='72' rx='8' fill="#2f6fd6" fill-opacity='0.12' stroke="#2f6fd6" stroke-width='2'/><text x='346' y='512' font-weight='600' text-anchor='middle' fill="#1f1e1c">返回结果</text><text x='346' y='527.5' font-size='11' text-anchor='middle' fill="#5f5c56">流式与结构化输出</text><text x='346' y='543.5' font-size='11' text-anchor='middle' fill="#5f5c56">错误语义统一</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M309 436L346 436L346 488' marker-end='url(#mg-mod-arrow)'/></g><text x='318' y='428' font-size='11' fill="#5f5c56">是</text><g><rect x='248' y='584' width='196' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='346' y='608' font-weight='600' text-anchor='middle' fill="#1f1e1c">计量</text><text x='346' y='623.5' font-size='11' text-anchor='middle' fill="#5f5c56">按租户记录 token 与成本</text><text x='346' y='639.5' font-size='11' text-anchor='middle' fill="#5f5c56">写入 trace</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M346 560L346 584' marker-end='url(#mg-mod-arrow)'/></g><g><rect x='476' y='48' width='260' height='236' rx='8' fill="#f2f0ea" stroke='none'/><text x='492' y='72' font-weight='600' fill="#1f1e1c">升降级</text><text x='492' y='96' font-size='11.5' fill="#1f1e1c">先调推理强度，再换模型</text><text x='492' y='116' font-size='11' fill="#5f5c56">升级：验证连续失败 2 次、ensemble</text><text x='492' y='132' font-size='11' fill="#5f5c56">分歧大、停滞计数到阈值、置信度低</text><text x='492' y='156' font-size='11' fill="#5f5c56">降级探索：小比例流量或影子运行</text><text x='492' y='172' font-size='11' fill="#5f5c56">试更便宜的 Tier，达标才切换</text><text x='492' y='196' font-size='11' fill="#5f5c56">Task 中途尽量不换主模型，</text><text x='492' y='212' font-size='11' fill="#5f5c56">以免丢失提示缓存</text><text x='492' y='236' font-size='11' fill="#5f5c56">judge 优先用与生成者不同家的模型</text><text x='492' y='260' font-size='11' fill="#5f5c56">Model Profile 来自 Registry</text></g><g><rect x='476' y='300' width='260' height='236' rx='12' fill='none' stroke="#a9a59b" stroke-width='1.5'/><text x='492' y='324' font-weight='600' fill="#1f1e1c">角色默认 Tier</text></g><text x='492' y='350' font-size='11' font-weight='600' fill="#1f1e1c">Planner、replan</text><text x='720' y='350' font-size='11' text-anchor='end' fill="#5f5c56">强模型，中到高推理强度</text><text x='492' y='375' font-size='11' font-weight='600' fill="#1f1e1c">工具执行、批量</text><text x='720' y='375' font-size='11' text-anchor='end' fill="#5f5c56">中小模型，低推理强度</text><text x='492' y='400' font-size='11' font-weight='600' fill="#1f1e1c">sub_agent</text><text x='720' y='400' font-size='11' text-anchor='end' fill="#5f5c56">中模型</text><text x='492' y='425' font-size='11' font-weight='600' fill="#1f1e1c">judge、Reviewer</text><text x='720' y='425' font-size='11' text-anchor='end' fill="#5f5c56">另一家的中强模型</text><text x='492' y='450' font-size='11' font-weight='600' fill="#1f1e1c">压缩、摘要</text><text x='720' y='450' font-size='11' text-anchor='end' fill="#5f5c56">小模型或与主模型同款</text><text x='492' y='475' font-size='11' font-weight='600' fill="#1f1e1c">分诊、route</text><text x='720' y='475' font-size='11' text-anchor='end' fill="#5f5c56">规则、分类器或最小模型</text><text x='492' y='500' font-size='11' font-weight='600' fill="#1f1e1c">不可逆动作前确认</text><text x='720' y='500' font-size='11' text-anchor='end' fill="#5f5c56">强模型</text></svg>
