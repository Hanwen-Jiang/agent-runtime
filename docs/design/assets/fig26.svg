<svg xmlns="http://www.w3.org/2000/svg" width="760" height="476" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" viewBox='0 0 760 476' role='img' aria-label='ObjectStore：大载荷不进工作流历史，按租户前缀加密存放' font-size='13' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id='if-s3-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill="#a9a59b"/></marker></defs><rect x="0" y="0" width="760" height="476" fill="#ffffff"/><text x='24' y='30' font-size='15' font-weight='600' fill="#1f1e1c">ObjectStore：大载荷不进工作流历史，按租户前缀加密存放</text><g><rect x='24' y='48' width='168' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='108' y='72' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Worker 各池</text><text x='108' y='87.5' font-size='11' text-anchor='middle' fill="#5f5c56">工作流大载荷</text></g><g><rect x='24' y='114' width='168' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='108' y='138' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Node Executor</text><text x='108' y='153.5' font-size='11' text-anchor='middle' fill="#5f5c56">大工具输出与产物</text></g><g><rect x='24' y='180' width='168' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='108' y='204' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Learning Pipeline</text><text x='108' y='219.5' font-size='11' text-anchor='middle' fill="#5f5c56">评测集与 trace 原文</text></g><g><rect x='24' y='246' width='168' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='108' y='270' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Tempo</text><text x='108' y='285.5' font-size='11' text-anchor='middle' fill="#5f5c56">系统 trace 的存储</text></g><g><rect x='224' y='112' width='200' height='104' rx='8' fill="#2f6fd6" fill-opacity='0.12' stroke="#2f6fd6" stroke-width='2'/><text x='324' y='136' font-weight='600' text-anchor='middle' fill="#1f1e1c">ObjectStore</text><text x='324' y='151.5' font-size='11' text-anchor='middle' fill="#5f5c56">按租户前缀读写对象</text><text x='324' y='167.5' font-size='11' text-anchor='middle' fill="#5f5c56">生成临时访问地址</text><text x='324' y='183.5' font-size='11' text-anchor='middle' fill="#5f5c56">生命周期策略</text><text x='324' y='199.5' font-size='11' text-anchor='middle' fill="#5f5c56">开发实现：本地磁盘</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M192 76L208 76L208 274L192 274'/><path d='M192 142L208 142'/><path d='M192 208L208 208'/><path d='M208 164L224 164' marker-end='url(#if-s3-arrow)'/></g><g><rect x='456' y='48' width='280' height='104' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='596' y='72' font-weight='600' text-anchor='middle' fill="#1f1e1c">S3 兼容存储</text><text x='596' y='87.5' font-size='11' text-anchor='middle' fill="#5f5c56">云上：云厂商对象存储</text><text x='596' y='103.5' font-size='11' text-anchor='middle' fill="#5f5c56">自建：SeaweedFS、MinIO 等</text><text x='596' y='119.5' font-size='11' text-anchor='middle' fill="#5f5c56">自建实现需评估许可与维护状态</text><text x='596' y='135.5' font-size='11' text-anchor='middle' fill="#5f5c56">按租户前缀隔离，按租户密钥加密</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M424 164L456 164' marker-end='url(#if-s3-arrow)'/></g><g><rect x='456' y='176' width='280' height='168' rx='12' fill='none' stroke="#a9a59b" stroke-width='1.5'/><text x='472' y='200' font-size='12.5' font-weight='600' fill="#1f1e1c">Claim-Check（工作流载荷）</text></g><g><polygon points='496,236 596,214 696,236 596,258' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='596' y='239.8' font-size='11.5' text-anchor='middle' fill="#1f1e1c">载荷超过 64 KB？</text></g><g><rect x='472' y='276' width='124' height='40' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='534' y='299.7' font-size='11' text-anchor='middle' fill="#5f5c56">加密上传，只存引用</text></g><g><rect x='600' y='276' width='120' height='40' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='660' y='299.7' font-size='11' text-anchor='middle' fill="#5f5c56">直接进事件历史</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M496 236L532 236L532 276' marker-end='url(#if-s3-arrow)'/><path d='M696 236L660 236L660 276' marker-end='url(#if-s3-arrow)'/></g><text x='488' y='230' font-size='11' text-anchor='end' fill="#5f5c56">是</text><text x='704' y='230' font-size='11' fill="#5f5c56">否</text><g><rect x='24' y='368' width='712' height='88' rx='8' fill="#f2f0ea" stroke='none'/><text x='40' y='390' font-size='12.5' font-weight='600' fill="#1f1e1c">特点</text><text x='40' y='410' font-size='11.5' fill="#5f5c56">Temporal 单个载荷默认上限 2 MB；PayloadCodec 是统一入口，接口不随实现变化</text><text x='40' y='428' font-size='11.5' fill="#5f5c56">Temporal 官方 External Storage 默认阈值 256 KiB，目前为公开预览，正式发布后再迁移</text><text x='40' y='446' font-size='11.5' fill="#5f5c56">多一次网络往返，只对大载荷生效</text></g></svg>
