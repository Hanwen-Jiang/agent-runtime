<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="656" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" viewBox='0 0 760 656' role='img' aria-label='Memory Service：写入走异步提炼与逐级晋升，检索先过滤再混合召回与重排' font-size='13' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id='mem-mod-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill="#a9a59b"/></marker></defs><rect x="0" y="0" width="760" height="656" fill="#ffffff"/><text x='24' y='30' font-size='15' font-weight='600' fill="#1f1e1c">Memory Service：写入走异步提炼与逐级晋升，检索先过滤再混合召回与重排</text><g><rect x='24' y='48' width='712' height='60' rx='8' fill="#f2f0ea" stroke='none'/><text x='40' y='70' font-size='12.5' font-weight='600' fill="#1f1e1c">作用域</text><text x='40' y='92' font-size='11.5' fill="#5f5c56">Platform · Tenant · Workspace · User · User × Workspace · Session · Task</text><text x='720' y='70' font-size='11' text-anchor='end' fill="#5f5c56">偏好跟人走，Workspace 知识跟项目走</text></g><text x='24' y='136' font-size='12.5' font-weight='600' fill="#5f5c56">写入（异步，offline 队列）</text><text x='392' y='136' font-size='12.5' font-weight='600' fill="#5f5c56">检索（同步，三个时机）</text><g><rect x='24' y='148' width='344' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='196' y='172' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">采集信号</text><text x='196' y='187.5' font-size='11' text-anchor='middle' fill="#5f5c56">显式表达、对输出的修改、验证结果、复盘</text></g><g><rect x='24' y='220' width='344' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='196' y='244' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">提炼候选</text><text x='196' y='259.5' font-size='11' text-anchor='middle' fill="#5f5c56">每条可执行，写明适用条件</text></g><g><rect x='24' y='292' width='344' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='196' y='316' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">合并</text><text x='196' y='331.5' font-size='11' text-anchor='middle' fill="#5f5c56">加证据、更新、新增或标记冲突；只做条目级增量</text></g><g><rect x='24' y='364' width='344' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='196' y='388' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">安全过滤</text><text x='196' y='403.5' font-size='11' text-anchor='middle' fill="#5f5c56">PII 脱敏，密钥拒绝入库，检测指令式内容</text></g><g><rect x='24' y='436' width='344' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='196' y='460' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">写入</text><text x='196' y='475.5' font-size='11' text-anchor='middle' fill="#5f5c56">条目进 Postgres，向量进 Qdrant，带 embedding_version</text></g><g><rect x='24' y='508' width='344' height='56' rx='8' fill="#2f6fd6" fill-opacity='0.12' stroke="#2f6fd6" stroke-width='2'/><text x='196' y='532' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">Promotion</text><text x='196' y='547.5' font-size='11' text-anchor='middle' fill="#5f5c56">Session → Workspace → Tenant，越大越需人工确认</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M196 204L196 220' marker-end='url(#mem-mod-arrow)'/><path d='M196 276L196 292' marker-end='url(#mem-mod-arrow)'/><path d='M196 348L196 364' marker-end='url(#mem-mod-arrow)'/><path d='M196 420L196 436' marker-end='url(#mem-mod-arrow)'/><path d='M196 492L196 508' marker-end='url(#mem-mod-arrow)'/></g><g><rect x='392' y='148' width='344' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='564' y='172' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">查询构造</text><text x='564' y='187.5' font-size='11' text-anchor='middle' fill="#5f5c56">规划时：任务描述 + 任务族；Node 开始：目标 + 工具</text></g><g><rect x='392' y='220' width='344' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='564' y='244' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">结构化预过滤</text><text x='564' y='259.5' font-size='11' text-anchor='middle' fill="#5f5c56">作用域 ACL、kind、任务族、未失效、敏感级别</text></g><g><rect x='392' y='292' width='344' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='564' y='316' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">混合召回</text><text x='564' y='331.5' font-size='11' text-anchor='middle' fill="#5f5c56">稠密与稀疏各取前 50，用 RRF 融合（k = 60）</text></g><g><rect x='392' y='364' width='344' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='564' y='388' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">重排</text><text x='564' y='403.5' font-size='11' text-anchor='middle' fill="#5f5c56">cross-encoder 或小模型重排，保留前 10</text></g><g><rect x='392' y='436' width='344' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='564' y='460' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">业务打分</text><text x='564' y='475.5' font-size='11' text-anchor='middle' fill="#5f5c56">重排分 × 信任 × 新鲜度 × 作用域权重，MMR 去冗余</text></g><g><rect x='392' y='508' width='344' height='56' rx='8' fill="#2f6fd6" fill-opacity='0.12' stroke="#2f6fd6" stroke-width='2'/><text x='564' y='532' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">注入</text><text x='564' y='547.5' font-size='11' text-anchor='middle' fill="#5f5c56">偏好进 profile 区，经验进 brief 区，按 token 预算</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M564 204L564 220' marker-end='url(#mem-mod-arrow)'/><path d='M564 276L564 292' marker-end='url(#mem-mod-arrow)'/><path d='M564 348L564 364' marker-end='url(#mem-mod-arrow)'/><path d='M564 420L564 436' marker-end='url(#mem-mod-arrow)'/><path d='M564 492L564 508' marker-end='url(#mem-mod-arrow)'/></g><g><rect x='392' y='580' width='344' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='564' y='604' font-size='12' font-weight='600' text-anchor='middle' fill="#1f1e1c">反馈</text><text x='564' y='619.5' font-size='11' text-anchor='middle' fill="#5f5c56">记录是否被采用与 Task 结果，更新 helped 与 hurt</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M564 564L564 580' marker-end='url(#mem-mod-arrow)'/></g><text x='24' y='594' font-size='11.5' fill="#5f5c56">出错时按错误签名精确匹配，向量兜底；</text><text x='24' y='612' font-size='11.5' fill="#5f5c56">外部来源的条目默认低信任，且不可晋升。</text></svg>
