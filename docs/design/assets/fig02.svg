<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="618" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" viewBox='0 0 760 618' role='img' aria-label='Task Loop：每个 Round 由 Planner 规划一个 Stage，执行后由 Reviewer 判定' font-size='13' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id='tl-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill="#a9a59b"/></marker></defs><rect x="0" y="0" width="760" height="618" fill="#ffffff"/><text x='24' y='30' font-size='15' font-weight='600' fill="#1f1e1c">Task Loop：每个 Task 都走同一个循环，只有 Stage 需要编排</text><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M340 80V108' marker-end='url(#tl-arrow)'/><path d='M340 172V194' marker-end='url(#tl-arrow)'/><path d='M340 222V242' marker-end='url(#tl-arrow)'/><path d='M340 404V424' marker-end='url(#tl-arrow)'/><path d='M340 452V472' marker-end='url(#tl-arrow)'/><path d='M120 504H96V140H120' marker-end='url(#tl-arrow)'/><path d='M300 536V562' marker-end='url(#tl-arrow)'/><path d='M505 536V562' marker-end='url(#tl-arrow)'/><path d='M600 140H560' marker-end='url(#tl-arrow)'/><path d='M560 504H600' marker-end='url(#tl-arrow)'/><path d='M560 344H600' marker-start='url(#tl-arrow)' marker-end='url(#tl-arrow)' stroke-dasharray='4 3'/><path d='M300 316H340V344'/><path d='M300 370H340V344'/><path d='M340 344H380' marker-end='url(#tl-arrow)'/></g><g><rect x='260' y='48' width='160' height='32' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='340' y='69' text-anchor='middle' font-size='12' fill="#1f1e1c">Task：用户的一条命令</text></g><g><rect x='120' y='108' width='440' height='64' rx='8' fill="#2f6fd6" fill-opacity='0.12' stroke="#2f6fd6" stroke-width='1.5'/><text x='340' y='134' text-anchor='middle' font-weight='600' fill="#1f1e1c">Planner（Round 开头）</text><text x='340' y='156' text-anchor='middle' font-size='11.5' fill="#1f1e1c">载入状态 · Triage · 选 Recipe 与 Tier · 规划 Stage</text></g><g><rect x='120' y='194' width='440' height='28' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='340' y='212' text-anchor='middle' font-size='11.5' fill="#5f5c56">前置 Hook：预算 · 权限 · 审批（按 effect 自动插入）</text></g><g><rect x='120' y='242' width='440' height='162' rx='10' fill='none' stroke="#a9a59b" stroke-width='1.5'/><text x='136' y='264' font-weight='600' fill="#1f1e1c">Stage：本轮唯一需要编排的部分</text><text x='136' y='282' font-size='11' fill="#5f5c56">Node DAG；无依赖的 Node 并行执行</text><rect x='140' y='296' width='160' height='40' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='220' y='320' text-anchor='middle' font-size='11.5' fill="#1f1e1c">fetch：查各区域数据</text><rect x='140' y='348' width='160' height='44' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='220' y='366' text-anchor='middle' font-size='11.5' fill="#1f1e1c">Goal Node：读工单</text><text x='220' y='382' text-anchor='middle' font-size='10.5' fill="#5f5c56">mode：sub_agent</text><rect x='380' y='320' width='160' height='48' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='460' y='340' text-anchor='middle' font-size='12' fill="#1f1e1c">transform：归因分析</text><text x='460' y='357' text-anchor='middle' font-size='10.5' fill="#5f5c56">quality：revise</text></g><g><rect x='120' y='424' width='440' height='28' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25' stroke-dasharray='4 3'/><text x='340' y='442' text-anchor='middle' font-size='11.5' fill="#5f5c56">后置 Hook：schema 校验 · 审计 · 检查点</text></g><g><rect x='120' y='472' width='440' height='64' rx='8' fill="#2f6fd6" fill-opacity='0.12' stroke="#2f6fd6" stroke-width='1.5'/><text x='340' y='498' text-anchor='middle' font-weight='600' fill="#1f1e1c">Reviewer（Round 结尾）</text><text x='340' y='520' text-anchor='middle' font-size='11.5' fill="#1f1e1c">汇总 · 更新 Task State · Verdict · 收尾</text></g><text x='72' y='316' text-anchor='middle' font-size='11' fill="#5f5c56">continue</text><text x='72' y='332' text-anchor='middle' font-size='11' fill="#5f5c56">或 replan</text><g><rect x='180' y='562' width='240' height='32' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='300' y='583' text-anchor='middle' font-size='11.5' fill="#1f1e1c">done：交付并写回 → End</text></g><g><rect x='450' y='562' width='110' height='32' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='505' y='583' text-anchor='middle' font-size='11' fill="#1f1e1c">escalate / abort</text></g><g><rect x='600' y='108' width='136' height='428' rx='10' fill="#f2f0ea" stroke="#a9a59b" stroke-width='1.25'/><text x='668' y='290' text-anchor='middle' font-weight='600' fill="#1f1e1c">外部状态</text><text x='668' y='314' text-anchor='middle' font-size='11.5' fill="#5f5c56">Task State</text><text x='668' y='334' text-anchor='middle' font-size='11.5' fill="#5f5c56">Session 状态</text><text x='668' y='354' text-anchor='middle' font-size='11.5' fill="#5f5c56">Memory</text><text x='668' y='374' text-anchor='middle' font-size='11.5' fill="#5f5c56">Recipe</text><text x='668' y='394' text-anchor='middle' font-size='11.5' fill="#5f5c56">检查点</text></g><text x='580' y='132' text-anchor='middle' font-size='10.5' fill="#5f5c56">读</text><text x='580' y='496' text-anchor='middle' font-size='10.5' fill="#5f5c56">写</text><text x='580' y='336' text-anchor='middle' font-size='10.5' fill="#5f5c56">读写</text></svg>
