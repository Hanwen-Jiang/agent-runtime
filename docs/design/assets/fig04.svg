<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" viewBox='0 0 760 580' role='img' aria-label='Task Service：入口同步返回 task_id，执行交给 Session 工作流异步完成' font-size='13' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id='ts-mod-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill="#a9a59b"/></marker></defs><rect x="0" y="0" width="760" height="580" fill="#ffffff"/><text x='24' y='30' font-size='15' font-weight='600' fill="#1f1e1c">Task Service：入口同步返回 task_id，执行交给 Session 工作流异步完成</text><text x='24' y='60' font-size='12' font-weight='600' fill="#5f5c56">同步路径（Task API）</text><g><rect x='24' y='72' width='268' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='158' y='96' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">提交</text><text x='158' y='112' font-size='11.5' text-anchor='middle' fill="#5f5c56">HTTP POST 经 Ingress 认证与租户识别</text></g><g><rect x='24' y='148' width='268' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='158' y='172' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">准入</text><text x='158' y='188' font-size='11.5' text-anchor='middle' fill="#5f5c56">校验租户配额与权限</text><text x='158' y='204' font-size='11.5' text-anchor='middle' fill="#5f5c56">按优先级排队：交互式先于批量</text></g><g><rect x='24' y='240' width='268' height='40' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='158' y='264.2' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">生成 task_id</text></g><g><rect x='24' y='300' width='268' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='158' y='324' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">投递</text><text x='158' y='340' font-size='11.5' text-anchor='middle' fill="#5f5c56">按 session_id 找到 Session 工作流</text><text x='158' y='356' font-size='11.5' text-anchor='middle' fill="#5f5c56">不存在就创建，Task 作为信号投递</text></g><g><rect x='24' y='392' width='268' height='56' rx='8' fill="#2f6fd6" fill-opacity='0.12' stroke="#2f6fd6" stroke-width='2'/><text x='158' y='416' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">返回</text><text x='158' y='432' font-size='11.5' text-anchor='middle' fill="#5f5c56">立即返回 task_id 与 SSE 订阅地址</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M158 128L158 148' marker-end='url(#ts-mod-arrow)'/><path d='M158 220L158 240' marker-end='url(#ts-mod-arrow)'/><path d='M158 280L158 300' marker-end='url(#ts-mod-arrow)'/><path d='M158 372L158 392' marker-end='url(#ts-mod-arrow)'/></g><g><rect x='324' y='72' width='412' height='376' rx='12' fill='none' stroke="#a9a59b" stroke-width='1.5'/><text x='340' y='96' font-weight='600' fill="#1f1e1c">Session 工作流（Go，session 队列）</text><text x='340' y='114' font-size='11.5' fill="#5f5c56">工作流 ID = session_id · 历史过长时 Continue-As-New</text></g><g><rect x='430' y='132' width='200' height='40' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='530' y='156.3' font-weight='600' text-anchor='middle' fill="#1f1e1c">收到 Task 信号</text></g><g><polygon points='425,224 530,192 635,224 530,256' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='530' y='228' font-size='12' text-anchor='middle' fill="#1f1e1c">会写 Session 状态？</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M530 172L530 192' marker-end='url(#ts-mod-arrow)'/></g><g><rect x='340' y='280' width='170' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='425' y='304' font-weight='600' text-anchor='middle' fill="#1f1e1c">串行</text><text x='425' y='319.5' font-size='11' text-anchor='middle' fill="#5f5c56">在 Session 工作流内排队</text></g><g><rect x='550' y='280' width='170' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='635' y='304' font-weight='600' text-anchor='middle' fill="#1f1e1c">并行</text><text x='635' y='319.5' font-size='11' text-anchor='middle' fill="#5f5c56">直接启动，不排队</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M425 224L380 224L380 280' marker-end='url(#ts-mod-arrow)'/><path d='M635 224L680 224L680 280' marker-end='url(#ts-mod-arrow)'/></g><text x='402' y='216' font-size='11' text-anchor='middle' fill="#5f5c56">是</text><text x='690' y='216' font-size='11' text-anchor='middle' fill="#5f5c56">否：只读 Task</text><g><rect x='380' y='368' width='300' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='530' y='392' font-weight='600' text-anchor='middle' fill="#1f1e1c">Task 子工作流 × n</text><text x='530' y='408' font-size='11.5' text-anchor='middle' fill="#5f5c56">task 队列，由 Worker 执行 Task Loop</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M425 336L425 368' marker-end='url(#ts-mod-arrow)'/><path d='M635 336L635 368' marker-end='url(#ts-mod-arrow)'/><path d='M292 336L308 336L308 152L430 152' marker-end='url(#ts-mod-arrow)'/></g><g><rect x='24' y='488' width='268' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='158' y='512' font-weight='600' text-anchor='middle' fill="#1f1e1c">推流</text><text x='158' y='528' font-size='11.5' text-anchor='middle' fill="#5f5c56">进度与结果经 Valkey 推送</text><text x='158' y='544' font-size='11.5' text-anchor='middle' fill="#5f5c56">Ingress 以 SSE 转发</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M158 448L158 488' marker-end='url(#ts-mod-arrow)'/></g><g><rect x='340' y='488' width='186' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='433' y='512' font-weight='600' text-anchor='middle' fill="#1f1e1c">控制指令</text><text x='433' y='528' font-size='11.5' text-anchor='middle' fill="#5f5c56">取消 → 工作流 cancel</text><text x='433' y='544' font-size='11.5' text-anchor='middle' fill="#5f5c56">人工回复 → 信号</text></g><g><rect x='550' y='488' width='186' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='643' y='512' font-weight='600' text-anchor='middle' fill="#1f1e1c">查询</text><text x='643' y='528' font-size='11.5' text-anchor='middle' fill="#5f5c56">query handler</text><text x='643' y='544' font-size='11.5' text-anchor='middle' fill="#5f5c56">读取工作流内的 Task State</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M433 488L433 424' marker-end='url(#ts-mod-arrow)'/><path d='M643 488L643 424' marker-end='url(#ts-mod-arrow)'/></g></svg>
