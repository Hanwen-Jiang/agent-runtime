<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="596" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" viewBox='0 0 760 596' role='img' aria-label='Context Builder：越稳定的内容越靠前以保住提示缓存，接近上限时逐级压缩' font-size='13' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id='ctx-mod-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill="#a9a59b"/></marker></defs><rect x="0" y="0" width="760" height="596" fill="#ffffff"/><text x='24' y='30' font-size='15' font-weight='600' fill="#1f1e1c">Context Builder：越稳定的内容越靠前以保住提示缓存，接近上限时逐级压缩</text><text x='24' y='60' font-size='12' font-weight='600' fill="#5f5c56">来源</text><text x='208' y='60' font-size='12' font-weight='600' fill="#5f5c56">上下文分区（从前到后）</text><g><rect x='208' y='72' width='236' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='326' y='96' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">system</text><text x='326' y='111.5' font-size='11' text-anchor='middle' fill="#5f5c56">平台提示、工具定义、租户策略</text><text x='326' y='127.5' font-size='11' text-anchor='middle' fill="#5f5c56">跨 Session 稳定 · 缓存断点 1</text></g><g><rect x='24' y='90' width='160' height='36' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='104' y='111.8' font-size='11.5' text-anchor='middle' fill="#5f5c56">平台与 Registry</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M184 108L208 108' marker-end='url(#ctx-mod-arrow)'/></g><g><rect x='208' y='160' width='236' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='326' y='184' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">profile</text><text x='326' y='199.5' font-size='11' text-anchor='middle' fill="#5f5c56">用户偏好、Workspace 约定</text><text x='326' y='215.5' font-size='11' text-anchor='middle' fill="#5f5c56">Session 内稳定 · 缓存断点 2</text></g><g><rect x='24' y='178' width='160' height='36' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='104' y='199.8' font-size='11.5' text-anchor='middle' fill="#5f5c56">Memory Service</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M184 196L208 196' marker-end='url(#ctx-mod-arrow)'/></g><g><rect x='208' y='248' width='236' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='326' y='272' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">brief</text><text x='326' y='287.5' font-size='11' text-anchor='middle' fill="#5f5c56">Task Plan 与检索到的经验</text><text x='326' y='303.5' font-size='11' text-anchor='middle' fill="#5f5c56">Task 内稳定 · 缓存断点 3</text></g><g><rect x='24' y='266' width='160' height='36' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='104' y='287.8' font-size='11.5' text-anchor='middle' fill="#5f5c56">Planner</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M184 284L208 284' marker-end='url(#ctx-mod-arrow)'/></g><g><rect x='208' y='336' width='236' height='72' rx='8' fill="#2f6fd6" fill-opacity='0.12' stroke="#2f6fd6" stroke-width='2'/><text x='326' y='360' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">history</text><text x='326' y='375.5' font-size='11' text-anchor='middle' fill="#5f5c56">对话与工具调用轨迹，只追加</text><text x='326' y='391.5' font-size='11' text-anchor='middle' fill="#5f5c56">压缩的主要对象</text></g><g><rect x='24' y='354' width='160' height='36' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='104' y='375.8' font-size='11.5' text-anchor='middle' fill="#5f5c56">Node 执行轨迹</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M184 372L208 372' marker-end='url(#ctx-mod-arrow)'/></g><g><rect x='208' y='424' width='236' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='326' y='448' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">status</text><text x='326' y='463.5' font-size='11' text-anchor='middle' fill="#5f5c56">进度、待办、下一步</text><text x='326' y='479.5' font-size='11' text-anchor='middle' fill="#5f5c56">每步更新 · 约 500 token 以内</text></g><g><rect x='24' y='442' width='160' height='36' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='104' y='463.8' font-size='11.5' text-anchor='middle' fill="#5f5c56">Task State</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M184 460L208 460' marker-end='url(#ctx-mod-arrow)'/></g><text x='504' y='60' font-size='12' font-weight='600' fill="#5f5c56">Compaction Ladder（逐级升级）</text><g><rect x='504' y='72' width='232' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='620' y='96' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">offload</text><text x='620' y='111.5' font-size='11' text-anchor='middle' fill="#5f5c56">大工具输出写入 ObjectStore</text><text x='620' y='127.5' font-size='11' text-anchor='middle' fill="#5f5c56">只回摘要与路径</text></g><g><rect x='504' y='160' width='232' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='620' y='184' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">mask</text><text x='620' y='199.5' font-size='11' text-anchor='middle' fill="#5f5c56">旧工具结果换成占位符与引用</text><text x='620' y='215.5' font-size='11' text-anchor='middle' fill="#5f5c56">参考起点：有效长度的 40%</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M620 144L620 160' marker-end='url(#ctx-mod-arrow)'/></g><g><rect x='504' y='248' width='232' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='620' y='272' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">prune</text><text x='620' y='287.5' font-size='11' text-anchor='middle' fill="#5f5c56">清理旧轮次的思考内容</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M620 232L620 248' marker-end='url(#ctx-mod-arrow)'/></g><g><rect x='504' y='320' width='232' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='620' y='344' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">summarize</text><text x='620' y='359.5' font-size='11' text-anchor='middle' fill="#5f5c56">最早的历史做分区化摘要</text><text x='620' y='375.5' font-size='11' text-anchor='middle' fill="#5f5c56">增量合并 · 参考起点 70%</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M620 304L620 320' marker-end='url(#ctx-mod-arrow)'/></g><g><rect x='504' y='408' width='232' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='620' y='432' font-size='12.5' font-weight='600' text-anchor='middle' fill="#1f1e1c">reset</text><text x='620' y='447.5' font-size='11' text-anchor='middle' fill="#5f5c56">状态写入 Task State</text><text x='620' y='463.5' font-size='11' text-anchor='middle' fill="#5f5c56">用持久摘要开新上下文</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M620 392L620 408' marker-end='url(#ctx-mod-arrow)'/><path d='M444 372L468 372L468 108L504 108' marker-end='url(#ctx-mod-arrow)'/></g><text x='474' y='332' font-size='11' fill="#5f5c56">超过</text><text x='474' y='348' font-size='11' fill="#5f5c56">阈值</text><g><rect x='504' y='504' width='232' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='620' y='528' font-weight='600' text-anchor='middle' fill="#1f1e1c">Compaction Probe</text><text x='620' y='543.5' font-size='11' text-anchor='middle' fill="#5f5c56">summarize 或 reset 后抽查</text><text x='620' y='559.5' font-size='11' text-anchor='middle' fill="#5f5c56">3 到 5 个关键事实，答错就补回原文</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M620 480L620 504' stroke-dasharray='4 3' marker-end='url(#ctx-mod-arrow)'/></g><text x='24' y='520' font-size='11.5' fill="#5f5c56">文件、完整工具输出、产物、trace 只以路径或 ID 出现，按需取回。</text><text x='24' y='544' font-size='11.5' fill="#5f5c56">阈值按模型实测的有效长度设，不按标称窗口；能遮蔽就不摘要；</text><text x='24' y='562' font-size='11.5' fill="#5f5c56">压缩前由 before_compact Hook 把精确状态写进 Task State。</text></svg>
