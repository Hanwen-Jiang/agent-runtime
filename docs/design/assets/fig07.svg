<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" viewBox='0 0 760 580' role='img' aria-label='Task Loop：一个 Round 只规划到下一个检查点，Verdict 决定下一步去哪' font-size='13' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id='loop-mod-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill="#a9a59b"/></marker></defs><rect x="0" y="0" width="760" height="580" fill="#ffffff"/><text x='24' y='30' font-size='15' font-weight='600' fill="#1f1e1c">Task Loop：一个 Round 只规划到下一个检查点，Verdict 决定下一步去哪</text><g><rect x='220' y='48' width='280' height='56' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='360' y='72' font-weight='600' text-anchor='middle' fill="#1f1e1c">Task 进入</text><text x='360' y='87.5' font-size='11' text-anchor='middle' fill="#5f5c56">Session 工作流启动的 Task 子工作流</text></g><g><rect x='220' y='128' width='280' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='360' y='152' font-weight='600' text-anchor='middle' fill="#1f1e1c">Planner</text><text x='360' y='167.5' font-size='11' text-anchor='middle' fill="#5f5c56">Triage，首轮生成 Task Plan</text><text x='360' y='183.5' font-size='11' text-anchor='middle' fill="#5f5c56">每轮规划一个 Stage · decision activity</text></g><g><rect x='220' y='240' width='280' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='360' y='264' font-weight='600' text-anchor='middle' fill="#1f1e1c">Stage Runner</text><text x='360' y='279.5' font-size='11' text-anchor='middle' fill="#5f5c56">前置 Hook → Node DAG 并行 → 后置 Hook</text><text x='360' y='295.5' font-size='11' text-anchor='middle' fill="#5f5c56">在 Task 工作流内调度，Node 是 activity</text></g><g><rect x='220' y='352' width='280' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='360' y='376' font-weight='600' text-anchor='middle' fill="#1f1e1c">Reviewer</text><text x='360' y='391.5' font-size='11' text-anchor='middle' fill="#5f5c56">汇总 → 诊断 → Verdict</text><text x='360' y='407.5' font-size='11' text-anchor='middle' fill="#5f5c56">decision activity</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M360 104L360 128' marker-end='url(#loop-mod-arrow)'/><path d='M360 200L360 240' marker-end='url(#loop-mod-arrow)'/><path d='M360 312L360 352' marker-end='url(#loop-mod-arrow)'/><path d='M220 372L152 372L152 276L220 276' marker-end='url(#loop-mod-arrow)'/><path d='M220 404L96 404L96 164L220 164' marker-end='url(#loop-mod-arrow)'/></g><text x='158' y='254' font-size='11' fill="#5f5c56">repair</text><text x='158' y='268' font-size='11' fill="#5f5c56">rollback</text><text x='104' y='142' font-size='11' fill="#5f5c56">continue · replan</text><text x='104' y='156' font-size='11' fill="#5f5c56">reroute</text><text x='40' y='280' font-size='11' fill="#5f5c56">下一个</text><text x='40' y='296' font-size='11' fill="#5f5c56">Round</text><g><rect x='548' y='128' width='188' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='642' y='152' font-weight='600' text-anchor='middle' fill="#1f1e1c">fast 路径</text><text x='642' y='167.5' font-size='11' text-anchor='middle' fill="#5f5c56">规则路由到单个 model 节点</text><text x='642' y='183.5' font-size='11' text-anchor='middle' fill="#5f5c56">不调用规划模型</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M500 164L548 164' stroke-dasharray='4 3' marker-end='url(#loop-mod-arrow)'/><path d='M642 200L642 380L500 380' stroke-dasharray='4 3' marker-end='url(#loop-mod-arrow)'/></g><text x='650' y='240' font-size='11' fill="#5f5c56">Reviewer 只做</text><text x='650' y='256' font-size='11' fill="#5f5c56">格式检查</text><g><rect x='548' y='472' width='188' height='72' rx='8' fill='none' stroke="#a9a59b" stroke-width='1.25'/><text x='642' y='496' font-weight='600' text-anchor='middle' fill="#1f1e1c">escalate</text><text x='642' y='511.5' font-size='11' text-anchor='middle' fill="#5f5c56">换更强的 Tier</text><text x='642' y='527.5' font-size='11' text-anchor='middle' fill="#5f5c56">或经 HumanChannel 问人</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M500 408L642 408L642 472' marker-end='url(#loop-mod-arrow)'/></g><g><rect x='220' y='472' width='280' height='88' rx='8' fill="#2f6fd6" fill-opacity='0.12' stroke="#2f6fd6" stroke-width='2'/><text x='360' y='496' font-weight='600' text-anchor='middle' fill="#1f1e1c">收尾</text><text x='360' y='511.5' font-size='11' text-anchor='middle' fill="#5f5c56">done：交付 deliver 节点的输出</text><text x='360' y='527.5' font-size='11' text-anchor='middle' fill="#5f5c56">abort：交付部分结果并说明原因</text><text x='360' y='543.5' font-size='11' text-anchor='middle' fill="#5f5c56">归档 Task State；经验与 trace 异步写回</text></g><g fill='none' stroke="#a9a59b" stroke-width='1.25'><path d='M360 424L360 472' marker-end='url(#loop-mod-arrow)'/></g><text x='368' y='452' font-size='11' fill="#5f5c56">done · abort</text></svg>
