# Firecracker 客户机内核的固定版本（D-20，docs/plan/firecracker-backend.md）。build-kernel.sh 读这里，不用 latest。
# 版本要发布满两周（同 D-14 与 Python 的 exclude-newer）：PINNED_ON 减 KERNEL_RELEASED 至少 14 天（tests/deploy/test_firecracker.py 核对）。
#
# 2026-11-04 核对：6.18 是 Firecracker v1.17.0 给出 guest 配置的最新一条 LTS；6.18.57 发布于 2026-10-15
# （cdn.kernel.org 的目录时间）。KERNEL_SHA256 取自 kernel.org 的 sha256sums.asc，签名用 kernel.org 的
# checksum autosigner（主钥指纹 B8868C80BA62A1FFFAF5FDA9632D3A06589DA6B1）核对通过。
KERNEL_VERSION=6.18.57
KERNEL_RELEASED=2026-10-15
KERNEL_SHA256=5bd9acdc82ec5efc3790ae840e5aaa40dfde7efff261cf6dde902dc570acf98c
# 基础配置：Firecracker 自己 CI 用的客户机配置，取固定的发布标签（v1.17.0 发布于 2026-09-10，与 versions.conf 的
# FIRECRACKER_VERSION 一致），按 sha256 核对；agentruntime.config 叠在上面。
FC_CONFIG_REF=v1.17.0
FC_CONFIG_NAME=microvm-kernel-ci-x86_64-6.18.config
FC_CONFIG_SHA256=ba22401a0c7292a4c024ebcd10a562d4a1f1bfd2faed671406d3b159c0cf5215
PINNED_ON=2026-11-04
