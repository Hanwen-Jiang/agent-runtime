services:
  searxng:
    image: docker.io/searxng/searxng@sha256:a7fc607aa6723f5a8982105bcc5ffba4d1b9fc7c6922a31a88d6e4cba49ef12a
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:?set SEARXNG_SECRET}
    volumes:
      - searxng-cache:/var/cache/searxng
    security_opt:
      - no-new-privileges:true

  headless:
    build:
      context: ../../..
      dockerfile: services/py-headless-renderer/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8098:8098"
    shm_size: "256mb"
    environment:
      - AR_HEADLESS_ADDR=0.0.0.0:8098
      - AR_HEADLESS_TOKEN=${AR_HEADLESS_TOKEN:?set AR_HEADLESS_TOKEN}
      - AR_HEADLESS_CONCURRENCY=2
      - AR_HEADLESS_TIMEOUT_MS=15000
    security_opt:
      - no-new-privileges:true

volumes:
  searxng-cache:
