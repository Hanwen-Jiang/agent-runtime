# 自托管 E2B 要的 Secret（e2b 分支，docs/plan/e2b-backend.md）。只有占位符 REPLACE_ME；与 deploy/cluster/secrets 一样
# 写成 secrets.yaml 后用 SOPS 加密（明文不进仓库）。
#   ADMIN_TOKEN、SANDBOX_ACCESS_TOKEN_HASH_SEED：openssl rand -hex 32
#   TEAM_API_KEY：e2b_ 加至少 32 位十六进制，例如 "e2b_$(openssl rand -hex 20)"
# TEAM_API_KEY 同时放进 Runtime 的 SecretStore 种子（deploy/cluster/secrets 里 agent-runtime-secrets 的 secrets.json），
# 平台作用域、名为 sandbox/e2b-api-key；两边不一致时 Worker 建沙箱会得到 denied（sandbox_denied）。
# 哈希种子能从沙箱 id 算出 envd 与 traffic 令牌，和 ADMIN_TOKEN 一样要当作最高级别的密钥。
apiVersion: v1
kind: Secret
metadata:
  name: e2b-api
  namespace: e2b
type: Opaque
stringData:
  ADMIN_TOKEN: REPLACE_ME
  SANDBOX_ACCESS_TOKEN_HASH_SEED: REPLACE_ME
  TEAM_API_KEY: REPLACE_ME
