# Langfuse（langfuse/langfuse Chart 2.x；docs/plan/cloud-deploy.md D-03）：看 token 与花费。装在 observability 命名空间。
# 2.x 起 ClickHouse 由 ClickHouse 官方的 operator 部署（ClickHouseCluster、KeeperCluster），operator 先由 deploy/data/install.sh 装好；
# Redis 换成了 Valkey。Postgres 用 deploy/data/postgres.yaml 的 langfuse 库；事件与媒体放 R2（不装 Chart 自带的 SeaweedFS）。
# 密钥一律取已有的 Secret（deploy/cluster/secrets）：langfuse（salt、nextauth、encryption key、ClickHouse 与 Valkey 的口令）、
# pg-langfuse 的副本、r2-langfuse。键名 2026-10 对照 langfuse-2.1.4 的 values.yaml。
langfuse:
  salt:
    secretKeyRef: {name: langfuse, key: salt}
  encryptionKey:
    secretKeyRef: {name: langfuse, key: encryption-key}
  nextauth:
    # 界面不对外，经端口转发看（deploy/cluster/demo.md：kubectl port-forward svc/langfuse-web 3001:3000）。
    url: http://localhost:3001
    secret:
      secretKeyRef: {name: langfuse, key: nextauth-secret}
  features:
    telemetryEnabled: false
    signUpDisabled: true
  # 不开注册，也就没有人能在界面上建项目与 API Key：第一次启动时按下面建好组织、项目、Collector 用的 Key 与一个管理员
  # （Langfuse 的 headless 初始化，已存在时不动）。Collector 的 agent-runtime-langfuse 是 base64(init-public-key:init-secret-key)。
  additionalEnv:
    - {name: LANGFUSE_INIT_ORG_ID, value: agent-runtime}
    - {name: LANGFUSE_INIT_ORG_NAME, value: Agent Runtime}
    - {name: LANGFUSE_INIT_PROJECT_ID, value: agent-runtime}
    - {name: LANGFUSE_INIT_PROJECT_NAME, value: Agent Runtime}
    - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
      valueFrom: {secretKeyRef: {name: langfuse, key: init-public-key}}
    - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
      valueFrom: {secretKeyRef: {name: langfuse, key: init-secret-key}}
    - name: LANGFUSE_INIT_USER_EMAIL
      valueFrom: {secretKeyRef: {name: langfuse, key: init-user-email}}
    - {name: LANGFUSE_INIT_USER_NAME, value: admin}
    - name: LANGFUSE_INIT_USER_PASSWORD
      valueFrom: {secretKeyRef: {name: langfuse, key: init-user-password}}
  web:
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
  worker:
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
postgresql:
  deploy: false
  host: pg-rw.data.svc
  port: 5432
  auth:
    username: langfuse
    database: langfuse
    existingSecret: pg-langfuse
    secretKeys:
      userPasswordKey: password
clickhouse:
  deploy: true
  auth:
    existingSecret: langfuse
    existingSecretKey: clickhouse-password
  cluster:
    replicas: 1
    storage:
      size: 20Gi
      className: local-path
    resources:
      requests: {cpu: 500m, memory: 2Gi}
      limits: {cpu: "2", memory: 3Gi}
  # 单节点：一个 Keeper 就够（Chart 默认 3 个，给多节点高可用用）。
  keeper:
    replicas: 1
    storage:
      size: 5Gi
      className: local-path
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}
redis:
  deploy: true
  auth:
    existingSecret: langfuse
    existingSecretPasswordKey: redis-password
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 250m, memory: 256Mi}
s3:
  deploy: false
  bucket: agentruntime-langfuse
  endpoint: https://ACCOUNT_ID.r2.cloudflarestorage.com
  region: auto
  forcePathStyle: true
  accessKeyId:
    secretKeyRef: {name: r2-langfuse, key: ACCESS_KEY_ID}
  secretAccessKey:
    secretKeyRef: {name: r2-langfuse, key: ACCESS_SECRET_KEY}
