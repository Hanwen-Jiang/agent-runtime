# Langfuse（langfuse/langfuse Chart v1；docs/plan/cloud-deploy.md D-03）：看 token 与花费。装在 observability 命名空间。
# Postgres 用 deploy/data/postgres.yaml 的 langfuse 库；ClickHouse 与 Redis 用 Chart 自带的单实例；事件与媒体放 R2。
# 密钥一律取已有的 Secret（deploy/cluster/secrets）：langfuse（salt、nextauth、encryption key）、pg-langfuse 的副本、r2-langfuse。
langfuse:
  salt:
    secretKeyRef: {name: langfuse, key: salt}
  nextauth:
    url: https://langfuse.example.com
    secret:
      secretKeyRef: {name: langfuse, key: nextauth-secret}
  encryptionKey:
    secretKeyRef: {name: langfuse, key: encryption-key}
  features:
    telemetryEnabled: false
    signUpDisabled: true
  web:
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
  worker:
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
postgresql:
  deploy: false
  host: pg-rw.data.svc
  port: 5432
  auth:
    username: langfuse
    database: langfuse
    existingSecret: pg-langfuse
    secretKeys:
      userPasswordKey: password
clickhouse:
  deploy: true
  replicaCount: 1
  shards: 1
  auth:
    existingSecret: langfuse
    existingSecretKey: clickhouse-password
  resources:
    requests: {cpu: 500m, memory: 2Gi}
    limits: {cpu: "2", memory: 3Gi}
  persistence:
    size: 20Gi
    storageClass: local-path
  zookeeper:
    enabled: false
redis:
  deploy: true
  auth:
    existingSecret: langfuse
    existingSecretPasswordKey: redis-password
  primary:
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 250m, memory: 256Mi}
s3:
  deploy: false
  bucket: agentruntime-langfuse
  endpoint: https://ACCOUNT_ID.r2.cloudflarestorage.com
  region: auto
  forcePathStyle: true
  accessKeyId:
    secretKeyRef: {name: r2-langfuse, key: ACCESS_KEY_ID}
  secretAccessKey:
    secretKeyRef: {name: r2-langfuse, key: ACCESS_SECRET_KEY}
