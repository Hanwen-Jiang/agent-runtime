# Grafana（grafana/grafana Chart；docs/plan/cloud-deploy.md D-03、D-10）：看 Tempo 的调用链与面板。装在 observability 命名空间，
# 管理员口令取 Secret grafana-admin；面板（D-10）以 ConfigMap 的形式放在 deploy/data/dashboards。
# 指标（TMP 计划第 9.3 节）：VictoriaMetrics 当 Prometheus 数据源读，趋势面板与告警查它；Tempo 仍是默认数据源。
# 告警只在 Grafana 里显示（没有配 contact point）；要发邮件或 webhook 时在 alerting 里加 contactpoints.yaml。
admin:
  existingSecret: grafana-admin
  userKey: user
  passwordKey: password
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 500m, memory: 256Mi}
persistence:
  enabled: false
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo.observability.svc:3200
        access: proxy
        isDefault: true
      - name: VictoriaMetrics
        type: prometheus
        uid: victoriametrics
        url: http://vm-victoria-metrics-single-server.observability.svc:8428
        access: proxy
        isDefault: false
# 告警规则（TMP 计划第 9.3 节）。指标名是 Telemetry 的名字点换下划线：计数器加 _total，直方图有 _sum、_count、_bucket。
# 阈值是起步值，按实际用量调。
alerting:
  rules.yaml:
    apiVersion: 1
    groups:
      - orgId: 1
        name: Agent Runtime
        folder: Agent Runtime
        interval: 1m
        rules:
          - uid: ar-model-provider-errors
            title: 模型供应商不可用率
            condition: C
            for: 10m
            noDataState: OK
            execErrState: Error
            annotations:
              summary: 某个模型供应商最近 15 分钟超过两成的调用失败（按最后尝试的候选的供应商算；Model Gateway 已经重试并切换过）
            labels:
              severity: warning
            data:
              - refId: A
                relativeTimeRange: {from: 900, to: 0}
                datasourceUid: victoriametrics
                model:
                  refId: A
                  instant: true
                  expr: >-
                    sum by (gen_ai_provider_name) (increase(runtime_model_calls_total{outcome="error"}[15m]))
                    / sum by (gen_ai_provider_name) (increase(runtime_model_calls_total[15m]))
                    and sum by (gen_ai_provider_name) (increase(runtime_model_calls_total[15m])) >= 10
              - refId: B
                datasourceUid: __expr__
                model: {refId: B, type: reduce, expression: A, reducer: last}
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions: [{evaluator: {type: gt, params: [0.2]}}]
          - uid: ar-tenant-hourly-spend
            title: 租户每小时花费
            condition: C
            for: 0s
            noDataState: OK
            execErrState: Error
            annotations:
              summary: 某个租户最近一小时的模型花费超过 5 美元（Model Gateway 计的费，含 Planner、Reviewer 与各 Node）
            labels:
              severity: warning
            data:
              - refId: A
                relativeTimeRange: {from: 3600, to: 0}
                datasourceUid: victoriametrics
                model:
                  refId: A
                  instant: true
                  expr: sum by (tenant_id) (increase(runtime_model_cost_usd_sum[1h]))
              - refId: B
                datasourceUid: __expr__
                model: {refId: B, type: reduce, expression: A, reducer: last}
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions: [{evaluator: {type: gt, params: [5]}}]
          - uid: ar-platform-daily-spend
            title: 全平台 24 小时花费
            condition: C
            for: 0s
            noDataState: OK
            execErrState: Error
            annotations:
              summary: 全平台最近 24 小时的模型花费超过 50 美元（Model Gateway 计的费，所有租户合计；open-signup.md 第 2 节第 6 条）
            labels:
              severity: critical
            data:
              - refId: A
                relativeTimeRange: {from: 86400, to: 0}
                datasourceUid: victoriametrics
                model:
                  refId: A
                  instant: true
                  expr: sum(increase(runtime_model_cost_usd_sum[24h]))
              - refId: B
                datasourceUid: __expr__
                model: {refId: B, type: reduce, expression: A, reducer: last}
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions: [{evaluator: {type: gt, params: [50]}}]
          # DISK-A（WS-DISK-01 ③）：挂卷的工作区在节点本地盘上，盘满会连带同节点上的 Postgres、Temporal。
          - uid: ar-workspace-volume-usage
            title: 工作区卷用量
            condition: C
            for: 15m
            noDataState: OK
            execErrState: Error
            annotations:
              summary: 挂卷的工作区所在卷已用超过 80%（Worker 的沙箱对账报的 runtime.workspace.volume_used_ratio；清理闲置的工作区或扩盘）
            labels:
              severity: critical
            data:
              - refId: A
                relativeTimeRange: {from: 900, to: 0}
                datasourceUid: victoriametrics
                model:
                  refId: A
                  instant: true
                  expr: max(increase(runtime_workspace_volume_used_ratio_sum[15m]) / increase(runtime_workspace_volume_used_ratio_count[15m]))
              - refId: B
                datasourceUid: __expr__
                model: {refId: B, type: reduce, expression: A, reducer: last}
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions: [{evaluator: {type: gt, params: [0.8]}}]
      # G-05（coding-agent 仓库 docs/plan/github-app.md 第 4 节）：coding-web 的 GitHub App 收件箱，经同一个 Collector 发 coding.github.*。
      - orgId: 1
        name: Coding Web
        folder: Agent Runtime
        interval: 1m
        rules:
          - uid: coding-github-dead-letters
            title: GitHub 投递进了死信
            condition: C
            for: 0s
            noDataState: OK
            execErrState: Error
            annotations:
              summary: coding-web 最近一小时有 GitHub 投递重试用尽进了死信（修好原因后用 coding-web github-replay <delivery> 重新入队）
            labels:
              severity: warning
            data:
              - refId: A
                relativeTimeRange: {from: 3600, to: 0}
                datasourceUid: victoriametrics
                model:
                  refId: A
                  instant: true
                  expr: sum(increase(coding_github_processed_total{result="dead"}[1h]))
              - refId: B
                datasourceUid: __expr__
                model: {refId: B, type: reduce, expression: A, reducer: last}
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions: [{evaluator: {type: gt, params: [0]}}]
          - uid: coding-github-backlog
            title: GitHub 投递积压
            condition: C
            for: 15m
            noDataState: OK
            execErrState: Error
            annotations:
              summary: coding-web 的 GitHub 收件箱持续积压超过 50 条（还没处理完的投递；看处理失败的日志与库的连接）
            labels:
              severity: warning
            data:
              - refId: A
                relativeTimeRange: {from: 900, to: 0}
                datasourceUid: victoriametrics
                model:
                  refId: A
                  instant: true
                  expr: max(increase(coding_github_backlog_sum[15m]) / increase(coding_github_backlog_count[15m]))
              - refId: B
                datasourceUid: __expr__
                model: {refId: B, type: reduce, expression: A, reducer: last}
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions: [{evaluator: {type: gt, params: [50]}}]
          - uid: coding-github-signature-failures
            title: GitHub Webhook 签名失败突增
            condition: C
            for: 0s
            noDataState: OK
            execErrState: Error
            annotations:
              summary: coding-web 最近 15 分钟有超过 10 次 Webhook 签名校验失败（有人伪造投递，或 Webhook secret 轮换时两边没对上）
            labels:
              severity: warning
            data:
              - refId: A
                relativeTimeRange: {from: 900, to: 0}
                datasourceUid: victoriametrics
                model:
                  refId: A
                  instant: true
                  expr: sum(increase(coding_github_deliveries_total{result="signature_failed"}[15m]))
              - refId: B
                datasourceUid: __expr__
                model: {refId: B, type: reduce, expression: A, reducer: last}
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions: [{evaluator: {type: gt, params: [10]}}]
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    searchNamespace: observability
grafana.ini:
  analytics:
    reporting_enabled: false
    check_for_updates: false
  users:
    allow_sign_up: false
