# Tempo（grafana/tempo 单进程 Chart；docs/plan/cloud-deploy.md D-03）：调用链。装在 observability 命名空间，Collector 经 OTLP gRPC
# （4317）写入；数据放本地盘、保留 7 天。
tempo:
  retention: 168h
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 1536Mi}
  # Grafana 的面板（deploy/data/dashboards，D-10）用 TraceQL 的指标查询（rate、sum_over_time 等），要开 local-blocks 处理器。
  # 键名按 TEMPO_CHART_VERSION 的 values.yaml 核对。
  metricsGenerator:
    enabled: true
  overrides:
    defaults:
      metrics_generator:
        processors: [local-blocks]
# 存储类用集群默认的（k3s 是 local-path）；键名 2026-10 对照 tempo-3.1.0（grafana-community）。
persistence:
  enabled: true
  size: 20Gi
