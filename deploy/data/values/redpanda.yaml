# Redpanda（redpanda/redpanda Chart；docs/plan/cloud-deploy.md D-03）：trace 主题 telemetry.spans（Collector 写、Learning 的
# KEDA ScaledJob 按消费组延迟起 Job）。单个 broker、开发模式；只在集群内（Chart 的 external 关掉）。
statefulset:
  replicas: 1
resources:
  cpu:
    cores: 1
  memory:
    container:
      max: 2Gi
storage:
  persistentVolume:
    enabled: true
    size: 20Gi
    storageClass: local-path
external:
  enabled: false
tls:
  enabled: false
console:
  enabled: false
config:
  cluster:
    auto_create_topics_enabled: true
