# Runtime 自己的 Valkey（设计书 4.5 的 Cache；CACHE-01，docs/plan/workspace-read-latency-and-disk-2026-11-03.md）：
# task-service 的事件流、限流计数与锁放在这里，task-service 才能多副本、重启不丢流（TSP-2）。不与 Langfuse 自带的 Valkey 共用。
#
# 存的仍是可丢失或可重建的数据（设计书 4.5），但开 AOF（每秒刷盘，--appendonly yes --appendfsync everysec，不做 RDB 快照）：
# 2026-11-04 用户定。重启后限流计数、锁与推流不清零，SSE 续传不必全退回业务库；最多丢最后一秒。数据在 PVC valkey-agentruntime-data 上。
# 所有键都带过期时间，内存满了按 volatile-lru 淘汰。口令在 data 命名空间的 Secret valkey-agentruntime（deploy/cluster/secrets），
# 启动时写进内存卷上的配置文件，不出现在 valkey-server 的命令行里。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey-agentruntime
  namespace: data
  labels:
    app.kubernetes.io/name: valkey-agentruntime
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey-agentruntime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey-agentruntime
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          # 2026-11-03 核对：9.1.2 推送于 2026-09-21（满两周）；9.1.3 推送于 2026-10-27，满两周后再升。
          image: valkey/valkey:9.1.2
          command: ["sh", "-c"]
          args:
            - |
              umask 077
              printf 'requirepass "%s"\n' "$VALKEY_PASSWORD" > /run/valkey/auth.conf
              unset VALKEY_PASSWORD
              exec valkey-server /run/valkey/auth.conf --save '' --appendonly yes --appendfsync everysec \
                --maxmemory 384mb --maxmemory-policy volatile-lru --dir /data
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-agentruntime
                  key: password
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: valkey
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: valkey
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: run
              mountPath: /run/valkey
            - name: data
              mountPath: /data
      volumes:
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: data
          persistentVolumeClaim:
            claimName: valkey-agentruntime-data
---
# AOF 的数据盘：maxmemory 是 384 MB，AOF 重写前最多约两倍，2Gi 足够。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: valkey-agentruntime-data
  namespace: data
  labels:
    app.kubernetes.io/name: valkey-agentruntime
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-agentruntime
  namespace: data
  labels:
    app.kubernetes.io/name: valkey-agentruntime
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: valkey-agentruntime
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
