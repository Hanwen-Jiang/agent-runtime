# Milvus 单机版（docs/plan/memory-live.md M-01；总表第 0 节 V1-MEM）：Memory Service 的向量库。内嵌 etcd、本地存储（官方
# standalone_embed.sh 的做法，与测试用的 agentruntime_core.adapters.milvustest 同一种起法），不需要单独的 etcd 与 MinIO。
# 数据在 50Gi 的卷上（local-path，单节点）。网络边界沿用 networkpolicy.yaml：data 命名空间只给 Runtime 与观测组件进。
#   kubectl apply -f deploy/data/milvus.yaml
# Chart 的 external.milvus.uri: http://milvus.data.svc:19530（与 external.qdrant.url 只能设一个）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: milvus-embed-etcd
  namespace: data
data:
  embedEtcd.yaml: |
    listen-client-urls: http://0.0.0.0:2379
    advertise-client-urls: http://0.0.0.0:2379
    quota-backend-bytes: 4294967296
    auto-compaction-mode: revision
    auto-compaction-retention: '1000'
---
apiVersion: v1
kind: Service
metadata:
  name: milvus
  namespace: data
  labels: {app.kubernetes.io/name: milvus}
spec:
  selector: {app.kubernetes.io/name: milvus}
  ports:
    - {name: grpc, port: 19530, targetPort: 19530}
    - {name: metrics, port: 9091, targetPort: 9091}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: milvus
  namespace: data
  labels: {app.kubernetes.io/name: milvus}
spec:
  serviceName: milvus
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: milvus}
  template:
    metadata:
      labels: {app.kubernetes.io/name: milvus}
    spec:
      containers:
        - name: milvus
          image: milvusdb/milvus:v3.0.2
          command: ["milvus", "run", "standalone"]
          env:
            # 3.0 起不设 DEPLOY_MODE 就按分布式部署处理，内嵌 etcd 会直接 panic。
            - {name: DEPLOY_MODE, value: STANDALONE}
            - {name: ETCD_USE_EMBED, value: "true"}
            - {name: ETCD_DATA_DIR, value: /var/lib/milvus/etcd}
            - {name: ETCD_CONFIG_PATH, value: /milvus/configs/embed/embedEtcd.yaml}
            - {name: COMMON_STORAGETYPE, value: local}
          ports:
            - {name: grpc, containerPort: 19530}
            - {name: metrics, containerPort: 9091}
          readinessProbe:
            httpGet: {path: /healthz, port: 9091}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: 9091}
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: {cpu: 500m, memory: 2Gi}
            limits: {cpu: "4", memory: 8Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/milvus}
            - {name: embed-etcd, mountPath: /milvus/configs/embed}
      volumes:
        - name: embed-etcd
          configMap: {name: milvus-embed-etcd}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 50Gi}
