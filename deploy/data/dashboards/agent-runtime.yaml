# Grafana 面板（docs/plan/cloud-deploy.md D-10）：任务数、模型花费、各沙箱后端的时长与估算花费。数据全部来自 Tempo 里的 span
# （TraceQL 的指标查询），span 名与属性取自代码：invoke_workflow（收尾补记，runtime.cost_usd、runtime.task_status）、
# Model Gateway 的调用 span（服务名 model-gateway，runtime.cost_usd）、runtime.sandbox（sandbox.backend、sandbox.lifetime_ms、
# sandbox.cpu_ms、sandbox.cost_usd）。模型花费原先按 name = "chat" 选，只选到 Worker 的 model 节点，漏了 Planner、Reviewer 与
# Context Builder 的调用（TMP 计划第 9.2 节改成按网关的服务名选）。
# Workspace 操作的耗时与进出 Worker 的字节数（PERF-00、WK-LITE-03，agentruntime_worker.workspace.timing）：总时长查 Tempo 的
# runtime.workspace_op；各阶段与字节数查 VictoriaMetrics 的 runtime.workspace_op.duration_ms（直方图）与 runtime.worker.bytes
# （计数器），名字点换下划线，计数器加 _total，标签只有操作、阶段、模式、结局、活动、通道、方向与租户。
# Grafana 的 sidecar 按标签 grafana_dashboard 收（deploy/data/values/grafana.yaml）。tests/deploy/test_cloud.py 核对名字对得上。
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-runtime-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  agent-runtime.json: |
    {
      "uid": "agent-runtime",
      "title": "Agent Runtime",
      "timezone": "browser",
      "schemaVersion": 39,
      "time": {"from": "now-24h", "to": "now"},
      "templating": {"list": []},
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "结束的 Task（按结局）",
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
          "datasource": {"type": "tempo", "uid": "tempo"},
          "targets": [{"refId": "A", "queryType": "traceql", "metricsQueryType": "range",
                       "query": "{ name = \"invoke_workflow\" } | count_over_time() by (span.runtime.task_status)"}]
        },
        {
          "id": 2, "type": "timeseries", "title": "模型花费（美元，按租户）",
          "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
          "datasource": {"type": "tempo", "uid": "tempo"},
          "fieldConfig": {"defaults": {"unit": "currencyUSD"}},
          "targets": [{"refId": "A", "queryType": "traceql", "metricsQueryType": "range",
                       "query": "{ resource.service.name = \"model-gateway\" } | sum_over_time(span.runtime.cost_usd) by (span.tenant_id)"}]
        },
        {
          "id": 3, "type": "timeseries", "title": "沙箱存活时间（秒，按后端）",
          "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
          "datasource": {"type": "tempo", "uid": "tempo"},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "targets": [{"refId": "A", "queryType": "traceql", "metricsQueryType": "range",
                       "query": "{ name = \"runtime.sandbox\" } | sum_over_time(span.sandbox.lifetime_ms) by (span.sandbox.backend)"}],
          "transformations": [{"id": "calculateField", "options": {"mode": "unary", "replaceFields": true,
                                "unary": {"operator": "/", "fieldName": "*", "value": 1000}}}]
        },
        {
          "id": 4, "type": "timeseries", "title": "沙箱 CPU 时间（秒，按后端）",
          "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
          "datasource": {"type": "tempo", "uid": "tempo"},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "targets": [{"refId": "A", "queryType": "traceql", "metricsQueryType": "range",
                       "query": "{ name = \"runtime.sandbox\" } | sum_over_time(span.sandbox.cpu_ms) by (span.sandbox.backend)"}],
          "transformations": [{"id": "calculateField", "options": {"mode": "unary", "replaceFields": true,
                                "unary": {"operator": "/", "fieldName": "*", "value": 1000}}}]
        },
        {
          "id": 5, "type": "stat", "title": "Cloudflare 沙箱的估算花费（美元）",
          "description": "standard-2：内存 6 GiB × $0.0000025/GiB 秒按存活时间算，CPU 按 $0.000020/vCPU 秒算（计划第 4.3 节）；磁盘忽略。K8s 后端在自己的机器上，不另算。",
          "gridPos": {"x": 0, "y": 16, "w": 12, "h": 6},
          "datasource": {"type": "__expr__", "uid": "__expr__"},
          "fieldConfig": {"defaults": {"unit": "currencyUSD", "decimals": 4}},
          "targets": [
            {"refId": "A", "datasource": {"type": "tempo", "uid": "tempo"}, "queryType": "traceql", "metricsQueryType": "instant",
             "query": "{ name = \"runtime.sandbox\" && span.sandbox.kind = \"cloudflare\" } | sum_over_time(span.sandbox.lifetime_ms)"},
            {"refId": "B", "datasource": {"type": "tempo", "uid": "tempo"}, "queryType": "traceql", "metricsQueryType": "instant",
             "query": "{ name = \"runtime.sandbox\" && span.sandbox.kind = \"cloudflare\" } | sum_over_time(span.sandbox.cpu_ms)"},
            {"refId": "C", "datasource": {"type": "__expr__", "uid": "__expr__"}, "type": "math",
             "expression": "$A / 1000 * 6 * 0.0000025 + $B / 1000 * 0.000020"}
          ]
        },
        {
          "id": 6, "type": "table", "title": "最近的 Task：花费与轮数",
          "gridPos": {"x": 12, "y": 16, "w": 12, "h": 6},
          "datasource": {"type": "tempo", "uid": "tempo"},
          "targets": [{"refId": "A", "queryType": "traceql", "limit": 50, "tableType": "spans",
                       "query": "{ name = \"invoke_workflow\" } | select(span.task_id, span.tenant_id, span.runtime.task_status, span.runtime.cost_usd, span.runtime.rounds)"}]
        },
        {
          "id": 7, "type": "timeseries", "title": "沙箱花费（美元，按租户；环境表按后端价目算）",
          "description": "一次性的环境在 shell_run 的 span 上带 sandbox.cost_usd（D-11）；会话级的环境在回收时才结算，花费在沙箱环境表的 sandbox_usage 里。",
          "gridPos": {"x": 0, "y": 22, "w": 24, "h": 8},
          "datasource": {"type": "tempo", "uid": "tempo"},
          "fieldConfig": {"defaults": {"unit": "currencyUSD"}},
          "targets": [{"refId": "A", "queryType": "traceql", "metricsQueryType": "range",
                       "query": "{ name = \"runtime.sandbox\" } | sum_over_time(span.sandbox.cost_usd) by (span.tenant_id)"}]
        },
        {
          "id": 8, "type": "timeseries", "title": "Workspace 操作耗时（毫秒，p50 与 p95，按操作）",
          "description": "PERF-00：每次 Workspace 操作一个 runtime.workspace_op span，workspace.ms.total 是 Worker 里的总时长（不含排队）。",
          "gridPos": {"x": 0, "y": 30, "w": 12, "h": 8},
          "datasource": {"type": "tempo", "uid": "tempo"},
          "fieldConfig": {"defaults": {"unit": "ms"}},
          "targets": [{"refId": "A", "queryType": "traceql", "metricsQueryType": "range",
                       "query": "{ name = \"runtime.workspace_op\" } | quantile_over_time(span.workspace.ms.total, .5, .95) by (span.workspace.operation)"}]
        },
        {
          "id": 9, "type": "timeseries", "title": "Workspace 操作各阶段的耗时（毫秒，p95，按阶段）",
          "description": "独占时间：queue 排队、acquire 借环境（不含恢复）、restore 从快照恢复、command 命令本身、archive 存档、release 归还、other 其余（业务库、策略）。",
          "gridPos": {"x": 12, "y": 30, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "fieldConfig": {"defaults": {"unit": "ms"}},
          "targets": [{"refId": "A", "legendFormat": "{{workspace_phase}}",
                       "expr": "histogram_quantile(0.95, sum by (le, workspace_phase) (rate(runtime_workspace_op_duration_ms_bucket[15m])))"}]
        },
        {
          "id": 10, "type": "timeseries", "title": "进出 Worker 的字节数（每小时，按活动、通道与方向）",
          "description": "WK-LITE-03：sandbox 是与环境之间（命令输出、读写文件、存档的导出导入），object_store 是存档的块与清单；in 是进 Worker。数的是载荷，不含 HTTP 与编码的开销。",
          "gridPos": {"x": 0, "y": 38, "w": 24, "h": 8},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "fieldConfig": {"defaults": {"unit": "bytes"}},
          "targets": [{"refId": "A", "legendFormat": "{{worker_activity}} {{worker_channel}} {{worker_direction}}",
                       "expr": "sum by (worker_activity, worker_channel, worker_direction) (increase(runtime_worker_bytes_total[1h]))"}]
        }
      ]
    }
