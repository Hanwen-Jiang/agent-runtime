# data 命名空间的网络边界（docs/plan/cloud-deploy.md D-03）：数据库、Temporal、向量库、Redpanda 只给集群里的 Runtime、
# 观测组件与它们彼此用；沙箱命名空间本来就出不来（deploy/cluster/sandboxes.yaml），这里再从数据一侧挡一次。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-runtime-and-observability
  namespace: data
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [data, agent-runtime, observability, cnpg-system, keda]
