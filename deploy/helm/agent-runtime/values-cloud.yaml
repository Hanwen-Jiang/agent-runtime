# 云上单节点的 values（docs/plan/cloud-deploy.md 第 2 节的布局、D-04）：一台独服上的 k3s，第三方组件按 deploy/data 装在集群里。
# 在默认 values 之上覆盖：
#   helm upgrade --install ar deploy/helm/agent-runtime -n agent-runtime -f deploy/helm/agent-runtime/values-cloud.yaml \
#     --set image.registry=ghcr.io/<仓库所有者> --set image.tag=<版本> --set ingress.host=<域名>
# 要先有的东西（deploy/cluster/README.md 的步骤）：命名空间与沙箱的约束、工作区与业务对象的卷、第三方组件、下面引用的 Secret。
# 资源按 64 GB 内存的一台机器分（deploy/cluster/README.md 的预算表），给沙箱留出至少 16 GB。
global:
  environment: cloud

image:
  registry: ghcr.io/agentruntime
  tag: "0.1.0"

secrets:
  existingSecret: agent-runtime-secrets
  # 可写的 SecretStore 文件（kek）；只读的 secrets.json 作种子（deploy/cluster/storage.yaml）。
  storeClaim: agent-runtime-secretstore
  # 业务库 agentruntime（deploy/data/postgres.yaml）的连接串：角色 agentruntime 不是超级用户、没有 BYPASSRLS。
  # Secret 跨不了命名空间，这里的与 data 命名空间里给 CloudNativePG 的口令出自同一份 SOPS 文件（deploy/cluster/secrets）。
  relationalDsn:
    name: agent-runtime-postgres
    key: dsn
  # Runtime 自己的 Valkey（deploy/data/valkey.yaml，CACHE-01）的地址；口令与 data/valkey-agentruntime 相同。
  valkeyUrl:
    name: agent-runtime-valkey
    key: url

external:
  temporal:
    address: temporal-frontend.data.svc:7233
    namespace: agent-runtime
  # Memory Service 的向量库：Milvus 单机版（deploy/data/milvus.yaml，V1-MEM，2026-11-06）；与 qdrant.url 只能设一个。
  milvus:
    uri: http://milvus.data.svc:19530
  redpanda:
    brokers: redpanda.data.svc:9093
  tempo:
    endpoint: tempo.observability.svc:4317
  victoriametrics:
    remoteWrite: http://vm-victoria-metrics-single-server.observability.svc:8428/api/v1/write
  langfuse:
    endpoint: http://langfuse-web.observability.svc:3000
    authSecret:
      name: agent-runtime-langfuse
      key: basic-auth

# 单节点：所有 Pod 在一台机器上，local-path 的卷能共用（deploy/cluster/storage.yaml）。加节点之前换成 R2（objectStore.s3，D-09）。
objectStore:
  claimName: agent-runtime-objects

ingress:
  enabled: true
  type: traefik
  host: agent-runtime.example.com
  traefik:
    entryPoints: [websecure]
    # Cloudflare 的源站证书（deploy/cluster/README.md）；Cloudflare 的 SSL 模式用 Full (strict)。
    tlsSecretName: cloudflare-origin-tls

taskService:
  replicas: 1
  # 业务库是上面的 Postgres、Cache 是上面的 Valkey；没配时拒绝启动，不回落开发实现（TS-PROD-01）。
  profile: production
  # AUTH-01 迁移期间：coding-agent 还在发开发令牌，生产模式显式收它（task-service 启动时记一条警告）。coding-agent 改发 JWT 后
  # 在 issuers 里登记它的公钥（task-service keygen），再去掉这一行（默认就不收了）。
  ingress:
    devTokens: accept
    # AUTH-01 第 2 步（2026-11-06）：coding-web 的签发方（只有公钥；私钥在 Secret coding-jwt，只挂给 coding-web）。只能签 coding-web 自己的租户
    # （登录平台前缀 gh-、gl-、gitee-、gitea-、bb-、google-），签不了 evals、swebench 这类内部租户。
    issuers:
      - iss: coding-agent
        keys: {cgent-2026-11: 6hosCO1nvR_g-QSAS1YaYPyS5yPHXqL28BKXLb013Bs}
        tenants: ["gh-*", "gl-*", "gitee-*", "gitea-*", "bb-*", "google-*"]
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}

modelGateway:
  replicas: 1
  providerBaseUrl: https://api.example/v1
  defaultTenantPolicies:
    enabled: true

memory:
  replicas: 1
  # 真 embedding 经 Model Gateway（docs/plan/memory-live.md M-02）；所有租户的白名单都有它。
  embeddingVersion: a6api/text-embedding-3-large@2026-10

pkgMirror:
  enabled: true
  # 单节点：local-path 的卷，预算 100 GiB（包文件）+ 5 GiB（元数据），留出余量。
  storage: 120Gi

# 出网网关（D-16）：联网经申请与批准；预览地址是 https://<环境号>.preview.<域名>（Cloudflare 上配 *.preview 的通配记录与证书）。
egressGateway:
  enabled: true
  previewDomain: preview.agent-runtime.example.com
  previewTLSSecretName: cloudflare-origin-tls
  # Firecracker 的预览入口在宿主（cni0 的地址）上，D-22。
  previewHostCidrs: ["10.42.0.1/32"]

worker:
  # Worker 接 Memory Service：写入经验、规划与 tool_loop 时检索（M-03）。
  memory:
    enabled: true
  workspacesClaim: workspaces
  shell:
    mode: sandbox
    # 邀请制租户默认 gVisor；公开注册的租户由租户策略的 sandbox.backend 指到 kata（或 cloudflare，见 deploy/cloudflare）。
    defaultBackend: gvisor
    sandboxNamespace: sandboxes
    # 默认用多语言的运行环境（D-14）；只用 Python 的租户也能跑（universal 里有 Python）。
    runtime: universal
    prepull: true
    # 按项目定制的运行环境（D-17）：构建在 Kata 里，镜像放 Chart 建的环境镜像仓库（单节点经 NodePort 拉）。
    environments:
      enabled: true
      baseImage: ghcr.io/agentruntime/sandbox-universal:0.1.0
      registry:
        pullHost: 127.0.0.1:30500
        deploy: true
        htpasswdSecret: agent-runtime-env-registry
      builder:
        agentImage: ghcr.io/agentruntime/sandbox-agent:0.1.0
      # Docker Hub 的拉取缓存（ENV-MIRROR）：所有租户的构建都用，出网记平台账，15 GiB 按最近使用淘汰。
      dockerMirror:
        enabled: true
      # 每个租户最多几个项目环境的镜像（building 与 ready 都算）：Terminal-Bench 40 题要约 40 个（DEP-TB29，2026-11-04 用户批准），
      # 每个 1～2 GB；节点的盘在 kubelet 回收镜像的 85% 以下。
      limits:
        maxImages: 50
    # 单节点上 K8s 后端挂工作区卷（workspace: mount，默认）；加节点之前改成 workspace: archive 并去掉 workspace_claim（D-06，
    # 工作区存档在 R2，环境建在哪个节点都能恢复）。Cloudflare 后端（deploy/cloudflare）总是 archive。
    backends:
      gvisor:
        kind: k8s
        isolation: container
        runtime_class: gvisor
        namespace: sandboxes
        image: ghcr.io/agentruntime/sandbox-python:0.1.0
        images:
          universal: ghcr.io/agentruntime/sandbox-universal:0.1.0
          node: ghcr.io/agentruntime/sandbox-node:0.1.0
          go: ghcr.io/agentruntime/sandbox-go:0.1.0
        agent_image: ghcr.io/agentruntime/sandbox-agent:0.1.0
        connect: pod_ip
        workspace_claim: workspaces
        # 每个租户同时最多几个沙箱（D-10）；命名空间的总量另由 ResourceQuota 限住。
        max_envs_per_scope: 4
      kata:
        kind: k8s
        isolation: microvm
        runtime_class: kata
        namespace: sandboxes
        image: ghcr.io/agentruntime/sandbox-python:0.1.0
        images:
          universal: ghcr.io/agentruntime/sandbox-universal:0.1.0
          node: ghcr.io/agentruntime/sandbox-node:0.1.0
          go: ghcr.io/agentruntime/sandbox-go:0.1.0
        agent_image: ghcr.io/agentruntime/sandbox-agent:0.1.0
        connect: pod_ip
        # 存档模式（D-06）：与 Cloudflare 后端同一组，Kata 满了能回退过去（租户策略的 sandbox.fallback）；建环境时从快照恢复。
        workspace: archive
        # microVM 启动比容器慢。
        startup_timeout_s: 120
        max_envs_per_scope: 2
      # Cloudflare Containers（D-07，deploy/cloudflare/sandbox-bridge）：总是存档模式；桥的令牌在 SecretStore 的
      # sandbox/cloudflare-bridge-token。容量有时会暂时不够（transient），所以作回退，不作首选。
      cloudflare:
        kind: cloudflare
        isolation: microvm
        bridge_url: https://agentruntime-sandbox-bridge.root-60a.workers.dev
        workspace: archive
        # 桥部署的是 sandbox-universal 镜像（deploy/cloudflare/sandbox-bridge/wrangler.jsonc），与 Kata 一样跑 universal。
        runtimes: [universal, python]
      # Firecracker（docs/plan/firecracker-backend.md，D-20～D-22）：每个环境一台 VM，总是存档模式。宿主上的 fc-manager
      # （systemd，deploy/cluster/fc-manager.service）只听 cni0；令牌在 SecretStore 的 sandbox/fc-manager-token。
      # 先只给租户策略写了 backend: firecracker 的租户用（evals、real01 等），defaultBackend 仍是 gvisor。
      # 客户机没有网卡：代理与包镜像指向客户机里的环回转发器（经 vsock 到 fc-manager，再到网关与镜像的 ClusterIP）。
      # rootfs 由 deploy/images/firecracker/rootfs.sh 从下面同一组镜像转换，放在宿主的 /var/lib/agentruntime/fc/images。
      firecracker:
        kind: firecracker
        isolation: microvm
        workspace: archive
        enabled: true
        manager_url: http://10.42.0.1:8097
        runtimes: [python, universal, node, go]
        egress_gateway_url: http://127.0.0.1:3128
        pkg_mirror_url: http://127.0.0.1:3129
        capabilities: [vsock]
        max_envs_per_scope: 4
  pools:
    task:
      minReplicas: 1
      maxReplicas: 4
      targetQueueSize: 20
      resources:
        requests: {cpu: 250m, memory: 256Mi}
        limits: {cpu: "1", memory: 512Mi}
    decision:
      minReplicas: 1
      maxReplicas: 4
      targetQueueSize: 10
      resources:
        requests: {cpu: 250m, memory: 256Mi}
        limits: {cpu: "1", memory: 512Mi}
    model:
      minReplicas: 1
      maxReplicas: 6
      targetQueueSize: 10
      resources:
        requests: {cpu: 250m, memory: 256Mi}
        limits: {cpu: "1", memory: 512Mi}
    program:
      minReplicas: 1
      maxReplicas: 4
      targetQueueSize: 10
      resources:
        requests: {cpu: 250m, memory: 512Mi}
        limits: {cpu: "2", memory: 1Gi}
    workspace:
      minReplicas: 1
      maxReplicas: 3
      targetQueueSize: 5
      resources:
        requests: {cpu: 250m, memory: 256Mi}
        limits: {cpu: "1", memory: 512Mi}

# Learning Pipeline（T-16）：Job 直接消费 Collector 写进 Redpanda 的 telemetry.spans（values.yaml 的 learning 一节）。
# 租户与任务族换成线上要学的那一个：--set learning.tenant=<租户> --set learning.family=<任务族>。
learning:
  enabled: true

collector:
  replicas: 1
