{{- $name := include "ar.modelGatewayService" . -}}
{{- $gw := .Values.modelGateway -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "ar.labels" (list . "model-gateway") | nindent 4 }}
spec:
  replicas: {{ $gw.replicas }}
  selector:
    matchLabels:
      {{- include "ar.selector" (list . "model-gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ar.labels" (list . "model-gateway") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ar.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: model-gateway
          image: {{ include "ar.image" (list . "model-gateway") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          ports:
            # gRPC（明文 HTTP/2）与 /healthz 同一端口。
            - name: grpc
              containerPort: {{ $gw.port }}
          env:
            {{- include "ar.commonEnv" . | nindent 12 }}
            - name: AR_MODEL_GATEWAY_ADDR
              value: {{ printf "0.0.0.0:%v" $gw.port | quote }}
            - name: AR_MODEL_PROFILES_FILE
              value: /etc/agentruntime/model-profiles/model-profiles.json
            - name: AR_MODEL_PROVIDER
              value: {{ $gw.provider | quote }}
            - name: AR_MODEL_PROVIDER_BASE_URL
              value: {{ $gw.providerBaseUrl | quote }}
            {{- if $gw.tenantPoliciesConfigMap }}
            - name: AR_DEV_TENANT_POLICIES_FILE
              value: /etc/agentruntime/tenant-policies/tenant-policies.json
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: grpc
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml $gw.resources | nindent 12 }}
          volumeMounts:
            {{- include "ar.volumeMounts" . | nindent 12 }}
            - name: model-profiles
              mountPath: /etc/agentruntime/model-profiles
              readOnly: true
            {{- if $gw.tenantPoliciesConfigMap }}
            - name: tenant-policies
              mountPath: /etc/agentruntime/tenant-policies
              readOnly: true
            {{- end }}
      volumes:
        {{- include "ar.volumes" . | nindent 8 }}
        - name: model-profiles
          configMap:
            name: {{ $gw.profilesConfigMap }}
        {{- if $gw.tenantPoliciesConfigMap }}
        - name: tenant-policies
          configMap:
            name: {{ $gw.tenantPoliciesConfigMap }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "ar.labels" (list . "model-gateway") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ar.selector" (list . "model-gateway") | nindent 4 }}
  ports:
    - name: grpc
      port: {{ $gw.port }}
      targetPort: grpc
