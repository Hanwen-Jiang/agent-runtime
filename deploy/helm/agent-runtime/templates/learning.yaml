{{- if .Values.learning.enabled }}
{{- $lp := .Values.learning -}}
{{- if ne (int $lp.maxReplicaCount) 1 }}
{{- fail "learning.maxReplicaCount 只能是 1：同一租户同一任务族的两次运行并发时，后一次的 Promote 覆盖前一次（R-06 评审第 4 节第 3 条）" }}
{{- end }}
{{- if or $lp.tracesClaim $lp.tracesFile }}
{{- fail "learning.tracesClaim、learning.tracesFile 不再使用：Job 直接消费 learning.topic（docs/plan/learning-pipeline.md 第 7 节）" }}
{{- end }}
# Learning Pipeline（T-16）：KEDA 按消费组在 trace 主题上的延迟起 Job（设计书 3.5）；每个 Job 跑一遍
# python -m agentruntime_learning.pipeline run，过评测门槛才经 Registry 发布。
# Job 直接消费 Collector 写的主题（docs/plan/learning-pipeline.md 第 7 节）：从最早保留的记录读到起跑时的末尾，跑完（退出码 0）
# 才把末尾提交为 consumerGroup 的位置。KEDA 的延迟因此是上次评测成功之后新到的记录；失败不提交，pollingInterval 之后整条重跑。
# 一个 ScaledJob 对应一个租户的一个任务族，同一时间只跑一个 Job（R-06 评审）。
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: {{ printf "%s-learning" (include "ar.fullname" .) }}
  labels:
    {{- include "ar.labels" (list . "learning") | nindent 4 }}
spec:
  pollingInterval: {{ int $lp.pollingInterval }}
  maxReplicaCount: 1
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTargetRef:
    parallelism: 1
    backoffLimit: 0
    template:
      metadata:
        labels:
          {{- include "ar.labels" (list . "learning") | nindent 10 }}
      spec:
        restartPolicy: Never
        serviceAccountName: {{ include "ar.fullname" . }}
        automountServiceAccountToken: false
        securityContext:
          {{- toYaml .Values.podSecurityContext | nindent 10 }}
        containers:
          - name: learning
            image: {{ include "ar.image" (list . "learning") }}
            imagePullPolicy: {{ .Values.image.pullPolicy }}
            args:
              - -m
              - agentruntime_learning.pipeline
              - run
              - --tenant
              - {{ $lp.tenant | quote }}
              - --family
              - {{ $lp.family | quote }}
              - --topic
              - {{ $lp.topic | quote }}
              - --group
              - {{ $lp.consumerGroup | quote }}
              - --format
              - otlp_json
              - --report-dir
              - /reports
              - --budget-usd
              - {{ $lp.budgetUsd | quote }}
            env:
              {{- include "ar.commonEnv" (merge (dict "imageComponent" "learning") .) | nindent 14 }}
              # 成本读 Model Gateway 结算的 model_usage（R-06-D）：与网关同一个业务库；没配时命令行退回读 trace 上的成本。
              {{- include "ar.dsnEnv" . | nindent 14 }}
              - name: AR_EVENT_STREAM_BROKERS
                value: {{ .Values.external.redpanda.brokers | quote }}
              - name: AR_REGISTRY_ADDRESS
                value: {{ printf "%s:%v" (include "ar.registryService" .) .Values.taskService.registryPort | quote }}
              - name: AR_MODEL_GATEWAY_ADDRESS
                value: {{ printf "%s:%v" (include "ar.modelGatewayService" .) .Values.modelGateway.port | quote }}
            securityContext:
              {{- toYaml .Values.containerSecurityContext | nindent 14 }}
            resources:
              {{- toYaml $lp.resources | nindent 14 }}
            volumeMounts:
              - name: secrets
                mountPath: /var/run/agentruntime/secrets
                readOnly: true
              - name: tmp
                mountPath: /tmp
              - name: reports
                mountPath: /reports
        volumes:
          - name: secrets
            secret:
              secretName: {{ .Values.secrets.existingSecret }}
              items:
                - key: {{ .Values.secrets.secretsFileKey }}
                  path: {{ .Values.secrets.secretsFileKey }}
          - name: tmp
            emptyDir: {}
          - name: reports
            emptyDir: {}
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: {{ .Values.external.redpanda.brokers | quote }}
        consumerGroup: {{ $lp.consumerGroup | quote }}
        topic: {{ $lp.topic | quote }}
        lagThreshold: {{ $lp.lagThreshold | quote }}
        activationLagThreshold: {{ $lp.activationLagThreshold | quote }}
        # 还没提交过时按全部记录算延迟（Job 从头读）；默认的 latest 只算 1，activationLagThreshold 永远达不到。
        offsetResetPolicy: earliest
{{- end }}
