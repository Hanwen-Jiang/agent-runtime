{{- /* Worker 按任务队列分池（设计书 3.6、附录 K.5）：每个池一个 Deployment（--queues 只有这个队列）与一个 KEDA ScaledObject。
       副本数交给 KEDA（temporal 触发器按队列积压），Deployment 不写 replicas。 */ -}}
{{- $shell := .Values.worker.shell }}
{{- range $pool, $cfg := .Values.worker.pools }}
{{- $name := printf "%s-worker-%s" (include "ar.fullname" $) $pool }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "ar.labels" (list $ "worker") | nindent 4 }}
    agentruntime.io/pool: {{ $pool }}
spec:
  selector:
    matchLabels:
      {{- include "ar.selector" (list $ "worker") | nindent 6 }}
      agentruntime.io/pool: {{ $pool }}
  template:
    metadata:
      labels:
        {{- include "ar.labels" (list $ "worker") | nindent 8 }}
        agentruntime.io/pool: {{ $pool }}
    spec:
      # 沙箱经 Sandbox Service（SBX-01）：Worker 不挂 Kubernetes 的令牌。
      serviceAccountName: {{ include "ar.fullname" $ }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "ar.image" (list $ "worker") }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: ["-m", "agentruntime_worker", "--queues", {{ $pool | quote }}]
          env:
            {{- include "ar.storeEnv" $ | nindent 12 }}
            - name: AR_TEMPORAL_ADDRESS
              value: {{ $.Values.external.temporal.address | quote }}
            - name: AR_TEMPORAL_NAMESPACE
              value: {{ $.Values.external.temporal.namespace | quote }}
            - name: AR_MODEL_GATEWAY_ADDRESS
              value: {{ printf "%s:%v" (include "ar.modelGatewayService" $) $.Values.modelGateway.port | quote }}
            - name: AR_REGISTRY_ADDRESS
              value: {{ printf "%s:%v" (include "ar.registryService" $) $.Values.taskService.registryPort | quote }}
            {{- if include "ar.deltasEnabled" $ }}
            # 逐字增量（DELTA）：deliver 节点流式生成的片段推到 task-service 的内部端口；令牌在共用 SecretStore 的 delta/worker。
            - name: AR_TASK_SERVICE_INTERNAL_URL
              value: {{ printf "http://%s:%v" (include "ar.taskServiceInternalService" $) $.Values.taskService.deltas.port | quote }}
            {{- end }}
            - name: AR_PLANNER
              value: {{ $.Values.worker.planner | quote }}
            - name: AR_REVIEWER
              value: {{ $.Values.worker.reviewer | quote }}
            - name: AR_TOOL_LOOP
              value: {{ $.Values.worker.toolLoop | quote }}
            {{- if not (has ($.Values.worker.subAgentPolicy | default "off") (list "off" "rules")) }}
            {{- fail "worker.subAgentPolicy 只能是 off 或 rules" }}
            {{- end }}
            - name: AR_SUB_AGENT_POLICY
              value: {{ $.Values.worker.subAgentPolicy | default "off" | quote }}
            {{- if not (has ($.Values.worker.judge | default "") (list "" "jev")) }}
            {{- fail "worker.judge 只能是空或 jev" }}
            {{- end }}
            {{- with $.Values.worker.judge }}
            - name: AR_JUDGE
              value: {{ . | quote }}
            {{- end }}
            {{- with $.Values.worker.judgeKeySecret.name }}
            - name: AR_JUDGE_KEY_FILE
              value: {{ printf "/etc/agentruntime/judge/%s" $.Values.worker.judgeKeySecret.key | quote }}
            {{- end }}
            - name: AR_DATA_DIR
              value: /data
            {{- include "ar.objectStoreEnv" $ | nindent 12 }}
            {{- if $.Values.worker.memory.enabled }}
            - name: AR_MEMORY_ADDRESS
              value: {{ printf "%s-memory:%v" (include "ar.fullname" $) $.Values.memory.port | quote }}
            {{- include "ar.signingKeyEnv" $ | nindent 12 }}
            {{- end }}
            {{- with $.Values.worker.contextEffectiveTokens }}
            - name: AR_CONTEXT_EFFECTIVE_TOKENS
              value: {{ . | quote }}
            {{- end }}
            {{- with $.Values.worker.contextOffloadTokens }}
            - name: AR_CONTEXT_OFFLOAD_TOKENS
              value: {{ . | quote }}
            {{- end }}
            - name: AR_TOOL_SHELL_SANDBOX
              value: {{ $shell.mode | quote }}
            {{- if eq $shell.mode "sandbox" }}
            # Sandbox Service（SBX-01）：shell_run 与 Workspace 操作经它；调用方令牌在共用 SecretStore 的 sandbox-service/tokens/worker。
            - name: AR_SANDBOX_SERVICE_ADDRESS
              value: {{ printf "%s:%v" (include "ar.sandboxService" $) $.Values.sandboxService.port | quote }}
            # 后端登记只用来看有没有托管后端（联网授权的形状）；选后端、建环境在服务里。
            - name: AR_SANDBOX_BACKENDS_FILE
              value: /etc/agentruntime/sandbox/backends.json
            - name: AR_SANDBOX_RUNTIME
              value: {{ $shell.runtime | default "python" | quote }}
            {{- if $.Values.egressGateway.enabled }}
            # 出网网关（D-16）：登记 request_network；预览地址的域名。代理凭据由 Sandbox Service 签发。
            - name: AR_EGRESS_GATEWAY_URL
              value: {{ printf "http://%s-egress-gateway.%s.svc:8095" (include "ar.fullname" $) $.Release.Namespace | quote }}
            {{- with $.Values.egressGateway.previewDomain }}
            - name: AR_PREVIEW_DOMAIN
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            # 工作区、联网授权在业务库里，与 Sandbox Service 共用。
            {{- include "ar.dsnEnv" $ | nindent 12 }}
            {{- end }}
            {{- if $.Values.worker.workspacesClaim }}
            - name: AR_TOOL_WORKSPACE_ROOT
              value: /workspaces
            {{- end }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          volumeMounts:
            {{- include "ar.volumeMounts" $ | nindent 12 }}
            {{- if $.Values.worker.workspacesClaim }}
            - name: workspaces
              mountPath: /workspaces
            {{- end }}
            {{- if eq $shell.mode "sandbox" }}
            - name: sandbox-backends
              mountPath: /etc/agentruntime/sandbox
              readOnly: true
            {{- end }}
            {{- if $.Values.worker.judgeKeySecret.name }}
            - name: judge-key
              mountPath: /etc/agentruntime/judge
              readOnly: true
            {{- end }}
      volumes:
        {{- include "ar.volumes" $ | nindent 8 }}
        {{- if $.Values.worker.workspacesClaim }}
        - name: workspaces
          persistentVolumeClaim:
            claimName: {{ $.Values.worker.workspacesClaim }}
        {{- end }}
        {{- if eq $shell.mode "sandbox" }}
        - name: sandbox-backends
          configMap:
            name: {{ printf "%s-sandbox-backends" (include "ar.fullname" $) }}
        {{- end }}
        {{- with $.Values.worker.judgeKeySecret.name }}
        - name: judge-key
          secret:
            secretName: {{ . }}
            # 可选：Secret 还没建时 Worker 照常启动，Jev 只是没有密钥、不检查；建好后约一分钟文件出现，不用重启（每次调用时读）。
            optional: true
            items:
              - key: {{ $.Values.worker.judgeKeySecret.key }}
                path: {{ $.Values.worker.judgeKeySecret.key }}
        {{- end }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $name }}
  labels:
    {{- include "ar.labels" (list $ "worker") | nindent 4 }}
    agentruntime.io/pool: {{ $pool }}
spec:
  scaleTargetRef:
    name: {{ $name }}
  minReplicaCount: {{ $cfg.minReplicas }}
  maxReplicaCount: {{ $cfg.maxReplicas }}
  triggers:
    - type: temporal
      metadata:
        endpoint: {{ $.Values.external.temporal.address | quote }}
        namespace: {{ $.Values.external.temporal.namespace | quote }}
        taskQueue: {{ $pool | quote }}
        {{- /* task 池只有工作流；workspace 池（WS-READ-02）的工作流与 activity 同一个队列；其余只有 activity。 */}}
        queueTypes: {{ (eq $pool "task" | ternary "workflow" (eq $pool "workspace" | ternary "workflow,activity" "activity")) | quote }}
        targetQueueSize: {{ $cfg.targetQueueSize | quote }}
{{- end }}
