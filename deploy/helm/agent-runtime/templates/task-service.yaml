{{- $name := printf "%s-task-service" (include "ar.fullname" .) -}}
{{- $ts := .Values.taskService -}}
{{- $tenantPoliciesConfigMap := include "ar.modelGatewayTenantPoliciesConfigMap" . -}}
{{- $deltas := include "ar.deltasEnabled" . -}}
{{- if not (has $ts.profile (list "development" "production")) }}
{{- fail "taskService.profile 只能是 development 或 production" }}
{{- end }}
{{- if and (eq $ts.profile "production") (not .Values.secrets.relationalDsn.name) }}
{{- fail "taskService.profile=production 要配 secrets.relationalDsn：生产模式的 task-service 不回落 SQLite（TS-PROD-01）" }}
{{- end }}
{{- if and (eq $ts.profile "production") (not .Values.secrets.valkeyUrl.name) }}
{{- fail "taskService.profile=production 要配 secrets.valkeyUrl：生产模式的 Cache 不用进程内的开发实现（TS-PROD-01）" }}
{{- end }}
{{- if and (gt (int $ts.replicas) 1) (not .Values.secrets.valkeyUrl.name) }}
{{- fail "taskService.replicas 大于 1 要配 secrets.valkeyUrl：进程内的 Cache 里，各副本看不到彼此的事件流（TS-PROD-01）" }}
{{- end }}
{{- /* AUTH-01：收不收开发令牌，空时按 profile（development 收、production 不收）；不收时要有签发方的公钥。 */}}
{{- $devTokens := $ts.ingress.devTokens | default (ternary "refuse" "accept" (eq $ts.profile "production")) }}
{{- if not (has $devTokens (list "accept" "refuse")) }}
{{- fail "taskService.ingress.devTokens 只能是 accept、refuse 或留空（按 profile）" }}
{{- end }}
{{- if and (eq $devTokens "refuse") (not $ts.ingress.issuers) }}
{{- fail "taskService.ingress.devTokens 是 refuse（生产模式的默认）时要配 taskService.ingress.issuers（签发方的公钥，task-service keygen 生成；AUTH-01）；迁移期间可以写 accept" }}
{{- end }}
{{- $budget := div (int .Values.external.postgres.maxConnections) 4 }}
{{- if gt (mul (int $ts.replicas) (int $ts.relationalMaxConns)) $budget }}
{{- fail (printf "taskService.replicas × taskService.relationalMaxConns 超过了 external.postgres.maxConnections 的四分之一（%d）：其余连接留给 Worker、Memory Service、Temporal 与 Langfuse；副本多了在前面加 PgBouncer" $budget) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "ar.labels" (list . "task-service") | nindent 4 }}
spec:
  replicas: {{ $ts.replicas }}
  selector:
    matchLabels:
      {{- include "ar.selector" (list . "task-service") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ar.labels" (list . "task-service") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ar.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: task-service
          image: {{ include "ar.image" (list . "task-service") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          ports:
            - name: http
              containerPort: {{ $ts.httpPort }}
            - name: registry
              containerPort: {{ $ts.registryPort }}
            {{- if $deltas }}
            - name: internal
              containerPort: {{ $ts.deltas.port }}
            {{- end }}
          env:
            {{- if .Values.fileIntelligence.enabled }}
            - name: AR_FILE_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "fileIntelligence.internalTokenSecret.name is required" .Values.fileIntelligence.internalTokenSecret.name }}
                  key: {{ .Values.fileIntelligence.internalTokenSecret.key }}
            - name: AR_KNOWLEDGE_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "fileIntelligence.knowledgeTokenSecret.name is required" .Values.fileIntelligence.knowledgeTokenSecret.name }}
                  key: {{ .Values.fileIntelligence.knowledgeTokenSecret.key }}
            - name: AR_MEMORY_ADDRESS
              value: {{ printf "%s-memory:%v" (include "ar.fullname" .) .Values.memory.port | quote }}
            - name: AR_EMBEDDING_VERSION
              value: {{ required "fileIntelligence requires memory.embeddingVersion" .Values.memory.embeddingVersion | quote }}
            - name: AR_KNOWLEDGE_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.signingKeyKey }}
            {{- end }}
            {{- include "ar.storeEnv" (merge (dict "imageComponent" "task-service") .) | nindent 12 }}
            # Ingress（AUTH-01）：只收 JWT 时不给签名密钥，task-service 不持有能签令牌的东西。
            - name: AR_INGRESS_DEV_TOKENS
              value: {{ $devTokens | quote }}
            {{- if eq $devTokens "accept" }}
            {{- include "ar.signingKeyEnv" . | nindent 12 }}
            {{- end }}
            {{- if $ts.ingress.issuers }}
            - name: AR_INGRESS_ISSUERS_FILE
              value: /etc/agentruntime/ingress/issuers.json
            {{- end }}
            {{- include "ar.dsnEnv" . | nindent 12 }}
            - name: AR_RELATIONAL_MAX_CONNS
              value: {{ $ts.relationalMaxConns | quote }}
            - name: AR_PROFILE
              value: {{ $ts.profile | quote }}
            {{- with .Values.secrets.valkeyUrl }}
            {{- if .name }}
            - name: AR_VALKEY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
            {{- end }}
            - name: AR_TEMPORAL_ADDRESS
              value: {{ .Values.external.temporal.address | quote }}
            - name: AR_TEMPORAL_NAMESPACE
              value: {{ .Values.external.temporal.namespace | quote }}
            - name: AR_HTTP_ADDR
              value: {{ printf "0.0.0.0:%v" $ts.httpPort | quote }}
            # SubmitTask 给的事件订阅地址按它拼：显式配的优先，其次是入口的域名，没有入口时是集群内的 Service（不配时 task-service
            # 用自己的监听地址 0.0.0.0，从别处连不上）。
            - name: AR_PUBLIC_BASE_URL
              {{- if $ts.publicBaseURL }}
              value: {{ trimSuffix "/" $ts.publicBaseURL | quote }}
              {{- else if .Values.ingress.enabled }}
              value: {{ printf "https://%s" .Values.ingress.host | quote }}
              {{- else }}
              value: {{ printf "http://%s.%s.svc:%v" $name .Release.Namespace $ts.httpPort | quote }}
              {{- end }}
            - name: AR_REGISTRY_ADDR
              value: {{ printf "0.0.0.0:%v" $ts.registryPort | quote }}
            {{- if $deltas }}
            # 逐字增量（DELTA）：调用方 worker 的令牌在共用 SecretStore 平台作用域的 delta/worker，没有时启动时生成。
            - name: AR_INTERNAL_ADDR
              value: {{ printf "0.0.0.0:%v" $ts.deltas.port | quote }}
            {{- with $ts.deltas.disabledTenants }}
            - name: AR_DELTA_DISABLED_TENANTS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- end }}
            # 镜像里的 /schemas（deploy/images/go.Dockerfile）。
            - name: AR_SCHEMAS_DIR
              value: /schemas
            - name: AR_DATA_DIR
              value: /data
            {{- if $tenantPoliciesConfigMap }}
            - name: AR_DEV_TENANT_POLICIES_FILE
              value: /etc/agentruntime/tenant-policies/tenant-policies.json
            {{- end }}
            {{- with .Values.taskService.activeTaskLimits }}
            - name: AR_TENANT_ACTIVE_TASKS
              value: {{ include "ar.activeTaskLimits" . | quote }}
            {{- end }}
            {{- if eq .Values.worker.shell.mode "sandbox" }}
            # Workspace API 的只读方法直接调 Sandbox Service（WS-READ-01，SBX-01）；令牌在共用 SecretStore 的 sandbox-service/tokens/task-service。
            - name: AR_SANDBOX_SERVICE_ADDRESS
              value: {{ printf "%s:%v" (include "ar.sandboxService" .) .Values.sandboxService.port | quote }}
            {{- end }}
            {{- if .Values.egressGateway.enabled }}
            # Task 结束、收回联网授权后通知出网网关立即断开（D-16）；管理令牌在 SecretStore 的 egress-gateway/admin-token。
            - name: AR_EGRESS_GATEWAY_ADMIN_URL
              value: {{ printf "http://%s-egress-gateway.%s.svc:8096" (include "ar.fullname" .) .Release.Namespace | quote }}
            {{- end }}
            {{- include "ar.objectStoreEnv" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml $ts.resources | nindent 12 }}
          volumeMounts:
            {{- include "ar.volumeMounts" . | nindent 12 }}
            {{- if $tenantPoliciesConfigMap }}
            - name: tenant-policies
              mountPath: /etc/agentruntime/tenant-policies
              readOnly: true
            {{- end }}
            {{- if $ts.ingress.issuers }}
            - name: ingress-issuers
              mountPath: /etc/agentruntime/ingress
              readOnly: true
            {{- end }}
      volumes:
        {{- include "ar.volumes" . | nindent 8 }}
        {{- if $tenantPoliciesConfigMap }}
        - name: tenant-policies
          configMap:
            name: {{ $tenantPoliciesConfigMap }}
        {{- end }}
        {{- if $ts.ingress.issuers }}
        - name: ingress-issuers
          configMap:
            name: {{ $name }}-ingress-issuers
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "ar.labels" (list . "task-service") | nindent 4 }}
spec:
  type: {{ $ts.service.type }}
  selector:
    {{- include "ar.selector" (list . "task-service") | nindent 4 }}
  ports:
    - name: http
      port: {{ $ts.httpPort }}
      targetPort: http
---
# Registry 的内部端口：只在集群内（ClusterIP），不进 Ingress；写方法另有发布令牌（docs/plan/registry.md 第 2 节第 7 条）。
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ar.registryService" . }}
  labels:
    {{- include "ar.labels" (list . "task-service") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ar.selector" (list . "task-service") | nindent 4 }}
  ports:
    - name: grpc
      port: {{ $ts.registryPort }}
      targetPort: registry
{{- if $deltas }}
---
# 逐字增量的内部端口（DELTA）：只在集群内，不进入口；下面的 NetworkPolicy 只放本命名空间的 Worker。
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ar.taskServiceInternalService" . }}
  labels:
    {{- include "ar.labels" (list . "task-service") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ar.selector" (list . "task-service") | nindent 4 }}
  ports:
    - name: internal
      port: {{ $ts.deltas.port }}
      targetPort: internal
---
# 选中 task-service 之后没列出的入站都被拒，所以三个端口都写上：Task API 谁都能连（入口、coding-web），
# Registry 只放本命名空间，逐字增量的内部端口只放本命名空间的 Worker（沙箱与别的命名空间进不来）。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "ar.labels" (list . "task-service") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ar.selector" (list . "task-service") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: {{ $ts.httpPort }}}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
      ports:
        - {protocol: TCP, port: {{ $ts.registryPort }}}
    - from:
        - podSelector:
            matchLabels:
              {{- include "ar.selector" (list . "worker") | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ $ts.deltas.port }}}
{{- end }}
{{- if $ts.ingress.issuers }}
---
# 签发方的登记（AUTH-01）：只有公钥，不是密钥，放 ConfigMap；私钥只在签发方（coding-agent）那里。
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-ingress-issuers
  labels:
    {{- include "ar.labels" (list . "task-service") | nindent 4 }}
data:
  issuers.json: {{ dict "audience" $ts.ingress.audience "issuers" $ts.ingress.issuers | toJson | quote }}
{{- end }}
