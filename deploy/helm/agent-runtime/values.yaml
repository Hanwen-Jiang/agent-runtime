# Agent Runtime 的默认 values（细化见 docs/plan/deploy-telemetry.md）。
# 第三方组件（Temporal、Postgres、Qdrant、Redpanda、Langfuse、Tempo）不在这个 Chart 里，只填地址。
# 密钥一律引用已有的 Secret（名字与键），values 里不写密钥的值。

global:
  # 写进 OTEL_DEPLOYMENT_ENVIRONMENT。
  environment: dev

image:
  registry: ghcr.io/agentruntime
  # 为空时用 Chart 的 appVersion。不要用 latest。
  tag: ""
  pullPolicy: IfNotPresent

# 已有的 Secret（由运维创建）：
#   secrets.json       开发 SecretStore 的文件（AR_SECRETS_FILE）：模型供应商的密钥、Registry 的发布令牌、
#                      沙箱 agent 的令牌密钥（sandbox/token-key）与 Cloudflare 桥的令牌等。
#   dev-signing-key    开发用的令牌签名密钥（AR_DEV_SIGNING_KEY）。
secrets:
  existingSecret: agent-runtime-secrets
  secretsFileKey: secrets.json
  signingKeyKey: dev-signing-key
  # SecretStore 的可写文件所在的 PVC（docs/plan/cloud-deploy.md D-04）：Claim-Check 与 Memory Service 第一次用到一个租户时
  # 要把它的 kek 写回文件，多个副本还要共用同一份。设了时 task-service、Worker、Memory Service 的 AR_SECRETS_FILE 在这个卷上，
  # 上面的 secrets.json 作为种子在启动时并进去（AR_SECRETS_SEED_FILE；种子里的密钥覆盖旧值，已生成的 kek 不换）。
  # 为空时直接读只读的 secrets.json，写 kek 会失败，只适合不卸载大载荷的试跑。
  storeClaim: ""
  # 业务库的连接串（AR_RELATIONAL_DSN）；name 为空时 task-service、Memory Service 与 Worker（沙箱环境表，D-11）用 AR_DATA_DIR 下的 SQLite。
  relationalDsn:
    name: ""
    key: dsn

external:
  temporal:
    address: temporal-frontend:7233
    namespace: default
  qdrant:
    # 为空时 Memory Service 的向量放在内存里（只适合开发）。与 milvus.uri 只能设一个。
    url: ""
  milvus:
    # Memory Service 的向量库（docs/plan/memory-live.md）。
    uri: ""
  redpanda:
    brokers: redpanda:9092
  tempo:
    endpoint: tempo:4317
  # 指标的后端（TMP 计划第 9.3 节）：Collector 的 metrics 管道经 Prometheus remote write 写到这里。
  victoriametrics:
    remoteWrite: http://vm-victoria-metrics-single-server:8428/api/v1/write
  langfuse:
    endpoint: http://langfuse-web:3000
    # Basic 认证（base64 的 public_key:secret_key）所在的 Secret。
    authSecret:
      name: agent-runtime-langfuse
      key: basic-auth

# 业务对象的存放。task-service 与 Worker 要读写同一处（Claim-Check、外置结果）。
# - s3.endpoint 设了：S3 兼容的对象存储（Cloudflare R2、S3、MinIO；AR_S3_*，D-09），各 Pod 不用共用卷。
# - 否则是开发 ObjectStore 的本地目录（AR_OBJECT_STORE_DIR）：claimName 是共用的 PVC（单节点上 local-path 的卷就行，
#   所有 Pod 在一台机器上）；为空时每个 Pod 用自己的 emptyDir，跨 Pod 取不回，只适合单机试跑。
objectStore:
  claimName: ""
  s3:
    endpoint: ""
    bucket: ""
    region: auto
    # 几个环境共用一个桶时的前缀，以 / 结尾。
    prefix: ""
    accessKeyId: ""
    # 密钥所在的已有 Secret。
    secretAccessKey:
      name: ""
      key: secret-access-key

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

taskService:
  replicas: 1
  # Task API 与 /healthz 同一端口；Registry 是单独的内部端口，只有集群内的 Service（docs/plan/registry.md 第 2 节第 7 条）。
  httpPort: 8080
  registryPort: 8092
  # 客户端连 Task API 用的地址（AR_PUBLIC_BASE_URL，SubmitTask 的事件订阅地址按它拼）。为空时：开了入口用 https://<ingress.host>，
  # 否则用集群内的 Service 地址。
  publicBaseURL: ""
  service:
    type: ClusterIP
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}

# 对外入口：只有 Task API（含 SSE 事件流）；Registry 的内部端口永远不进入口（T-08）。
ingress:
  enabled: false
  # traefik：Traefik 的 IngressRoute（k3s 自带；docs/plan/cloud-deploy.md D-04）；gateway：Gateway API 的 HTTPRoute；
  # ingress：通用的 networking.k8s.io Ingress（className 与 annotations 自选）。
  type: traefik
  host: agent-runtime.example
  className: ""
  annotations: {}
  traefik:
    entryPoints: [websecure]
    # 证书所在的 Secret（Cloudflare 代理在前面时放 Cloudflare 的源站证书）；为空时用 Traefik 的默认证书。
    tlsSecretName: ""
  gateway:
    # 挂到哪个 Gateway，例如 [{name: public, namespace: kube-system}]；type=gateway 时必填。
    parentRefs: []

modelGateway:
  replicas: 1
  port: 8091
  # openai_compat 或 mock。
  provider: openai_compat
  providerBaseUrl: https://api.example/v1
  # Model Profile 所在的 ConfigMap（键 model-profiles.json，格式同 deploy/dev/model-profiles.json），由运维创建。
  profilesConfigMap: agent-runtime-model-profiles
  # 按租户限制可选模型的 ConfigMap（键 tenant-policies.json，格式见 go-model-gateway 的 router.FileAllowlist），由运维创建；每次调用都重读，改了不用重启。
  # 空表示不限制。
  tenantPoliciesConfigMap: ""
  resources:
    requests: {cpu: 250m, memory: 128Mi}
    limits: {cpu: "1", memory: 256Mi}

memory:
  replicas: 1
  # Memory Service 单独用的镜像 tag，空时跟 image.tag。新镜像在生产配置不全时拒绝启动（docs/plan/memory-live.md 第 4 节），
  # 接上 Milvus 与真 embedding 之前留在旧镜像上。
  imageTag: ""
  # 嵌入模型的 Model Profile id；设了才经 Model Gateway 嵌入。
  embeddingVersion: ""
  port: 50061
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}

# 包镜像（docs/plan/cloud-deploy.md D-15）：沙箱装依赖的本地源（PyPI、npm、Go），按需拉取、按内容寻址缓存。
# 打开后 Worker 给 K8s 沙箱的命令注入镜像源变量（AR_PKG_MIRROR_URL），沙箱命名空间放行到它的 8093。
# 预算：包文件与元数据各自的上限（字节）；用量到 90% 开始淘汰，降到 75% 停；超过 maxFileBytes 的文件只转发。
pkgMirror:
  enabled: false
  storage: 120Gi
  storageClassName: ""
  # 已有的 PVC；空时 Chart 建一个。
  claimName: ""
  blobBudgetBytes: 107374182400
  metaBudgetBytes: 5368709120
  maxFileBytes: 524288000
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "2", memory: 1Gi}

# 评测看板（Eval Dashboard，docs/plan/eval-observability-and-runtime-fixes.md 第 11.12 节）：对外开放的静态页面，只有评测集上的汇总。
# 要 ingress.enabled 且 ingress.type=traefik。页面由发布步骤写进 ConfigMap（docs/plan/cloud-deploy.md），host 要有 DNS 记录。
evalDashboard:
  enabled: false
  # 对外的域名，例如 evals.cgent.link。
  host: ""
  # 入口控制器所在的命名空间（只有它能连；k3s 的 Traefik 在 kube-system）。
  ingressNamespace: kube-system
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 200m, memory: 96Mi}

# 出网网关（docs/plan/cloud-deploy.md D-16）：沙箱联网只经它，按 Task 的联网授权放行；要配 secrets.relationalDsn。
# 打开后 Worker 给命令注入代理变量并登记 request_network，task-service 在 Task 结束时通知它收回。
egressGateway:
  enabled: false
  # 预览地址的域名（https://<环境号>.<域名>）；空表示不开预览入口。ingress.type 是 traefik 时 Chart 建它的 IngressRoute。
  previewDomain: ""
  previewTLSSecretName: ""
  # 入口控制器所在的命名空间（只有它能连预览端口；k3s 的 Traefik 在 kube-system）。
  ingressNamespace: kube-system
  # 另外拒绝的网段：集群的 Pod 与 Service 网段（k3s 默认 10.42.0.0/16、10.43.0.0/16）。
  denyCidrs: ["10.42.0.0/16", "10.43.0.0/16"]
  # 授权缓存多久（毫秒）：撤销最迟这么久生效；Task 结束时 task-service 另外主动通知。
  grantTTLMillis: 2000
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: "1", memory: 512Mi}

worker:
  # Context Builder 的有效长度与转存门槛（token）；空表示用 Worker 的默认值（32000、2000）。
  contextEffectiveTokens: ""
  contextOffloadTokens: ""
  # 交付的快速检查（docs/plan/feedback-2026-11-01.md N-09）：空为不检查；jev 为 TypeSafe 的 Jev，密钥放在 SecretStore 种子
  # （secrets.existingSecret 的 secrets.json）平台作用域的 judge/jev-api-key。
  judge: ""
  # 不想为它改 SOPS 里的种子时：单独一个 Secret，挂成文件给 Worker（AR_JUDGE_KEY_FILE）；name 为空时从 SecretStore 读。
  judgeKeySecret:
    name: ""
    key: api-key
  # 真正的 Planner、Reviewer 与 tool_loop（经 Model Gateway）；stub 只用于端到端测试。
  planner: model
  reviewer: model
  toolLoop: model
  # 工作区（AR_TOOL_WORKSPACE_ROOT）：Worker 与应用共用的 PVC（单节点见 deploy/cluster/workspaces.yaml），挂在 /workspaces。
  # 为空时不登记 repo_* 与 shell_run。
  workspacesClaim: ""
  shell:
    # shell_run 在哪里跑（AR_TOOL_SHELL_SANDBOX）：host 不隔离，只给开发；集群里用 sandbox（经 Sandbox 接口，D-05）。
    # docker 要挂 docker.sock（等于节点 root），集群里不允许。
    mode: host
    # mode=sandbox 时的后端登记，写进 ConfigMap 作为 AR_SANDBOX_BACKENDS_FILE（格式见 agentruntime_worker.tools.sandboxes）。
    # 用哪个后端由租户策略的 sandbox.backend 决定，没写时 defaultBackend。每个后端的 workspace（D-06）：mount（默认，挂
    # workspacesClaim）或 archive（不挂卷，工作区存档在 ObjectStore；Cloudflare 默认如此）。只有 archive 的后端时不用 workspacesClaim。
    defaultBackend: ""
    backends: {}
    # shell_run 用的运行环境（AR_SANDBOX_RUNTIME，D-14）：后端登记的 images 把它映射到镜像，例如 universal（多语言）。
    runtime: python
    # kind=k8s 的后端把 Pod 建在这个命名空间：Chart 在那里给 Worker 建 Role（只能管 Pod，读不了 Secret），
    # Worker 用自己的 ServiceAccount（其余服务仍然不挂令牌）。
    sandboxNamespace: sandboxes
    # 在每个节点上预先拉好 kind=k8s 后端用到的镜像（D-14）：第一次建环境不用现下载几个 GB 的镜像。
    prepull: false
    # 按项目定制的运行环境（D-17）：仓库自带 devcontainer.json、.tool-versions 或 Dockerfile 时在 Kata 里构建一次、缓存复用；
    # 构建好之前、失败时退回 runtime（universal），并在 shell_run 的结果里说明。要打开 egressGateway（拉基础镜像经它）。
    environments:
      enabled: false
      # 生成 .tool-versions 的镜像时的底（按 digest 固定；baseDigest 为空时按标签）。
      baseImage: ""
      baseDigest: ""
      registry:
        # 推送地址：空时用 Chart 建的 env-registry（deploy: true）。
        url: ""
        # 节点拉镜像用的主机：单节点经 NodePort 是 127.0.0.1:30500（k3s 的 registries.yaml 里配它的凭据与 http）。
        pullHost: ""
        prefix: envs
        deploy: false
        image: registry:2.8.3
        storage: 50Gi
        nodePort: 30500
        # 能经 NodePort 拉镜像的地址（节点的网段）。
        nodeCidr: 0.0.0.0/0
        # htpasswd 的 Secret（键 htpasswd）；Worker 推送用的凭据另放在 SecretStore 的 sandbox/env-registry。
        htpasswdSecret: ""
      builder:
        namespace: sandbox-builds
        # 必须是 microVM 级的 RuntimeClass。
        runtimeClass: kata
        agentImage: ""
        buildkitImage: moby/buildkit:v0.25.1
      # 构建能经出网网关访问的主机（拉基础镜像、装系统包）。Docker Hub 的镜像层从两家 CDN 下载，按镜像而定。
      buildHosts: [registry-1.docker.io, auth.docker.io, production.cloudflare.docker.com, production.cloudfront.docker.com, ghcr.io, pkg-containers.githubusercontent.com, deb.debian.org, security.debian.org]
      limits:
        maxImages: 5
        maxImageBytes: 8589934592
        buildTimeoutSeconds: 1800
        idleDays: 14
  # 接 Memory Service：写入经验、规划与 tool_loop 时检索（docs/plan/memory-live.md）。
  memory:
    enabled: false
  # 按任务队列分池（设计书 3.6、附录 K.5），每个池一个 Deployment 与一个 KEDA ScaledObject。
  # 池名就是队列名（agentruntime_worker.names）；task 池按工作流积压扩缩，其余按 activity 积压。
  pools:
    task:
      minReplicas: 1
      maxReplicas: 10
      targetQueueSize: 20
      resources:
        requests: {cpu: 250m, memory: 256Mi}
        limits: {cpu: "1", memory: 512Mi}
    decision:
      minReplicas: 1
      maxReplicas: 20
      targetQueueSize: 10
      resources:
        requests: {cpu: 250m, memory: 256Mi}
        limits: {cpu: "1", memory: 512Mi}
    model:
      minReplicas: 1
      maxReplicas: 30
      targetQueueSize: 10
      resources:
        requests: {cpu: 250m, memory: 256Mi}
        limits: {cpu: "1", memory: 512Mi}
    program:
      minReplicas: 1
      maxReplicas: 20
      targetQueueSize: 10
      resources:
        requests: {cpu: 250m, memory: 512Mi}
        limits: {cpu: "2", memory: 1Gi}

# Learning Pipeline（T-16）：KEDA ScaledJob，按消费组在 trace 主题上的延迟起 Job（设计书 3.5）。
# Job 直接消费 Collector 写的主题（broker 是 external.redpanda.brokers）：从最早保留的记录读到起跑时的末尾，跑完才提交
# consumerGroup 的位置，所以历史只到主题的保留期（docs/plan/learning-pipeline.md 第 7 节）。
learning:
  enabled: true
  topic: telemetry.spans
  # 一个 ScaledJob 一个租户的一个任务族；加任务族时另起 release 或复制模板，消费组也要各用各的（位置表示这个任务族评测到了哪里）。
  consumerGroup: learning
  # 上次评测成功之后新到的记录（Collector 每批 span 一条）超过 activationLagThreshold 才起 Job；pollingInterval 秒查一次。
  # 失败的 Job 不提交，下一轮重跑，所以 pollingInterval 也是重试的间隔。
  activationLagThreshold: 100
  pollingInterval: 600
  lagThreshold: 1000
  maxReplicaCount: 1
  tenant: t1
  family: finance.invoice_coding
  budgetUsd: "0.5"
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}

# OpenTelemetry Collector：一路收（OTLP），三路发（Tempo、Langfuse、Redpanda）；配置在 files/otel-collector.yaml。
collector:
  image: otel/opentelemetry-collector-contrib:0.135.0
  replicas: 1
  resources:
    requests: {cpu: 200m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}
