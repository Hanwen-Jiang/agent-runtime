# SOPS 的加密规则（docs/plan/cloud-deploy.md D-02）：secrets.enc.yaml 里只加密 Secret 的 data 与 stringData，键名与元数据保持明文，
# 方便看 diff。收件人是部署机的 age 公钥（age-keygen 生成；私钥只在部署机上，不进仓库）。换成自己的公钥再用。
creation_rules:
  - path_regex: secrets\.enc\.yaml$
    encrypted_regex: ^(data|stringData)$
    age: age1replacewithyourdeploymachinepublickeyxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
