# 集群要的全部 Secret（docs/plan/cloud-deploy.md D-02、D-03、D-04）。只有占位符 REPLACE_ME；照着它写 secrets.yaml，
# 再用 SOPS 加密成 secrets.enc.yaml（见 README.md），明文的 secrets.yaml 不进仓库（.gitignore）。
# 口令随机生成：openssl rand -base64 32；dev-signing-key、sandbox/token-key 至少 32 字节。
---
# Runtime 的 SecretStore 种子与开发令牌的签名密钥（Chart 的 secrets.existingSecret）。
# secrets.json 是开发 SecretStore 的格式；平台作用域（_platform）里放：
#   model-provider/api-key           模型供应商的密钥（Model Gateway）
#   registry/publish-token           Registry 的发布令牌（Learning Pipeline、种子）
#   sandbox/token-key                K8s 沙箱 agent 的令牌密钥（同一部署的 Worker 共用，D-05）
#   sandbox/cloudflare-bridge-token  Cloudflare 桥的令牌（用 Cloudflare 后端时，D-07）
#   sandbox/env-credential-key       沙箱环境凭据的签名密钥（Worker 签发，包镜像与出网网关校验，D-15、D-16；至少 32 字节）
#   pkg-mirror/admin-token           包镜像管理接口的令牌（清除与拉黑，D-15）
#   egress-gateway/admin-token       出网网关管理接口的令牌（收回授权；task-service 在 Task 结束时用它通知网关，D-16）
#   sandbox/env-registry             环境镜像仓库的推送凭据，JSON：{"username": "...", "password": "..."}（Worker 推构建产物，D-17）
#   workspace/credential-key         封 Workspace API 凭据的密钥（task-service 封、Worker 解，D-06；至少 32 字节）
#   judge/jev-api-key                TypeSafe Jev 的密钥（Chart 的 worker.judge=jev 时，交付的快速检查；feedback-2026-11-01 N-09）
apiVersion: v1
kind: Secret
metadata:
  name: agent-runtime-secrets
  namespace: agent-runtime
type: Opaque
stringData:
  dev-signing-key: REPLACE_ME
  secrets.json: |
    {"version": 1, "scopes": {"_platform": {"roles": [], "secrets": {
      "model-provider/api-key": "REPLACE_ME",
      "registry/publish-token": "REPLACE_ME",
      "sandbox/token-key": "REPLACE_ME",
      "sandbox/cloudflare-bridge-token": "REPLACE_ME",
      "sandbox/env-credential-key": "REPLACE_ME",
      "pkg-mirror/admin-token": "REPLACE_ME",
      "egress-gateway/admin-token": "REPLACE_ME",
      "sandbox/env-registry": "REPLACE_ME",
      "workspace/credential-key": "REPLACE_ME",
      "judge/jev-api-key": "REPLACE_ME"
    }}}}
---
# 环境镜像仓库的 htpasswd（Chart 的 worker.shell.environments.registry.htpasswdSecret；D-17）：
# htpasswd -nbB <用户> <口令>，用户与口令同 SecretStore 里的 sandbox/env-registry，也写进 k3s 的 registries.yaml（节点拉镜像）。
apiVersion: v1
kind: Secret
metadata:
  name: agent-runtime-env-registry
  namespace: agent-runtime
type: Opaque
stringData:
  htpasswd: REPLACE_ME
---
# 业务库的连接串（Chart 的 secrets.relationalDsn）；口令与 data/pg-agentruntime 相同。
apiVersion: v1
kind: Secret
metadata:
  name: agent-runtime-postgres
  namespace: agent-runtime
type: Opaque
stringData:
  dsn: postgresql://agentruntime:REPLACE_ME@pg-rw.data.svc:5432/agentruntime?sslmode=require
---
# Runtime 自己的 Valkey（Chart 的 secrets.valkeyUrl，CACHE-01；deploy/data/valkey.yaml）；口令与 data/valkey-agentruntime 相同。
apiVersion: v1
kind: Secret
metadata:
  name: agent-runtime-valkey
  namespace: agent-runtime
type: Opaque
stringData:
  url: valkey://:REPLACE_ME@valkey-agentruntime.data.svc:6379/0
---
# Collector 往 Langfuse 写 trace 的 Basic 认证：base64("<init-public-key>:<init-secret-key>")（observability/langfuse 里的那一对，
# Langfuse 第一次启动时按它建项目的 API Key，见 deploy/data/values/langfuse.yaml）。
apiVersion: v1
kind: Secret
metadata:
  name: agent-runtime-langfuse
  namespace: agent-runtime
type: Opaque
stringData:
  basic-auth: REPLACE_ME
---
# Cloudflare 的源站证书（SSL/TLS → Origin Server），Traefik 的 IngressRoute 用它（values-cloud.yaml 的 ingress.traefik.tlsSecretName）。
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-origin-tls
  namespace: agent-runtime
type: kubernetes.io/tls
stringData:
  tls.crt: REPLACE_ME
  tls.key: REPLACE_ME
---
# Postgres 的角色口令（deploy/data/postgres.yaml；CloudNativePG 要 basic-auth 类型，username 与角色同名）。
apiVersion: v1
kind: Secret
metadata:
  name: pg-agentruntime
  namespace: data
type: kubernetes.io/basic-auth
stringData:
  username: agentruntime
  password: REPLACE_ME
---
# Runtime 的 Valkey 的 default 用户口令（deploy/data/valkey.yaml）；不与 Langfuse 自带的 Valkey 共用。
# 只用字母与数字（它被写进 Valkey 的配置文件，也出现在上面 agent-runtime-valkey 的 URL 里），例如 openssl rand -hex 24。
apiVersion: v1
kind: Secret
metadata:
  name: valkey-agentruntime
  namespace: data
type: Opaque
stringData:
  password: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: pg-temporal
  namespace: data
type: kubernetes.io/basic-auth
stringData:
  username: temporal
  password: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: pg-langfuse
  namespace: data
type: kubernetes.io/basic-auth
stringData:
  username: langfuse
  password: REPLACE_ME
---
# Postgres 备份写 R2 的凭据（R2 → Manage API tokens，只给备份桶的读写）。
apiVersion: v1
kind: Secret
metadata:
  name: r2-backup
  namespace: data
type: Opaque
stringData:
  ACCESS_KEY_ID: REPLACE_ME
  ACCESS_SECRET_KEY: REPLACE_ME
---
# Langfuse（deploy/data/values/langfuse.yaml）。encryption-key 是 64 个十六进制字符（openssl rand -hex 32）。
apiVersion: v1
kind: Secret
metadata:
  name: langfuse
  namespace: observability
type: Opaque
stringData:
  salt: REPLACE_ME
  nextauth-secret: REPLACE_ME
  encryption-key: REPLACE_ME
  clickhouse-password: REPLACE_ME
  # 第一次启动时建的项目 API Key（pk-lf-…、sk-lf-…）与管理员（经端口转发登录界面用）。
  init-public-key: REPLACE_ME
  init-secret-key: REPLACE_ME
  init-user-email: REPLACE_ME
  init-user-password: REPLACE_ME
---
# Langfuse 自带的 Valkey：键名是 ACL 用户名，Langfuse 也用 default 连它（deploy/data/values/langfuse.yaml 的 redis.auth）。
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-redis
  namespace: observability
type: Opaque
stringData:
  default: REPLACE_ME
---
# Langfuse 连业务 Postgres 的口令（与 data/pg-langfuse 相同；Secret 跨不了命名空间）。
apiVersion: v1
kind: Secret
metadata:
  name: pg-langfuse
  namespace: observability
type: Opaque
stringData:
  password: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: r2-langfuse
  namespace: observability
type: Opaque
stringData:
  ACCESS_KEY_ID: REPLACE_ME
  ACCESS_SECRET_KEY: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: observability
type: Opaque
stringData:
  user: admin
  password: REPLACE_ME
