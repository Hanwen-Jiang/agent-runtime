# 集群与第三方组件的版本（docs/plan/cloud-deploy.md D-02、D-03）。install.sh 与 deploy/data/install.sh 读这里，不用 latest。
# 2026-10-27 按各项目的发布页核对过：都是当时已发布满两周的稳定版，Chart 版本都在各自仓库的 index.yaml 里。
# 升级时改这里、在提交信息里写明，再跑 scripts/check_chart_values.py 核对 deploy/data/values 的键名与新版本的 Chart 对得上。
K3S_VERSION=v1.36.5+k3s1
# gVisor 从 2026-07 起每个版本发一个包（gvisor.tar.bz2：runsc、containerd-shim-runsc-v1 与 gvisor-bin/），路径是发布日期。
GVISOR_RELEASE=20261005
KATA_VERSION=4.2.0
# Firecracker 与 jailer（D-20；install.sh 第 3b 步，有 /dev/kvm 时装）。v1.17.0 发布于 2026-09-10；sha256 是发布页
# firecracker-v1.17.0-x86_64.tgz.sha256.txt 的值（2026-11-04 下载核对过），install.sh 下载后按这里的值核对，不信下载来的校验文件。
# 客户机内核的版本在 deploy/images/firecracker/kernel.conf，guest 配置取同一个标签。
FIRECRACKER_VERSION=v1.17.0
FIRECRACKER_SHA256=06094a1108ae9e82aa4c23a775aa92758f53f1175d422270d9d6162cb9ade558
CERT_MANAGER_VERSION=v1.21.2
KEDA_VERSION=2.21.0
CNPG_CHART_VERSION=0.29.1
CNPG_BARMAN_PLUGIN_VERSION=v0.15.1
TEMPORAL_CHART_VERSION=1.7.0
QDRANT_CHART_VERSION=1.19.2
REDPANDA_CHART_VERSION=26.2.4
LANGFUSE_CHART_VERSION=2.1.4
# Langfuse 2.x 的 ClickHouse 由这个 operator 部署（oci://ghcr.io/clickhouse/clickhouse-operator-helm，要 cert-manager）。
CLICKHOUSE_OPERATOR_VERSION=0.0.8
# Tempo 与 Grafana 的 Chart 2026 年起由 grafana-community 发布（https://grafana-community.github.io/helm-charts）。
TEMPO_CHART_VERSION=3.1.0
GRAFANA_CHART_VERSION=13.5.1
# VictoriaMetrics 单机版（https://victoriametrics.github.io/helm-charts，TMP 计划第 9.3 节）；2026-10-29 核对：0.49.0 发布于 2026-10-12。
VM_CHART_VERSION=0.49.0
SOPS_VERSION=v3.13.3
AGE_VERSION=v1.3.2
