# 按项目定制的运行环境的构建（docs/plan/cloud-deploy.md D-17）。构建的 Job 由 Sandbox Service 建（SBX-01；internal/envbuild），
# 标签 app.kubernetes.io/managed-by=agentruntime-env-builder。用户的 Dockerfile 不可信：
#
# - 只能跑在 Kata 里（Job 的 runtimeClassName 由 Sandbox Service 写死成登记里的 microVM 级 RuntimeClass；admission 另由下面的
#   ValidatingAdmissionPolicy 兜底：这个命名空间里没写 kata 的 Pod 一律拒绝）。BuildKit 要特权起容器，特权只在 VM 里：
#   Kata 要配 privileged_without_host_devices = true（kata-deploy 默认如此，install.sh 核对）。所以 Pod Security 是 privileged。
# - 网络：默认拒绝一切进出；只出到出网网关的 8095 与包镜像的 8093（Chart 里的 builds-egress 放行），加上 DNS；进只有 Sandbox Service
#   来取构建产物（构建 Pod 里的 sandbox-agent，7070）。
# - 资源：命名空间的总量有上限；一次构建的镜像大小由 Job 的 emptyDir sizeLimit 与 ephemeral-storage 限住。
# - 仓库里的文件：工作区目录的第三个静态 PV（只读，见文件末尾；另两个在 workspaces.yaml），构建 Pod 用 subPath 只挂本租户的那个 workspace。
apiVersion: v1
kind: Namespace
metadata:
  name: sandbox-builds
  labels:
    app.kubernetes.io/part-of: agent-runtime
    agentruntime.io/role: sandbox-builds
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: sandbox-builds
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-service-to-builder
  namespace: sandbox-builds
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: agentruntime-env-builder
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent-runtime
          podSelector:
            matchLabels:
              app.kubernetes.io/component: sandbox-service
      ports:
        - protocol: TCP
          port: 7070
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-builds
  namespace: sandbox-builds
spec:
  hard:
    pods: "6"
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "12"
    limits.memory: 24Gi
    limits.ephemeral-storage: 80Gi
---
# 兜底：这个命名空间里的 Pod 必须用 microVM 的 RuntimeClass，不能用宿主的网络、PID、IPC，不能挂宿主路径。
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: sandbox-builds-in-microvm
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchLabels:
        agentruntime.io/role: sandbox-builds
  validations:
    - expression: "has(object.spec.runtimeClassName) && object.spec.runtimeClassName == 'kata'"
      message: "sandbox-builds 里的 Pod 只能跑在 Kata（microVM）里"
    - expression: "!has(object.spec.hostNetwork) || !object.spec.hostNetwork"
      message: "不能用宿主的网络"
    - expression: "(!has(object.spec.hostPID) || !object.spec.hostPID) && (!has(object.spec.hostIPC) || !object.spec.hostIPC)"
      message: "不能用宿主的 PID 与 IPC"
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))"
      message: "不能挂宿主路径"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: sandbox-builds-in-microvm
spec:
  policyName: sandbox-builds-in-microvm
  validationActions: [Deny]
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: agentruntime-workspaces-builds
  labels:
    agentruntime.io/volume: workspaces
spec:
  capacity: {storage: 200Gi}
  accessModes: [ReadOnlyMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: agentruntime-workspaces
  claimRef: {namespace: sandbox-builds, name: workspaces}
  hostPath:
    path: /var/lib/agentruntime/workspaces
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspaces
  namespace: sandbox-builds
spec:
  accessModes: [ReadOnlyMany]
  storageClassName: agentruntime-workspaces
  volumeName: agentruntime-workspaces-builds
  resources:
    requests: {storage: 200Gi}
