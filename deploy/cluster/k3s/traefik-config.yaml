# k3s 自带 Traefik 的配置（/var/lib/rancher/k3s/server/manifests/traefik-config.yaml；docs/plan/cloud-deploy.md D-02、D-04）。
# - 80 端口一律跳到 443；源站证书是 Cloudflare 的（Cloudflare 的 SSL 模式 Full (strict)）。
# - Task API 的事件流是 SSE：不全局开压缩、缓冲之类的中间件；长连接不设写超时。
# - 源站只接受 Cloudflare 来的请求由防火墙做（README 的“防火墙”一节），这里只信任 Cloudflare 转发的客户端地址头。
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      web:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
      websecure:
        transport:
          respondingTimeouts:
            readTimeout: 60s
            writeTimeout: 0s
            idleTimeout: 180s
        forwardedHeaders:
          # Cloudflare 的地址段（https://www.cloudflare.com/ips/），变了要跟着改。
          trustedIPs:
            - 173.245.48.0/20
            - 103.21.244.0/22
            - 103.22.200.0/22
            - 103.31.4.0/22
            - 141.101.64.0/18
            - 108.162.192.0/18
            - 190.93.240.0/20
            - 188.114.96.0/20
            - 197.234.240.0/22
            - 198.41.128.0/17
            - 162.158.0.0/15
            - 104.16.0.0/13
            - 104.24.0.0/14
            - 172.64.0.0/13
            - 131.0.72.0/22
    providers:
      kubernetesCRD:
        allowCrossNamespace: false
      kubernetesGateway:
        enabled: true
    logs:
      access:
        enabled: true
