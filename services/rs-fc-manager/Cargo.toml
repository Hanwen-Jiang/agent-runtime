[package]
name = "fc-manager"
version = "0.1.0"
edition = "2024"
publish = false
description = "Host service that runs one Firecracker microVM per sandbox environment (D-20)"
license = "UNLICENSED"

# D-28 的根 Cargo workspace 落到 main 之前，这个 crate 自成 workspace（Cargo.lock 在本目录）。
# 根 workspace 落地后：删掉这一节与本目录的 Cargo.lock，在根 Cargo.toml 的 members 里加上 services/rs-fc-manager。
[workspace]

[lib]
name = "fc_manager"
path = "src/lib.rs"

[[bin]]
name = "fc-manager"
path = "src/main.rs"

# 测试替身：一个可执行文件按自己的文件名扮演 jailer、firecracker、ip（tests/common）。install.sh 只装 fc-manager。
[[bin]]
name = "fc-fake"
path = "src/bin/fc-fake.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# unsafe 只在 src/sys.rs（kill、statfs 的薄封装），那里单独放开。
[lints.rust]
unsafe_code = "deny"
