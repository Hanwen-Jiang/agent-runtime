[package]
name = "fc-manager"
version = "0.1.0"
description = "Host service that runs one Firecracker microVM per sandbox environment (D-20)"
# 根 Cargo workspace（D-28）的成员；Cargo.lock 在仓库根。
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "fc_manager"
path = "src/lib.rs"

[[bin]]
name = "fc-manager"
path = "src/main.rs"

# 测试替身：一个可执行文件按自己的文件名扮演 jailer、firecracker、ip（tests/common）。install.sh 只装 fc-manager。
[[bin]]
name = "fc-fake"
path = "src/bin/fc-fake.rs"

[dependencies]
rs-sys.workspace = true
rs-transfer.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true

# unsafe 只在 libs/rs-sys（根 Cargo.toml 的 workspace.lints 一律 deny）。
[lints]
workspace = true
