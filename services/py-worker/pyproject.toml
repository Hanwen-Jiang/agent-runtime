[project]
name = "agentruntime-worker"
version = "0.0.0"
description = "Worker：Task Loop（Planner、Stage Runner、Node Executor、Reviewer），以及进程内的 Policy Engine 与 Context Builder"
requires-python = ">=3.13"
dependencies = [
    "agentruntime-core",
    "agentruntime-proto",
    # Node Executor 按 output_schema 校验结果（JSON Schema 2020-12）。
    "jsonschema>=4.26",
    "protobuf>=7.36.2,<8",
    "temporalio>=1.34",
]

[project.optional-dependencies]
# 只有跑测试时才需要：stub 的输出要对照 /schemas 校验。
test = [
    "jsonschema>=4.26",
    "jsonschema-specifications>=2025.9.1",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "referencing>=0.37",
]

[tool.uv.sources]
agentruntime-core = { workspace = true }
agentruntime-proto = { workspace = true }

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentruntime_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "temporal: 需要 Temporal 本地开发服务（PATH 上的 temporal，即 Temporal CLI）",
]
filterwarnings = [
    # 用到 Temporal 的测试模块用模块级的会话事件循环标记，同步用例会触发这条无害的警告。
    "ignore:The test <Function .*> is marked with '@pytest.mark.asyncio' but it is not an async function:pytest.PytestWarning",
]
