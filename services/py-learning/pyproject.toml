[project]
name = "agentruntime-learning"
version = "0.0.0"
description = "Learning Pipeline：从 trace 学习，更新 Model Profile、Recipe 与路由"
requires-python = ">=3.13"
dependencies = [
    "agentruntime-proto",
]

[tool.uv.sources]
agentruntime-proto = { workspace = true }

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentruntime_learning"]
