[project]
name = "agentruntime-learning"
version = "0.0.0"
description = "Learning Pipeline：从 trace 学习，更新 Model Profile、Recipe 与路由；评测集与评测 harness（S-08）"
requires-python = ">=3.13"
dependencies = [
    "agentruntime-proto",
    # 评测的被测对象是 Worker 的 Planner 与 Reviewer（S-09、S-10）；结构校验复用 Stage Runner 的 DAG 检查。
    "agentruntime-worker",
    # 评测集与被测输出对照 /schemas 校验（JSON Schema 2020-12）。
    "jsonschema>=4.26",
    "jsonschema-specifications>=2025.9.1",
    "referencing>=0.37",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
]

[tool.uv.sources]
agentruntime-proto = { workspace = true }
agentruntime-worker = { workspace = true }

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentruntime_learning"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
