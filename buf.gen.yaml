version: v2
# 生成代码提交进仓库；改 proto 后运行 buf generate 并一同提交。
# 插件版本与运行时库对齐：
#   protocolbuffers/go ↔ google.golang.org/protobuf；connectrpc/go ↔ connectrpc.com/connect；
#   protocolbuffers/python、pyi ↔ PyPI protobuf 7.36.x；grpc/python ↔ grpcio 1.84.x。
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/agentruntime/agent-runtime/proto/gen/go
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: proto/gen/go
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.21.0
    out: proto/gen/go
    opt: paths=source_relative
  - remote: buf.build/protocolbuffers/python:v36.2
    out: proto/gen/python
  - remote: buf.build/protocolbuffers/pyi:v36.2
    out: proto/gen/python
  - remote: buf.build/grpc/python:v1.84.0
    out: proto/gen/python
inputs:
  - directory: proto
